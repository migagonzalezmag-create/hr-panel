<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRnini · Panel de Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root {
  --bg:#0a0d14; --surface:#111520; --surface2:#161c2d; --border:#1e2640;
  --a:#4f8ef7; --b:#7c5cbf; --c:#2ecfa8; --w:#f7a34f; --d:#f75f5f;
  --text:#e8eaf2; --dim:#6b738f; --mid:#9ba3bb;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(79,142,247,.12) 0%,transparent 70%),
             radial-gradient(ellipse 60% 50% at 80% 100%,rgba(124,92,191,.10) 0%,transparent 60%),var(--bg);
  position:relative;overflow:hidden}
#login::before{content:'';position:absolute;inset:0;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:60px 60px;opacity:.3}
.lcard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:48px 44px;width:420px;box-shadow:0 0 60px rgba(79,142,247,.08),0 32px 64px rgba(0,0,0,.5);
  animation:fadeUp .6s ease}
.llogo{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.llogo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--a),var(--b));border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:18px}
.llogo h1{font-family:'Syne',sans-serif;font-size:20px;font-weight:700}
.llogo span{color:var(--a)}
.lcard h2{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;margin-bottom:6px}
.lcard>p{color:var(--mid);font-size:14px;margin-bottom:32px}
.roles{display:grid;gap:10px;margin-bottom:24px}
.rbtn{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;
  border:1.5px solid var(--border);background:var(--surface2);color:var(--text);
  cursor:pointer;transition:all .2s;text-align:left;font-family:inherit}
.rbtn:hover{border-color:var(--a);background:rgba(79,142,247,.07)}
.rbtn.active{border-color:var(--a);background:rgba(79,142,247,.12);box-shadow:0 0 20px rgba(79,142,247,.15)}
.ricon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.rinfo strong{display:block;font-size:14px;font-weight:600}
.rinfo small{color:var(--mid);font-size:12px}
.lbtn{width:100%;padding:14px;border-radius:12px;border:none;
  background:linear-gradient(135deg,var(--a),var(--b));color:#fff;
  font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;
  transition:opacity .2s,transform .1s;letter-spacing:.3px}
.lbtn:hover{opacity:.9;transform:translateY(-1px)}

/* LOADING */
#loading{display:none;min-height:100vh;align-items:center;justify-content:center;
  flex-direction:column;gap:20px;background:var(--bg)}
.spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--a);
  border-radius:50%;animation:spin .8s linear infinite}
#loading p{color:var(--mid);font-size:14px}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:60px;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100}
.tlogo{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--c));
  box-shadow:0 0 8px var(--a);animation:pulse 2s infinite}
.navtabs{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:4px;overflow-x:auto}
.ntab{padding:7px 14px;border-radius:7px;border:none;background:transparent;color:var(--dim);
  font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.ntab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.ntab:hover:not(.active){color:var(--mid)}
.tright{display:flex;align-items:center;gap:10px}
.rbadge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.5px}
.ba{background:rgba(46,207,168,.15);color:var(--c);border:1px solid rgba(46,207,168,.25)}
.bs{background:rgba(247,163,79,.15);color:var(--w);border:1px solid rgba(247,163,79,.25)}
.bd{background:rgba(79,142,247,.15);color:var(--a);border:1px solid rgba(79,142,247,.25)}
.xbtn{padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;
  color:var(--dim);font-family:inherit;font-size:12px;cursor:pointer;transition:all .2s}
.xbtn:hover{border-color:var(--d);color:var(--d)}

/* CONTENT */
.content{flex:1;padding:24px;max-width:1440px;margin:0 auto;width:100%}
.sec{display:none;animation:fadeUp .3s ease}
.sec.active{display:block}

/* SECTION HEADER */
.sh{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.sh h2{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:3px}
.sh p{color:var(--mid);font-size:13px}

/* KPI GRID */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;
  position:relative;overflow:hidden;transition:transform .2s}
.kcard:hover{transform:translateY(-2px)}
.kcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kcard.ka::before{background:linear-gradient(90deg,var(--a),transparent)}
.kcard.kb::before{background:linear-gradient(90deg,var(--b),transparent)}
.kcard.kc::before{background:linear-gradient(90deg,var(--c),transparent)}
.kcard.kw::before{background:linear-gradient(90deg,var(--w),transparent)}
.kcard.kd::before{background:linear-gradient(90deg,var(--d),transparent)}
.klbl{font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.kval{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;line-height:1;margin-bottom:6px}
.kcard.ka .kval{color:var(--a)} .kcard.kb .kval{color:var(--b)}
.kcard.kc .kval{color:var(--c)} .kcard.kw .kval{color:var(--w)} .kcard.kd .kval{color:var(--d)}
.kchg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.cup{background:rgba(46,207,168,.12);color:var(--c)} .cdo{background:rgba(247,95,95,.12);color:var(--d)}
.cne{background:rgba(107,115,143,.15);color:var(--dim)}

/* CHARTS */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.cgrid.c3{grid-template-columns:2fr 1fr 1fr}
@media(max-width:860px){.cgrid,.cgrid.c3{grid-template-columns:1fr}}
.cc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.ct{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;margin-bottom:3px}
.cs{font-size:11px;color:var(--dim);margin-bottom:14px}
canvas{max-height:220px}

/* TABLE */
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px}
.thead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.thead h3{font-family:'Syne',sans-serif;font-size:13px;font-weight:700}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:9px 18px;font-size:10px;font-weight:600;color:var(--dim);
  text-transform:uppercase;letter-spacing:.8px;background:var(--surface2);border-bottom:1px solid var(--border)}
td{padding:11px 18px;font-size:12px;border-bottom:1px solid rgba(30,38,64,.5)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(79,142,247,.03)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600}
.pg{background:rgba(46,207,168,.12);color:var(--c)} .pb{background:rgba(79,142,247,.12);color:var(--a)}
.pw{background:rgba(247,163,79,.12);color:var(--w)} .pd{background:rgba(247,95,95,.12);color:var(--d)}
.pgy{background:rgba(107,115,143,.15);color:var(--mid)}

/* SEARCH */
.sinput{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);
  padding:7px 12px;font-family:inherit;font-size:12px;outline:none;width:200px;transition:border-color .2s}
.sinput:focus{border-color:var(--a)}

/* ALERT */
.alert{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;margin-bottom:10px;font-size:12px}
.aw{background:rgba(247,163,79,.1);border:1px solid rgba(247,163,79,.25);color:var(--w)}
.ad{background:rgba(247,95,95,.1);border:1px solid rgba(247,95,95,.25);color:var(--d)}
.ai{background:rgba(79,142,247,.08);border:1px solid rgba(79,142,247,.2);color:var(--a)}
.ag{background:rgba(46,207,168,.08);border:1px solid rgba(46,207,168,.2);color:var(--c)}

/* FORM */
.fcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:18px}
.fcard h3{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:700px){.fgrid,.fg3{grid-template-columns:1fr}}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
label{font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.6px}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:9px 12px;font-family:inherit;font-size:13px;transition:border-color .2s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(79,142,247,.1)}
select option{background:var(--surface2)}
textarea{resize:vertical;min-height:70px}
.brow{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.btn{padding:9px 18px;border-radius:8px;border:none;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.btp{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.btp:hover{opacity:.88;transform:translateY(-1px)}
.bts{background:var(--surface2);border:1px solid var(--border);color:var(--mid)}
.bts:hover{border-color:var(--a);color:var(--text)}

/* PROGRESS */
.pbar{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:3px}
.pfill{height:100%;border-radius:3px}

/* COST */
.chl{background:linear-gradient(135deg,rgba(79,142,247,.08),rgba(124,92,191,.08));
  border:1px solid rgba(79,142,247,.2);border-radius:14px;padding:22px;margin-bottom:18px}
.chlg{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:600px){.chlg{grid-template-columns:1fr 1fr}}
.ci h4{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.ci .amt{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--a)}
.ci .amt.dng{color:var(--d)} .ci .amt.grn{color:var(--c)}

/* AVATAR */
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--dim)}
.empty .em{font-size:36px;margin-bottom:10px}
.empty p{font-size:13px}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--c);
  border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--c);box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:999;
  transform:translateY(60px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}

/* MOBILE NAV */
@media(max-width:640px){
  .topbar{flex-wrap:wrap;height:auto;padding:10px 14px;gap:8px}
  .navtabs{width:100%;order:3}
  .content{padding:14px}
  .kgrid{grid-template-columns:1fr 1fr}
  .chlg{grid-template-columns:1fr 1fr}
  th,td{padding:8px 12px}
  .sinput{width:100%}
  .lcard{width:95%;padding:32px 24px}
}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 8px var(--a)}50%{box-shadow:0 0 16px var(--a),0 0 4px var(--c)}}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lcard">
    <div class="llogo">
      <div class="llogo-icon">📊</div>
      <h1>HR<span>nini</span></h1>
    </div>
    <h2>Bienvenido/a</h2>
    <p>Ingresá con tu usuario y contraseña</p>
    <div style="display:grid;gap:12px;margin-bottom:20px">
      <div class="fg">
        <label style="font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:block">Usuario</label>
        <input type="email" id="inp-user" placeholder="tu@email.com" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="fg">
        <label style="font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:block">Contraseña</label>
        <input type="password" id="inp-pass" placeholder="••••••••" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div id="login-error" style="display:none;color:var(--d);font-size:12px;background:rgba(247,95,95,.1);border:1px solid rgba(247,95,95,.25);border-radius:8px;padding:10px 12px">
        ❌ Usuario o contraseña incorrectos
      </div>
    </div>
    <button class="lbtn" onclick="doLogin()">Ingresar →</button>
    <p style="text-align:center;margin-top:14px;font-size:11px;color:var(--dim)">¿Problemas para ingresar? Contactá a RRHH</p>
  </div>
</div>

<!-- LOADING -->
<div id="loading" style="display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:var(--bg)">
  <div class="spinner"></div>
  <p style="color:var(--mid);font-size:14px">Cargando datos desde Google Sheets…</p>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="tlogo"><div class="dot"></div>HR<span style="color:var(--a)">nini</span></div>
    <div class="navtabs" id="navtabs"></div>
    <div class="tright">
      <span id="rbadge" class="rbadge"></span>
      <button class="xbtn" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="toast" id="toast">✓ <span id="tmsg"></span></div>

async function doLogin(){
  const userVal = (document.getElementById('inp-user').value||'').trim().toLowerCase();
  const passVal = (document.getElementById('inp-pass').value||'').trim();
  const errEl = document.getElementById('login-error');
  errEl.style.display='none';

  if(!userVal||!passVal){ errEl.style.display='block'; errEl.textContent='❌ Completá usuario y contraseña'; return; }

  // Show loading
  document.getElementById('login').style.display='none';
  document.getElementById('loading').style.display='flex';

  // Load users and employees in parallel
  await Promise.all([loadUsers(), loadData()]);

  document.getElementById('loading').style.display='none';

  // Find user
  const found = users.find(u =>
    (u['usuario']||'').trim().toLowerCase() === userVal &&
    (u['contraseña']||u['contrasena']||u['password']||'').trim() === passVal
  );

  if(!found){
    document.getElementById('login').style.display='flex';
    errEl.style.display='block';
    errEl.textContent='❌ Usuario o contraseña incorrectos';
    return;
  }

  currentUser = found;
  role = (found['rol']||'analyst').trim().toLowerCase();
  document.getElementById('app').style.display='flex';
  buildApp();
}

async function loadUsers(){
  const proxies = [
    USERS_URL,
    "https://corsproxy.io/?" + encodeURIComponent(USERS_URL),
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(USERS_URL),
  ];
  for(const url of proxies){
    try{
      const res = await fetch(url);
      if(!res.ok) continue;
      const txt = await res.text();
      if(!txt||txt.includes('<!DOCTYPE')) continue;
      const parsed = parseCSV(txt);
      if(parsed.length>0){ users=parsed; console.log('✅ Usuarios cargados:',parsed.length); return; }
    }catch(e){ console.warn('Users fetch failed:',e.message); }
  }
  console.warn('No se pudieron cargar usuarios desde Sheets');
  users = [];
}

// ─── DATA LOADER ──────────────────────────────────────────────
async function loadData(){
  // 1) Try live Google Sheets first (keeps data fresh when online)
  const urls = [
    SHEETS_URL,
    PROXY_URL,
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(SHEETS_URL),
  ];
  for(const url of urls){
    try {
      const res = await fetch(url);
      if(!res.ok) continue;
      const txt = await res.text();
      if(!txt || txt.includes("<!DOCTYPE")) continue;
      const parsed = parseCSV(txt);
      if(parsed.length > 0){
        employees = parsed;
        console.log("✅ Datos en vivo cargados:", parsed.length, "empleados");
        return;
      }
    } catch(e){
      console.warn("Intento online fallido:", e.message);
    }
  }
  // 2) Fallback: use embedded data (always works, offline-safe)
  if(EMBEDDED_DATA && EMBEDDED_DATA.length > 0){
    employees = EMBEDDED_DATA;
    console.log("✅ Datos embebidos cargados:", employees.length, "empleados");
    return;
  }
  employees = [];
}

function parseCSV(txt){
  const lines = txt.trim().split('\n');
  const headers = lines[0].split(',').map(h=>h.trim().replace(/"/g,''));
  return lines.slice(1).map(line=>{
    const vals = splitCSVLine(line);
    const obj = {};
    headers.forEach((h,i)=>{ obj[h] = (vals[i]||'').trim().replace(/"/g,''); });
    return obj;
  }).filter(e=>e['Legajo']&&e['Legajo'].trim()!=='');
}

function splitCSVLine(line){
  const result=[]; let cur='', inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){inQ=!inQ}
    else if(c===','&&!inQ){result.push(cur);cur='';}
    else cur+=c;
  }
  result.push(cur);
  return result;
}

function calcAntig(fechaStr){
  if(!fechaStr) return 0;
  const d = new Date(fechaStr);
  if(isNaN(d)) return 0;
  return ((new Date()-d)/1000/60/60/24/365.25);
}

function antigTab(el){

  employees.forEach(e=>{
    const a=calcAntig(e['Fecha Ingreso']);

    else if(a<3) tramos['1-3 años'].push(n);
    else if(a<5) tramos['3-5 años'].push(n);
    else if(a<10) tramos['5-10 años'].push(n);

  return `<table><thead><tr><th>Empleado</th><th>Sector</th><th>Tipo</th><th>Desde</th><th>Días</th><th>Estado</th></tr></thead>

function submitNov(){
  const sec=document.getElementById('nov-sec').value;
  const empSel=document.getElementById('nov-emp');
  const tipo=document.getElementById('nov-tipo').value;
  const desde=document.getElementById('nov-desde').value;
  const hasta=document.getElementById('nov-hasta').value;
  const dias=document.getElementById('nov-dias').value;
  const obs=document.getElementById('nov-obs').value;
  if(!sec||!empSel.value||!tipo||!desde){alert('Completá los campos obligatorios');return;}
  const nombre=empSel.options[empSel.selectedIndex].text.split('(')[0].trim();
  novedades.push({nombre,sector:sec,tipo,desde,hasta,dias,obs});
  document.getElementById('nov-list').innerHTML=novListHTML();
  clearNov();
  showToast('Novedad enviada a RRHH ✓');
}

function clearNov(){
  ['nov-sec','nov-emp','nov-tipo','nov-hasta','nov-obs'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  const d=document.getElementById('nov-dias');if(d)d.value='';
  const f=document.getElementById('nov-desde');if(f)f.value=todayStr();
}

      const sEmp=employees.filter(e=>e['Sector']===sec);
      const pct=((cnt/total)*100).toFixed(1);
      const antP=avg(sEmp.map(e=>calcAntig(e['Fecha Ingreso']))).toFixed(1);
      const mujeres=sEmp.filter(e=>e['sexo']==='F').length;
      const mPct=((mujeres/cnt)*100).toFixed(0);
      const conv=Object.entries(countBy(sEmp,'Convenio')).sort((a,b)=>b[1]-a[1])[0];
      return `<tr>
        <td><strong>${sec}</strong></td>
        <td><span style="font-weight:700;color:var(--a)">${cnt}</span></td>
        <td><div style="display:flex;align-items:center;gap:8px">
          <span>${pct}%</span>
          <div class="pbar" style="width:80px"><div class="pfill" style="width:${Math.min(pct*4,100)}%;background:var(--a)"></div></div>
        </div></td>
        <td style="font-weight:600;color:var(--c)">${antP}a</td>
        <td>${mPct}%</td>
        <td><span class="pill ${convPill(conv?conv[0]:'')}">${conv?conv[0]:'-'}</span></td>
      </tr>`;}).join('')}
    </tbody></table>
  </div></div>`;

  setTimeout(()=>{
    charts.distall=new Chart(document.getElementById('ch-dist-all'),{type:'bar',
      data:{labels:sorted.map(e=>e[0]),datasets:[{data:sorted.map(e=>e[1]),
        backgroundColor:sorted.map((_,i)=>`hsl(${210+(i*15)%150},65%,${45+(i%3)*8}%)`),borderRadius:5,borderSkipped:false}]},
      options:{plugins:{legend:{display:false}},scales:{
        x:{ticks:{color:'#6b738f',font:{size:9},maxRotation:50},grid:{display:false}},
        y:{ticks:{color:'#6b738f'},grid:{color:'#1e2640'}}}}});
  },50);
}

// ─── UTILS ────────────────────────────────────────────────────
function countBy(arr,key){
  return arr.reduce((acc,e)=>{const v=e[key]||'Sin dato';acc[v]=(acc[v]||0)+1;return acc;},{});
}
function avg(arr){ return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0; }
function avInit(n){ return (n||'?').split(/[\s,]+/).filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase(); }
function avColor(n){ const c=['rgba(79,142,247,.25)','rgba(124,92,191,.25)','rgba(46,207,168,.2)','rgba(247,163,79,.2)','rgba(247,95,95,.2)']; return c[(n.charCodeAt(0)||0)%c.length]; }
function convPill(c){ return c==='Comercio'?'pb':c==='Camioneros'?'pw':c==='Fuera de Convenio'?'pgy':'pg'; }
function todayStr(){ return new Date().toISOString().split('T')[0]; }
function showToast(msg){ const t=document.getElementById('toast'); document.getElementById('tmsg').textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
</script>
