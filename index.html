    monto: parseFloat(n['Monto Negociado'])||0, indem: parseFloat(n['Indem Ley'])||0,
  })).filter(n => n.monto > 0 && n.indem > 0 && n.anio >= anioAct - 2);
  const prom = (arr) => arr.length ? arr.reduce((s,n)=>s + n.monto/n.indem*100, 0) / arr.length : null;
  const sector = String(emp['Sector']||'').trim().toLowerCase();
  const sede = String(emp['Ubicación']||'').trim().toLowerCase();
  const sameSede = filas.filter(n => n.sede && (sede.includes(n.sede) || n.sede.includes(sede)));
  return [
    { lbl: 'Todos (' + (anioAct-2) + '-' + anioAct + ')', n: filas.length, p: prom(filas) },
    { lbl: 'Sector ' + (emp['Sector']||''), n: filas.filter(n=>n.sector===sector).length, p: prom(filas.filter(n=>n.sector===sector)) },
    { lbl: 'Sede ' + (emp['Ubicación']||''), n: sameSede.length, p: prom(sameSede) },
  ];
}

function liqRender(pctLibre){
  if(!liqUltimo) return;
  const { r, emp } = liqUltimo;
  const R = r.rubros, E = r.escenarios;
  const out = document.getElementById('liq-out');
  const ant = r.antig;
  const antTxt = `${ant.anios} años, ${ant.meses} meses y ${ant.dias} días`;
  const fila = (lbl, a, c, nota) => `<tr><td>${lbl}${nota?`<div style="font-size:10px;color:var(--dim)">${nota}</div>`:''}</td>
    <td style="text-align:right">${a===null?'—':liqMoney(a)}</td><td style="text-align:right">${c===null?'—':liqMoney(c)}</td></tr>`;

  const pcts = [50,60,70,80,100];
  const pLibre = pctLibre != null ? pctLibre : (Number(document.getElementById('liq-pct')?.value) || 65);
  const filaArr = (p) => {
    const monto = E.sinCausa * p / 100;
    const bajo = monto < E.conCausa;
    return `<tr><td><strong>${p} %</strong></td><td style="text-align:right">${liqMoney(monto)}</td>
      <td style="text-align:right;color:var(--c)">${liqMoney(E.sinCausa - monto)}</td>
      <td>${bajo?'<span class="pill" style="background:rgba(232,25,17,.15);color:var(--d)">Menos que la liquidación final</span>':''}</td></tr>`;
  };
  const hist = liqHistorico(emp);

  const varRows = r.variables.length ? r.variables.map(v => `<tr><td>${escHtml(v.concepto)}</td><td style="text-align:center">${v.mesesCobrados} de ${r.mesesConDatos.length}</td>
     <td style="text-align:right">${liqMoney(v.prom6)}</td><td style="text-align:right">${liqMoney(v.prom12)}</td>
     <td style="text-align:right;${v.habitual?'':'color:var(--dim)'}">${v.habitual?liqMoney(v.usado):'—'}</td><td style="font-size:11px;color:var(--dim)">${v.criterio}</td></tr>`).join('')
     : '<tr><td colspan="6" style="color:var(--dim)">Sin conceptos variables.</td></tr>';
  const conceptosMes = r.conceptosMejorMes.map(c => `<tr><td>${escHtml(c[0])}</td><td>${c[2]==='NOREM'?'No remunerativo':'Fijo'}</td><td style="text-align:right">${liqMoney(c[1])}</td></tr>`).filter((x,i)=>r.conceptosMejorMes[i][2]!=='VARIABLE').join('');

  out.innerHTML = `
    <div class="fcard">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px">
        <div><div style="font-family:'Poppins',sans-serif;font-size:18px;font-weight:800">${escHtml(emp['Nombre'])}</div>
          <div style="color:var(--mid);font-size:12px;margin-top:4px">Legajo ${escHtml(String(emp['Legajo']))} · ${escHtml(emp['Sector']||'')} · ${escHtml(emp['Ubicación']||'')} · ${escHtml(emp['Convenio']||'')} ${emp['Categoria']?'· '+escHtml(emp['Categoria']):''}</div></div>
        <div style="text-align:right;font-size:12px;color:var(--mid)">Ingreso ${r.ingreso} · Egreso ${r.egreso}<br>Antigüedad: <strong style="color:var(--text)">${antTxt}</strong> → ${r.antig.aniosIndemn} ${r.antig.aniosIndemn===1?'año':'años'} para indemnizar</div>
      </div>
    </div>

    ${r.notas.map(n => `<div class="alert" style="background:rgba(217,119,6,.08);color:var(--w)">⚠️ ${escHtml(n)}</div>`).join('')}

    <div class="kgrid">
      <div class="kcard"><div class="klbl">Despido sin causa (art. 245)</div><div class="kval" style="font-size:22px">${liqMoney(E.sinCausa)}</div></div>
      <div class="kcard"><div class="klbl">Con causa / renuncia</div><div class="kval" style="font-size:22px">${liqMoney(E.conCausa)}</div></div>
      <div class="kcard"><div class="klbl">Base indemnizatoria</div><div class="kval" style="font-size:22px">${liqMoney(r.baseTopeada)}</div>
        <div style="font-size:11px;color:var(--dim)">${r.topeAplicado?(r.pisoAplicado?'Tope con piso del 67 % (Vizzoti)':'Con tope del convenio'):'Sin tope (la base no supera el tope)'}</div></div>
    </div>

    <div class="tcard"><div class="thead"><div class="ct">Liquidación por escenario</div></div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Rubro</th><th style="text-align:right">Sin causa</th><th style="text-align:right">Con causa / renuncia</th></tr></thead>
        <tbody>
          ${fila('Indemnización por antigüedad', R.indem245, null, `${liqMoney(r.baseTopeada)} × ${r.antig.aniosIndemn}`)}
          ${fila('Preaviso', R.preaviso, null, r.rubros.preaviso? `${r.mesesPreaviso} ${r.mesesPreaviso===1?'mes':'meses'} × ${liqMoney(r.sueldoNormal)}` : 'No corresponde o ya se otorgó')}
          ${fila('SAC sobre preaviso', R.sacPreaviso, null)}
          ${fila('Integración del mes de despido', R.integracion, null)}
          ${fila('SAC sobre integración', R.sacIntegracion, null)}
          ${fila('Días trabajados del mes', R.diasTrab, R.diasTrab)}
          ${fila('SAC proporcional', R.sacProp, R.sacProp, `${liqMoney(r.mejorSem)} ÷ 2 × ${r.diasSem}/${r.totalSem} días (mejor mes del semestre: ${r.mesMejorSem})`)}
          ${fila('Vacaciones no gozadas', R.vacaciones, R.vacaciones, `${r.diasVacAnio} días por ${r.antigVac} años de antigüedad × ${r.diasTrabAnio}/365 días trabajados en el año = ${r.vacProp.toLocaleString('es-AR')}${r.vacGozadas?` − ${r.vacGozadas} ya gozados`:''} → ${r.vacDias.toLocaleString('es-AR')} días × ${liqMoney(r.valorDiaVac)} (sueldo ÷ 25)`)}
          ${fila('SAC sobre vacaciones', R.sacVacaciones, R.sacVacaciones)}
          <tr style="font-weight:700"><td>Total bruto</td><td style="text-align:right">${liqMoney(E.sinCausa)}</td><td style="text-align:right">${liqMoney(E.conCausa)}</td></tr>
        </tbody></table></div></div>

    <div class="cgrid">
      <div class="cc"><div class="ct">Simulador de arreglo</div><div class="cs">Porcentaje sobre el total del despido sin causa (${liqMoney(E.sinCausa)})</div>
        <table><thead><tr><th>%</th><th style="text-align:right">Se paga</th><th style="text-align:right">Diferencia vs. sin causa</th><th></th></tr></thead>
        <tbody>${pcts.map(filaArr).join('')}
          <tr class="liq-noprint"><td><input class="sinput" type="number" id="liq-pct" min="0" max="150" step="1" value="${pLibre}" style="width:70px" oninput="liqRender(Number(this.value))"> %</td>
          <td style="text-align:right"><strong>${liqMoney(E.sinCausa*pLibre/100)}</strong></td><td style="text-align:right;color:var(--c)">${liqMoney(E.sinCausa - E.sinCausa*pLibre/100)}</td><td>${E.sinCausa*pLibre/100 < E.conCausa?'<span class="pill" style="background:rgba(232,25,17,.15);color:var(--d)">Menos que la liquidación final</span>':''}</td></tr>
        </tbody></table>
        <div style="font-size:11px;color:var(--dim);margin-top:10px">La liquidación final (${liqMoney(E.conCausa)}) se debe en cualquier caso: un arreglo por debajo de ese monto no la cubre.</div>
      </div>
      <div class="cc"><div class="ct">Referencia: arreglos anteriores</div><div class="cs">Hoja Negociaciones · % pagado = Monto negociado ÷ Indemnización de ley · últimos 3 años</div>
        <table><thead><tr><th>Grupo</th><th style="text-align:center">Casos</th><th style="text-align:right">% promedio</th><th style="text-align:right">Aplicado a este caso</th></tr></thead>
        <tbody>${hist.map(h => `<tr><td>${escHtml(h.lbl)}</td><td style="text-align:center">${h.n}</td><td style="text-align:right">${h.p==null?'—':liqPct(h.p)}</td><td style="text-align:right">${h.p==null?'—':liqMoney(E.sinCausa*h.p/100)}</td></tr>`).join('')}</tbody></table>
        <div style="font-size:11px;color:var(--dim);margin-top:10px">Ojo: en Negociaciones el % está calculado sobre la "Indem Ley" que se registró en cada caso, que puede no incluir los mismos rubros que este total.</div>
      </div>
    </div>

    <div class="tcard"><div class="thead"><div><div class="ct">Cómo se calculó la base</div>
      <div class="cs" style="margin:0">Mejor mes: ${r.mejorMes} · fijos ${liqMoney(r.mesFijo)} + no remunerativos ${liqMoney(r.mesNorem)} + variables habituales ${liqMoney(r.promVariables)} = <strong>${liqMoney(r.base)}</strong>
      ${r.tope?` · Tope ${escHtml(emp['Convenio']||'')}: ${liqMoney(r.tope)}${r.topeDesde?' (desde '+r.topeDesde+(r.topeFuente?', '+escHtml(r.topeFuente):'')+')':''}`:' · Sin tope cargado'}</div></div></div>
      <div style="overflow-x:auto"><table><thead><tr><th>Concepto del mejor mes</th><th>Tipo</th><th style="text-align:right">Monto</th></tr></thead><tbody>${conceptosMes||'<tr><td colspan="3">—</td></tr>'}</tbody></table></div>
      <div style="overflow-x:auto;border-top:1px solid var(--border)"><table><thead><tr><th>Concepto variable</th><th style="text-align:center">Meses cobrado</th><th style="text-align:right">Prom. 6 meses</th><th style="text-align:right">Prom. 12 meses</th><th style="text-align:right">Se toma</th><th>Criterio</th></tr></thead><tbody>${varRows}</tbody></table></div>
      <div style="padding:14px 18px;font-size:12px;color:var(--mid);border-top:1px solid var(--border)">
        Sueldo normal (para preaviso, días y vacaciones): último mes con datos (${r.ultimoMes}) + variables habituales = <strong>${liqMoney(r.sueldoNormal)}</strong>.
        Vacaciones: ${r.diasVacAnio} días por antigüedad × ${r.diasTrabAnio}/365 días trabajados en el año = ${r.vacProp.toLocaleString('es-AR')} días proporcionales.
        ${r.sinClasificar.length?'<br>Conceptos sin clasificar: '+escHtml(r.sinClasificar.join(', '))+'.':''}
      </div>
    </div>

    <div style="font-size:11px;color:var(--dim);line-height:1.6;margin-bottom:30px">
      Estimación para negociar: no reemplaza la liquidación oficial ni el asesoramiento legal. Montos brutos, antes de aportes y Ganancias.
      Criterios: art. 245 LCT según Ley 27.802 (sin SAC, vacaciones ni premios no mensuales; variables con 6+ meses de cobro; tope del CCT con piso del 67 %),
      sumas no remunerativas incluidas, viáticos de Camioneros excluidos, período de prueba de 6 meses. No incluye multas ni rubros por reclamos.
    </div>`;
  const inp = document.getElementById('liq-pct');
  if(pctLibre != null && inp){ inp.focus(); const v = inp.value; inp.value=''; inp.value=v; }
}

// Registro de Service Worker para instalar como app (PWA)
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw-hrnini.js').catch(() => {});
  });
}

// Si quedó una sesión abierta, entrar sin pedir la contraseña de nuevo
restaurarSesion();
</script>
