<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRnini · Panel de Gestión</title>
<link rel="manifest" href="manifest-hrnini.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/hrnini-192.png">
<link rel="apple-touch-icon" href="icons/hrnini-192.png">
<meta name="theme-color" content="#002E9D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HRnini">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="liquidacion.js"></script>
<style>
:root {
  /* Marca Nini (identidad/guia-de-marca.md): azul #002E9D, rojo #E81911 */
  --bg:#F5F7FB; --surface:#FFFFFF; --surface2:#F0F3F9; --border:#E3E8F2;
  --a:#002E9D; --b:#5B7FD6; --c:#0F7B4A; --w:#B45309; --d:#D2140D; --rojo:#E81911;
  --text:#1F2937; --dim:#5B6474; --mid:#4B5563;
  --card2:#F0F3F9; --txt:#1F2937;
}
*{margin:0;padding:0;box-sizing:border-box}
.ficha-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:14px}
.ficha-nombre{font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:700;color:var(--a);line-height:1.2}
.ficha-ini{width:96px;height:96px;border-radius:18px;background:rgba(0,46,157,.08);color:var(--a);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700}
.ficha-chip{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:100px;border:1px solid}
.ficha-datos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.ficha-dato{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:600}
.ficha-dato .klbl{margin-bottom:4px}
.ficha-monto{background:var(--surface2);border-radius:12px;padding:14px}
.ficha-monto>div:last-child{font-size:22px;font-weight:700;margin-top:4px}
@media(max-width:700px){.ficha-datos{grid-template-columns:1fr 1fr}#ficha-sec .kval{font-size:21px;word-break:break-word}#ficha-sec .cgrid>.cc{min-width:0}#ficha-sec table{font-size:11.5px}}
@media print{.sidebar,.topbar,.sb-overlay,.liq-noprint,.toast{display:none!important}.content{margin:0!important;padding:0!important;max-width:none!important}body{background:#fff!important;color:#000!important}.kcard,.cc,.tcard,.fcard{background:#fff!important;border-color:#bbb!important;break-inside:avoid}td,th,.klbl,.cs{color:#000!important}}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#002E9D 0,#002E9D 42%,var(--bg) 42%);
  position:relative;overflow:hidden}
#login::before{content:none}
.lcard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:44px 40px;width:420px;box-shadow:0 20px 50px rgba(0,30,100,.18);
  animation:fadeUp .6s ease}
.llogo{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.llogo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--a),var(--b));border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:18px}
.llogo h1{font-family:'Poppins',sans-serif;font-size:20px;font-weight:700;color:var(--a)}
.llogo img{height:46px;width:auto}
.llogo span{color:var(--a)}
.lcard h2{font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;color:var(--a);margin-bottom:6px}
.lcard>p{color:var(--mid);font-size:14px;margin-bottom:32px}
.roles{display:grid;gap:10px;margin-bottom:24px}
.rbtn{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;
  border:1.5px solid var(--border);background:var(--surface2);color:var(--text);
  cursor:pointer;transition:all .2s;text-align:left;font-family:inherit}
.rbtn:hover{border-color:var(--a);background:rgba(0,46,157,.07)}
.rbtn.active{border-color:var(--a);background:rgba(0,46,157,.12);box-shadow:0 0 20px rgba(0,46,157,.15)}
.ricon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.rinfo strong{display:block;font-size:14px;font-weight:600}
.rinfo small{color:var(--mid);font-size:12px}
.lbtn{width:100%;padding:14px;border-radius:12px;border:none;
  background:var(--a);color:#fff;
  font-family:'Poppins',sans-serif;font-size:15px;font-weight:600;cursor:pointer;
  transition:opacity .2s,transform .1s;letter-spacing:.3px}
.lbtn:hover{opacity:.9;transform:translateY(-1px)}

/* LOADING */
#loading{display:none;min-height:100vh;align-items:center;justify-content:center;
  flex-direction:column;gap:20px;background:var(--bg)}
.spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--a);
  border-radius:50%;animation:spin .8s linear infinite}
#loading p{color:var(--mid);font-size:14px}

/* APP */
#app{display:none;min-height:100vh}

/* SIDEBAR */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:110;
  transition:transform .3s ease}
.sb-logo{padding:20px 18px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--border)}
.sb-logo .tlogo{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--a)}
.sb-logo img{height:38px;width:auto}
.sb-logo small{display:block;font-size:11px;font-weight:400;color:var(--dim)}
.sb-group{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);padding:14px 14px 6px;display:flex;align-items:center;gap:8px}
.sb-group svg{width:14px;height:14px}
.sb-nav{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px}
.sb-tab{padding:9px 14px;border-radius:9px;border:none;background:transparent;color:var(--text);
  font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;transition:all .2s;
  text-align:left;white-space:nowrap;display:flex;align-items:center;gap:8px;text-decoration:none}
.sb-tab:hover:not(.active){color:var(--a);background:var(--surface2)}
.sb-tab.active{background:rgba(0,46,157,.12);color:var(--a);font-weight:600;
  box-shadow:none}
.sb-tab.sb-main.active{background:var(--a);color:#fff}
.sb-tab .tab-icon{width:18px;height:18px;display:inline-flex;flex-shrink:0}
.sb-tab .tab-icon svg{width:18px;height:18px}
.sb-footer{padding:14px 18px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.sb-user{display:flex;align-items:center;gap:8px}

/* TOPBAR (solo mobile) */
.topbar{display:none;align-items:center;padding:0 14px;height:50px;background:var(--surface);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.tlogo{font-family:'Poppins',sans-serif;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.dot{display:none}
.tright{display:flex;align-items:center;gap:10px}
.rbadge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.2px}
.ba{background:rgba(15,123,74,.15);color:var(--c);border:1px solid rgba(15,123,74,.25)}
.bs{background:rgba(217,119,6,.15);color:var(--w);border:1px solid rgba(217,119,6,.25)}
.bd{background:rgba(0,46,157,.15);color:var(--a);border:1px solid rgba(0,46,157,.25)}
.xbtn{padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;
  color:var(--dim);font-family:inherit;font-size:12px;cursor:pointer;transition:all .2s}
.xbtn:hover{border-color:var(--d);color:var(--d)}
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:105}

/* CONTENT */
.content{flex:1;padding:28px 32px;max-width:1440px;margin:0 auto;width:auto;margin-left:248px}
.sec{display:none;animation:fadeUp .3s ease}
.sec.active{display:block}

/* SECTION HEADER */
.sh{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.sh h2{font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;color:var(--a);margin-bottom:3px}
.sh p{color:var(--mid);font-size:13px}

/* KPI GRID */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 1px 2px rgba(16,24,40,.04);
  position:relative;overflow:hidden;transition:transform .2s}
.kcard:hover{transform:translateY(-2px)}
.kcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kcard.ka::before{background:var(--a)}
.kcard.kb::before{background:var(--b)}
.kcard.kc::before{background:var(--c)}
.kcard.kw::before{background:var(--w)}
.kcard.kd::before{background:var(--d)}
.klbl{font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.kval{font-family:'Poppins',sans-serif;font-size:28px;font-weight:700;line-height:1;margin-bottom:6px}
.kcard.ka .kval{color:var(--a)} .kcard.kb .kval{color:var(--b)}
.kcard.kc .kval{color:var(--c)} .kcard.kw .kval{color:var(--w)} .kcard.kd .kval{color:var(--d)}
.kchg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.cup{background:rgba(15,123,74,.12);color:var(--c)} .cdo{background:rgba(232,25,17,.12);color:var(--d)}
.cne{background:rgba(91,100,116,.15);color:var(--dim)}

/* CHARTS */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.cgrid.c3{grid-template-columns:2fr 1fr 1fr}
@media(max-width:860px){.cgrid,.cgrid.c3{grid-template-columns:1fr}}
.cc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.ct{font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;margin-bottom:3px}
.cs{font-size:11px;color:var(--dim);margin-bottom:14px}
canvas{max-height:220px}
#dash-sec canvas{max-height:none}
.dash-det{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
.dash-det summary{cursor:pointer;font-weight:600;color:var(--a);font-size:13px}
#dash-sec .kgrid{grid-template-columns:repeat(3,1fr)}
@media(max-width:768px){#dash-sec .kgrid{grid-template-columns:1fr 1fr}}

/* TABLE */
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);overflow:hidden;margin-bottom:20px}
.thead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.thead h3{font-family:'Poppins',sans-serif;font-size:13px;font-weight:700}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:9px 18px;font-size:10px;font-weight:600;color:var(--dim);
  text-transform:uppercase;letter-spacing:.8px;background:var(--surface2);border-bottom:1px solid var(--border)}
td{padding:11px 18px;font-size:12px;border-bottom:1px solid #EEF2F9}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(0,46,157,.03)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600}
.pg{background:rgba(15,123,74,.12);color:var(--c)} .pb{background:rgba(0,46,157,.12);color:var(--a)}
.pw{background:rgba(217,119,6,.12);color:var(--w)} .pd{background:rgba(232,25,17,.12);color:var(--d)}
.pgy{background:rgba(91,100,116,.15);color:var(--mid)}

/* SEARCH */
.sinput{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);
  padding:7px 12px;font-family:inherit;font-size:12px;outline:none;width:200px;transition:border-color .2s}
.sinput:focus{border-color:var(--a)}

/* ALERT */
.alert{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;margin-bottom:10px;font-size:12px}
.aw{background:rgba(217,119,6,.1);border:1px solid rgba(217,119,6,.25);color:var(--w)}
.ad{background:rgba(232,25,17,.1);border:1px solid rgba(232,25,17,.25);color:var(--d)}
.ai{background:rgba(0,46,157,.08);border:1px solid rgba(0,46,157,.2);color:var(--a)}
.ag{background:rgba(15,123,74,.08);border:1px solid rgba(15,123,74,.2);color:var(--c)}

/* FORM */
.fcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:18px}
.fcard h3{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;margin-bottom:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:700px){.fgrid,.fg3{grid-template-columns:1fr}}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
label{font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.6px}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:9px 12px;font-family:inherit;font-size:13px;transition:border-color .2s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(0,46,157,.1)}
select option{background:var(--surface2)}
textarea{resize:vertical;min-height:70px}
.brow{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.btn{padding:9px 18px;border-radius:8px;border:none;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.btp{background:var(--a);color:#fff}
.btp:hover{background:#001F6B}
.bts{background:var(--surface2);border:1px solid var(--border);color:var(--mid)}
.bts:hover{border-color:var(--a);color:var(--text)}

/* PROGRESS */
.pbar{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:3px}
.pfill{height:100%;border-radius:3px}

/* COST */
.chl{background:#EEF2FB;
  border:1px solid rgba(0,46,157,.2);border-radius:14px;padding:22px;margin-bottom:18px}
.chlg{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:600px){.chlg{grid-template-columns:1fr 1fr}}
.ci h4{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.ci .amt{font-family:'Poppins',sans-serif;font-size:20px;font-weight:800;color:var(--a)}
.ci .amt.dng{color:var(--d)} .ci .amt.grn{color:var(--c)}

/* AVATAR */
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0;overflow:hidden;white-space:nowrap;min-width:30px}
.notranslate,.av{-webkit-text-fill-color:initial}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--dim)}
.empty .em{font-size:36px;margin-bottom:10px}
.empty p{font-size:13px}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--c);
  border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--c);box-shadow:0 8px 24px rgba(16,24,40,.15);z-index:999;
  transform:translateY(60px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}

/* MOBILE */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sb-overlay.open{display:block}
  .topbar{display:flex}
  .hamburger{display:block}
  #app{flex-direction:column}
  .content{margin-left:0;padding:14px;min-width:0;max-width:100vw}
  .tcard{overflow-x:auto}
  .kgrid{grid-template-columns:1fr 1fr}
  .chlg{grid-template-columns:1fr 1fr}
  th,td{padding:8px 12px}
  .sinput{width:100%}
  .lcard{width:95%;padding:32px 24px}
}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 8px var(--a)}50%{box-shadow:0 0 16px var(--a),0 0 4px var(--c)}}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lcard">
    <div class="llogo">
      <img src="icons/nini-logo.png" alt="Logo de Nini">
      <h1>HRnini <small style="display:block;font-size:12px;font-weight:400;color:var(--dim)">Panel de Gestión de RRHH</small></h1>
    </div>
    <h2>Te damos la bienvenida</h2>
    <p>Ingresá con tu usuario y contraseña</p>
    <div style="display:grid;gap:12px;margin-bottom:20px">
      <div class="fg">
        <label style="font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:block">Usuario</label>
        <input type="text" id="inp-user" placeholder="Tu nombre y apellido" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="fg">
        <label style="font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:block">Contraseña</label>
        <input type="password" id="inp-pass" placeholder="••••••••" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div id="login-error" style="display:none;color:var(--d);font-size:12px;background:rgba(232,25,17,.1);border:1px solid rgba(232,25,17,.25);border-radius:8px;padding:10px 12px">
        Usuario o contraseña incorrectos
      </div>
    </div>
    <button class="lbtn" onclick="doLogin()">Ingresar →</button>
    <p style="text-align:center;margin-top:14px;font-size:11px;color:var(--dim)">¿Problemas para ingresar? Contactá a RRHH</p>
  </div>
</div>

<!-- LOADING -->
<div id="loading" style="display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:var(--bg)">
  <div class="spinner"></div>
  <p style="color:var(--mid);font-size:14px">Cargando datos desde Google Sheets…</p>
</div>

<!-- APP -->
<div id="app">
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sb-logo">
      <div class="tlogo"><img src="icons/nini-logo.png" alt="Logo de Nini"><div>HRnini<small>Panel de Gestión</small></div></div>
    </div>
    <div id="suc-filter" style="display:none;padding:10px 14px;border-bottom:1px solid var(--border);gap:4px;flex-wrap:wrap">
      <span style="font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.8px;width:100%;margin-bottom:2px">SEDE</span>
      <button id="suc-ambas" class="btn bts" style="font-size:11px;padding:4px 10px;flex:1" onclick="setAdminSucursal('ambas')">Ambas</button>
      <button id="suc-lp" class="btn" style="font-size:11px;padding:4px 10px;flex:1;background:var(--card2);color:var(--txt)" onclick="setAdminSucursal('la plata')">LP</button>
      <button id="suc-mo" class="btn" style="font-size:11px;padding:4px 10px;flex:1;background:var(--card2);color:var(--txt)" onclick="setAdminSucursal('moreno')">MO</button>
    </div>
    <div class="sb-nav" id="sb-nav"></div>
    <div class="sb-footer">
      <div class="sb-user">
        <span id="rbadge" class="rbadge"></span>
      </div>
      <button class="xbtn" style="width:100%;text-align:center" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="sb-overlay" id="sb-overlay" onclick="toggleSidebar()"></div>

  <!-- TOPBAR -->
  <div class="topbar">

// Este archivo no guarda datos de empleados ni contraseñas.
const SESION_KEY = 'hrnini_sesion';
let authToken = null;

async function api(payload){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita el preflight CORS de Apps Script
    body: JSON.stringify(Object.assign({}, payload, { token: authToken })),
  });
  const data = await res.json();
  if(data && !Array.isArray(data) && data.error){
    if(data.code === 'AUTH' && payload.action !== 'login') sesionVencida();
    const err = new Error(data.error); err.code = data.code; throw err;
  }
  return data;
}

  try { localStorage.setItem(SESION_KEY, JSON.stringify({ token, usuario, t: Date.now() })); } catch(e){}
}
function borrarSesion(){
  try { localStorage.removeItem(SESION_KEY); } catch(e){}
}
function leerSesion(){
  try {
    const s = JSON.parse(localStorage.getItem(SESION_KEY) || 'null');
    if(s && s.token && (Date.now() - s.t) < 6*60*60*1000) return s;
  } catch(e){}
  return null;
}

function parseCSV(txt){
  const lines = txt.trim().split('\n');
  const headers = lines[0].split(',').map(h=>h.trim().replace(/"/g,''));
  return lines.slice(1).map(line=>{
    const vals = splitCSVLine(line);
    const obj = {};
    headers.forEach((h,i)=>{ obj[h] = (vals[i]||'').trim().replace(/"/g,''); });
    return obj;
  }).filter(e=>e['Legajo']&&e['Legajo'].trim()!=='');
}

function splitCSVLine(line){
  const result=[]; let cur='', inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){inQ=!inQ}
    else if(c===','&&!inQ){result.push(cur);cur='';}
    else cur+=c;
  }
  result.push(cur);
  return result;
}

function parseFecha(fechaStr){
  if(!fechaStr) return null;
  const s = String(fechaStr).trim();
  // Formato ISO con hora: 2026-07-13T00:00:00.000Z (lo que suele mandar Google Sheets)
  // Se toma SOLO la parte de fecha, ignorando hora/zona horaria, para evitar que
  // se corra un día al convertir a la zona horaria local (Argentina UTC-3)
  const isoConHora = s.match(/^(\d{4})-(\d{2})-(\d{2})T/);
  if(isoConHora){
    return new Date(parseInt(isoConHora[1]), parseInt(isoConHora[2])-1, parseInt(isoConHora[3]));
  }
  // Formato ISO: 1987-07-01
  if(s.match(/^\d{4}-\d{2}-\d{2}$/)){
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  // Formato dd/mm/yyyy: 01/07/1987
  if(s.match(/^\d{1,2}\/\d{1,2}\/\d{4}$/)){
    const [d,m,y] = s.split('/').map(Number);
    return new Date(y, m-1, d);
  }
  // Formato número serial de Excel (días desde 1/1/1900)
  if(s.match(/^\d{5}$/)){
    const serial = parseInt(s);
    const utc = new Date(Date.UTC(1899, 11, 30) + serial * 86400000);
    return new Date(utc.getFullYear(), utc.getMonth(), utc.getDate());
  }
  // Fallback
  const d = new Date(fechaStr);
  return isNaN(d) ? null : d;
}

function formatFecha(fechaStr){
  const d = parseFecha(fechaStr);
  if(!d) return '-';
  return d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit', year:'numeric'});
}

function calcAntig(fechaStr){
  if(!fechaStr) return 0;
  const d = parseFecha(fechaStr);
  if(!d || isNaN(d)) return 0;
  return ((new Date()-d)/1000/60/60/24/365.25);
}

  const tot = emp.length;
  return `<div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>Sector</th>${sedes.length>1?sedes.map(s=>`<th style="text-align:right">${DASH_SEDES[s].nombre}</th>`).join(''):''}<th style="text-align:right">Total</th><th style="text-align:right">% del total</th>${convs.map(c=>`<th style="text-align:right">${c.nombre}</th>`).join('')}</tr></thead><tbody>
    ${filas.map(k => { const g = sec[k]; return `<tr><td><strong>${escHtml(k)}</strong></td>${sedes.length>1?sedes.map(s=>`<td style="text-align:right">${n(g, e=>dashSede(e)===s)}</td>`).join(''):''}<td style="text-align:right;font-weight:600">${dashNum(g.length)}</td><td style="text-align:right;color:var(--mid)">${dashPct(g.length/tot*100,1)}</td>${convs.map(c=>`<td style="text-align:right">${n(g, e=>dashConv(e)===c.clave)}</td>`).join('')}</tr>`; }).join('')}
    </tbody></table></div>`;
}

function analystDash(el){
  const emp = filterBySucursal(getActiveEmployees());
  const sucTit = sucursalTitle();
  if(emp.length === 0){
    el.innerHTML = `<div class="sec active"><div class="sh"><div><h2>Dashboard</h2><p>Sin datos para mostrar${sucTit}</p></div></div>
      <div class="empty" style="padding:40px">No hay personas en la nómina para esta sede. Verificá que la columna Sucursal de la hoja Usuarios coincida con la Ubicación de la nómina.</div></div>`;
    return;
  }
  el.innerHTML = `<div class="sec active" id="dash-sec">
    <div class="sh"><div><h2>Dashboard</h2><p>Indicadores de gestión${sucTit} · nómina de ${dashNum(emp.length)} personas activas</p></div>
      <button class="btn bts" onclick="ausenciasLoaded=false;licenciasLoaded=false;loadData().then(()=>renderTab('Dashboard'))">↻ Actualizar</button></div>
    <div id="dash-out"><div style="display:flex;align-items:center;gap:14px;padding:30px"><div class="spinner"></div><span style="color:var(--mid)">Calculando indicadores...</span></div></div>
  </div>`;
  Promise.all([loadAusencias().catch(()=>{}), loadLicencias().catch(()=>{})]).then(() => {
    if(!document.getElementById('dash-out')) return;
    dashRender(emp);
  });
}

function dashRender(emp){
  const out = document.getElementById('dash-out');
  const hoy = new Date();
  const sedes = ['LP','MO'].filter(s => emp.some(e => dashSede(e) === s));
  const ambas = sedes.length > 1;
  const porLeg = {}; emp.forEach(e => { porLeg[fichaLegNorm(e['Legajo'])] = e; });
  const base = {}; sedes.forEach(s => base[s] = emp.filter(e => dashSede(e) === s));

  // ── Antigüedad, ingresos y prueba
  const antig = e => calcAntig(e['Fecha Ingreso']);
  const ing = e => parseFecha(e['Fecha Ingreso']);
  const mesActual = dashMesKey(hoy);
  const mesAntKey = dashMesKey(new Date(hoy.getFullYear(), hoy.getMonth()-1, 1));
  const hace12 = new Date(hoy.getFullYear()-1, hoy.getMonth(), hoy.getDate());
  const hace6 = new Date(hoy.getFullYear(), hoy.getMonth()-6, hoy.getDate());

  // ── Ausentismo: último mes reportado y el anterior, mismo cálculo que la pestaña Ausentismo
  const EXCL = ['ausencia justificada','perm. gremial'];
  const filasAus = (ausenciasRaw||[]).filter(r => porLeg[fichaLegNorm(r['Legajo']||r['legajo'])]);
  const mesesAus = [...new Set((ausenciasRaw||[]).map(r => { const m = String(r['Mes']||'').match(/(\d{4})-(\d{2})/); return m ? m[1]+'-'+m[2] : ''; }).filter(Boolean))].sort();
  const ultMes = mesesAus[mesesAus.length-1] || '', antMes = mesesAus[mesesAus.length-2] || '';
  const mesFila = r => { const m = String(r['Mes']||'').match(/(\d{4})-(\d{2})/); return m ? m[1]+'-'+m[2] : ''; };
  function ausMes(sede, mes){
    if(!mes) return null;
    const [y,m] = mes.split('-').map(Number), diasMes = new Date(y, m, 0).getDate();
    const hc = sede ? base[sede].length : emp.length;
    let dias = 0; const pers = new Set(), sinAviso = new Set(); let diasSA = 0;
    filasAus.forEach(r => {
      if(mesFila(r) !== mes) return;
      const e = porLeg[fichaLegNorm(r['Legajo']||r['legajo'])]; if(sede && dashSede(e) !== sede) return;
      const mot = String(r['Motivo']||'').trim().toLowerCase();
      const d = ausDiasEnMes(r['Fecha Inicio'], r['Fecha Fin'], y, m); if(!d) return;
      if(mot === 'ausencia s/aviso'){ sinAviso.add(e['Legajo']); diasSA += d; }
      if(EXCL.includes(mot)) return;
      dias += d; pers.add(e['Legajo']);
    });
    return { dias, personas: pers.size, tasa: hc ? dias/(hc*diasMes)*100 : 0, sinAviso: sinAviso.size, diasSA };
  }

  // ── Licencias en curso (fecha de inicio + días cargados)
  const licEnCurso = sede => (licenciasRaw||[]).filter(r => {
    const e = porLeg[fichaLegNorm(r['legajo']||r['Legajo'])]; if(!e || (sede && dashSede(e) !== sede)) return false;
    const i = ausFecha(r['fecha inicio']||r['Fecha Inicio']), d = parseInt(r['dias']||r['Dias']||0)||0;
    if(!i || !d) return false;
    const fin = new Date(i.getFullYear(), i.getMonth(), i.getDate() + d);
    return i <= hoy && fin > hoy;
  });

  function resumen(sede){
    const g = sede ? base[sede] : emp;
    const an = g.map(antig);
    return {
      dot: g.length,
      ingMes: g.filter(e => { const f = ing(e); return f && dashMesKey(f) === mesActual; }).length,
      ingMesAnt: g.filter(e => { const f = ing(e); return f && dashMesKey(f) === mesAntKey; }).length,
      ing12: g.filter(e => { const f = ing(e); return f && f > hace12; }).length,
      prueba: g.filter(e => { const f = ing(e); return f && f > hace6; }).length,
      mediana: dashMediana(an), promedio: avg(an),
      conv: g.reduce((a,e) => { const k = dashConv(e); a[k] = (a[k]||0) + 1; return a; }, {}),
      mujeres: g.filter(e => String(e['sexo']||'').trim().toUpperCase() === 'F').length,
      aus: ausMes(sede, ultMes), ausAnt: ausMes(sede, antMes),
      lic: licEnCurso(sede).length,
    };
  }
  const T = resumen(null), S = {}; sedes.forEach(s => S[s] = resumen(s));

  // ── Tarjetas con comparación contra el mes anterior
  const flecha = (act, ant, subirEsMalo, fmt=dashNum, unidad='') => {
    if(ant === null || ant === undefined) return '<span class="kchg cne">Sin mes anterior</span>';
    const dif = act - ant;
    if(Math.abs(dif) < 1e-9) return `<span class="kchg cne">Igual que el mes anterior</span>`;
    const malo = subirEsMalo ? dif > 0 : dif < 0;
    return `<span class="kchg" style="background:${malo?'rgba(232,25,17,.1)':'rgba(15,123,74,.1)'};color:${malo?'var(--d)':'var(--c)'}">${dif>0?'▲':'▼'} ${fmt(Math.abs(dif))}${unidad} vs. mes anterior</span>`;
  };
  const sub = t => `<div style="font-size:11.5px;color:var(--dim);margin-top:6px">${t}</div>`;
  const porSede = f => ambas ? sub(sedes.map(s => `${DASH_SEDES[s].nombre} ${f(S[s])}`).join(' · ')) : '';
  const tasaTxt = a => a ? dashPct(a.tasa, 2) : '-';
  const kpis = `<div class="kgrid">
    <div class="kcard ka"><div class="klbl">Dotación activa</div><div class="kval">${dashNum(T.dot)}</div>${porSede(s=>dashNum(s.dot))}</div>
    <div class="kcard kd"><div class="klbl">Tasa de ausentismo · ${ultMes ? dashMesTxt(ultMes) : 'sin datos'}</div><div class="kval">${tasaTxt(T.aus)}</div>
      ${T.aus && T.ausAnt ? flecha(T.aus.tasa, T.ausAnt.tasa, true, n => n.toLocaleString('es-AR',{maximumFractionDigits:2}), ' pp') : ''}${porSede(s=>tasaTxt(s.aus))}</div>
    <div class="kcard kw"><div class="klbl">Ausencias sin aviso · ${ultMes ? dashMesTxt(ultMes) : '-'}</div><div class="kval">${T.aus ? dashNum(T.aus.sinAviso) : '-'} <span style="font-size:13px;color:var(--dim);font-weight:500">personas</span></div>
      ${T.aus && T.ausAnt ? flecha(T.aus.sinAviso, T.ausAnt.sinAviso, true) : ''}${porSede(s=>s.aus?dashNum(s.aus.sinAviso):'-')}</div>
    <div class="kcard kb"><div class="klbl">Ingresos en lo que va de ${dashMesTxt(mesActual).split(' ')[0]}</div><div class="kval">${dashNum(T.ingMes)}</div>
      ${sub(`${dashNum(T.ingMesAnt)} en ${dashMesTxt(mesAntKey).split(' ')[0]} · ${dashNum(T.ing12)} en los últimos 12 meses`)}</div>
    <div class="kcard kc"><div class="klbl">En período de prueba</div><div class="kval">${dashNum(T.prueba)}</div>${sub('Ingresaron hace menos de 6 meses')}${porSede(s=>dashNum(s.prueba))}</div>
    <div class="kcard kb"><div class="klbl">Licencias en curso</div><div class="kval">${dashNum(T.lic)}</div>${sub('Según la fecha de inicio y los días cargados en Licencias')}</div>
  </div>`;

  // ── La Plata vs Moreno
  const comp = !ambas ? '' : (() => {
    const fila = (lbl, f, nota='') => `<tr><td>${lbl}${nota?`<div style="font-size:11px;color:var(--dim)">${nota}</div>`:''}</td>${sedes.map(s=>`<td style="text-align:right;font-weight:600">${f(S[s])}</td>`).join('')}<td style="text-align:right;color:var(--mid)">${f(T)}</td></tr>`;
    return `<div class="tcard" style="margin-bottom:16px"><div class="thead"><h3>La Plata y Moreno</h3><span style="font-size:12px;color:var(--dim)">Ausentismo: reporte de ${dashMesTxt(ultMes)}</span></div>
      <div style="overflow-x:auto"><table><thead><tr><th>Indicador</th>${sedes.map(s=>`<th style="text-align:right">${DASH_SEDES[s].nombre}</th>`).join('')}<th style="text-align:right">Total</th></tr></thead><tbody>
      ${fila('Dotación activa', s=>dashNum(s.dot))}
      ${fila('Peso sobre el total', s=>dashPct(s.dot/T.dot*100,0))}
      ${fila('Tasa de ausentismo', s=>tasaTxt(s.aus), 'Sin ausencias justificadas ni permisos gremiales')}
      ${fila('Personas con alguna ausencia', s=>s.aus?dashNum(s.aus.personas)+' ('+dashPct(s.aus.personas/s.dot*100,0)+')':'-')}
      ${fila('Personas con ausencias sin aviso', s=>s.aus?dashNum(s.aus.sinAviso):'-')}
      ${fila('Licencias en curso', s=>dashNum(s.lic))}
      ${fila('Ingresos de los últimos 12 meses', s=>dashNum(s.ing12)+' ('+dashPct(s.ing12/s.dot*100,0)+')', 'Solo quienes siguen activos')}
      ${fila('En período de prueba', s=>dashNum(s.prueba))}
      ${fila('Antigüedad mediana', s=>dashAnios(s.mediana), 'La mitad del plantel tiene menos que esto')}
      ${fila('Antigüedad promedio', s=>dashAnios(s.promedio))}
      <tr><td colspan="${sedes.length+2}" style="background:var(--surface2);font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--mid)">CONVENIO</td></tr>
      ${DASH_CONV.map(c => fila(c.nombre, s=>{ const n = s.conv[c.clave]||0; return n ? dashNum(n)+' ('+dashPct(n/s.dot*100,0)+')' : '-'; })).join('')}
      ${fila('Mujeres', s=>dashNum(s.mujeres)+' ('+dashPct(s.mujeres/s.dot*100,0)+')')}
      </tbody></table></div></div>`;
  })();

  const nSect = new Set(emp.map(e=>String(e['Sector']||'Sin dato').trim())).size;
  out.innerHTML = `${kpis}${comp}
  <div class="cgrid">
    <div class="cc"><div class="ct">Tasa de ausentismo por mes</div><div class="cs">Días de ausencia sobre días disponibles, según cada reporte mensual</div><div style="height:240px"><canvas id="ch-d-aus"></canvas></div></div>
    <div class="cc"><div class="ct">Ingresos por mes</div><div class="cs">Últimos 12 meses · solo personas que siguen activas</div><div style="height:240px"><canvas id="ch-d-ing"></canvas></div></div>
  </div>
  <div class="cgrid">
    <div class="cc"><div class="ct">Antigüedad del plantel</div><div class="cs">Mediana ${dashAnios(T.mediana)} · promedio ${dashAnios(T.promedio)}</div><div style="height:240px"><canvas id="ch-d-antig"></canvas></div></div>
    <div class="cc"><div class="ct">Turnos</div><div class="cs">Agrupados por hora de entrada</div><div style="height:240px"><canvas id="ch-d-turno"></canvas></div></div>
  </div>
  <div class="cgrid"><div class="cc" style="grid-column:1/-1"><div class="ct">Personas por sector</div><div class="cs">Los ${nSect} sectores${ambas?', divididos por sede':''}</div><div style="height:${Math.max(220, nSect*26+50)}px"><canvas id="ch-d-sect"></canvas></div>
    <details class="dash-det"><summary>Ver el detalle por sector, sede y convenio</summary>${dashTablaSectores(emp, sedes)}</details></div></div>`;

  const grid = '#E3E8F2', tick = '#5B6474';
  const leyenda = ambas ? {display:true, position:'bottom', labels:{color:'#4B5563', boxWidth:12, font:{size:11}}} : {display:false};
  const dsSede = (fnData, extra={}) => sedes.map(s => ({ label: DASH_SEDES[s].nombre, data: fnData(s), backgroundColor: DASH_SEDES[s].color, borderColor: DASH_SEDES[s].color, borderRadius:4, ...extra }));
  ['dAus','dIng','dAntig','dTurno','dSect'].forEach(k => { if(charts[k]) { charts[k].destroy(); delete charts[k]; } });

  // Ausentismo por mes y sede
  const mesesG = mesesAus.slice(-7);
  if(mesesG.length){
    charts.dAus = new Chart(document.getElementById('ch-d-aus'), { type:'line',
      data:{ labels: mesesG.map(dashMesCorto), datasets: dsSede(s => mesesG.map(m => { const a = ausMes(s, m); return a ? +a.tasa.toFixed(2) : null; }), { tension:0, pointRadius:3, fill:false, borderWidth:2 }) },
      options:{ maintainAspectRatio:false, plugins:{ legend: leyenda, tooltip:{ callbacks:{ label: c => `${c.dataset.label}: ${dashPct(c.parsed.y,2)}` } } },
        scales:{ x:{ ticks:{color:tick}, grid:{display:false} }, y:{ beginAtZero:true, ticks:{ color:tick, callback: v => v + '%' }, grid:{color:grid} } } } });
  } else document.getElementById('ch-d-aus').outerHTML = '<div style="color:var(--dim);padding:20px">No hay datos de ausentismo cargados.</div>';

  // Ingresos por mes
  const meses12 = []; for(let i=11;i>=0;i--) meses12.push(dashMesKey(new Date(hoy.getFullYear(), hoy.getMonth()-i, 1)));
  charts.dIng = new Chart(document.getElementById('ch-d-ing'), { type:'bar',
    data:{ labels: meses12.map(dashMesCorto), datasets: dsSede(s => meses12.map(m => base[s].filter(e => { const f = ing(e); return f && dashMesKey(f) === m; }).length)) },
    options:{ maintainAspectRatio:false, plugins:{ legend: leyenda }, scales:{ x:{ stacked:true, ticks:{color:tick}, grid:{display:false} }, y:{ stacked:true, beginAtZero:true, ticks:{color:tick, precision:0}, grid:{color:grid} } } } });

  // Antigüedad con tramos
  charts.dAntig = new Chart(document.getElementById('ch-d-antig'), { type:'bar',
    data:{ labels: DASH_TRAMOS.map(t => t + ' años'), datasets: dsSede(s => DASH_TRAMOS.map(t => base[s].filter(e => dashTramo(antig(e)) === t).length)) },
    options:{ maintainAspectRatio:false, plugins:{ legend: leyenda }, scales:{ x:{ stacked:true, ticks:{color:tick}, grid:{display:false} }, y:{ stacked:true, beginAtZero:true, ticks:{color:tick, precision:0}, grid:{color:grid} } } } });

  // Turnos
  const TURNOS = ['Mañana','Tarde','Noche','Rotativo','Otro','Sin dato'].filter(t => emp.some(e => dashTurno(e['HORARIO']) === t));
  charts.dTurno = new Chart(document.getElementById('ch-d-turno'), { type:'bar', plugins:[dashEtiquetas],
    data:{ labels: TURNOS, datasets: dsSede(s => TURNOS.map(t => base[s].filter(e => dashTurno(e['HORARIO']) === t).length)) },
    options:{ indexAxis:'y', maintainAspectRatio:false, layout:{padding:{right:40}}, plugins:{ legend: leyenda },
      scales:{ x:{ stacked:true, beginAtZero:true, ticks:{color:tick, precision:0}, grid:{color:grid} }, y:{ stacked:true, ticks:{color:'#1F2937'}, grid:{display:false} } } } });

  // Sectores
  const cuenta = {}; emp.forEach(e => { const k = String(e['Sector']||'Sin dato').trim(); cuenta[k] = (cuenta[k]||0) + 1; });
  const sects = Object.keys(cuenta).sort((a,b) => cuenta[b] - cuenta[a]);
  charts.dSect = new Chart(document.getElementById('ch-d-sect'), { type:'bar', plugins:[dashEtiquetas],
    data:{ labels: sects, datasets: dsSede(s => sects.map(k => base[s].filter(e => String(e['Sector']||'Sin dato').trim() === k).length)) },
    options:{ indexAxis:'y', maintainAspectRatio:false, layout:{padding:{right:40}}, plugins:{ legend: leyenda },
      scales:{ x:{ stacked:true, beginAtZero:true, ticks:{color:tick, precision:0}, grid:{color:grid} }, y:{ stacked:true, ticks:{color:'#1F2937', font:{size:11}, autoSkip:false}, grid:{display:false} } } } });
}

function nominaTab(el){
  let activeEmployees = filterBySucursal(getActiveEmployees());
  const sucTit = sucursalTitle();

  // Si es supervisor, filtrar por sector y sucursal
  const isSupervisor = role === 'supervisor';
  let sectorLabel = '';
  if(isSupervisor && currentUser){
    const userSectors = (currentUser.sector||'').split(',').map(s=>s.trim()).filter(Boolean);
    const userSuc = (currentUser.sucursal||'').trim().toLowerCase();
    if(userSectors.length > 0){
      activeEmployees = activeEmployees.filter(e => userSectors.includes((e['Sector']||'').trim()));
    }
    if(userSuc){
      activeEmployees = activeEmployees.filter(e => {
        const empUbi = String(e['Ubicación']||e['Ubicacion']||'').trim().toLowerCase();
        return empUbi.includes(userSuc);
      });
    }
    sectorLabel = userSectors.join(' · ') + (currentUser.sucursal ? ' · ' + currentUser.sucursal : '');
  }

  // KPIs para supervisor
  const kpisHtml = isSupervisor ? `
  <div class="kgrid">
    <div class="kcard ka"><div class="klbl">Total personas</div><div class="kval">${activeEmployees.length}</div></div>
    <div class="kcard kc"><div class="klbl">Antigüedad promedio</div><div class="kval">${avg(activeEmployees.map(e=>calcAntig(e['Fecha Ingreso']))).toFixed(1)}a</div></div>
    <div class="kcard kw"><div class="klbl">Horario rotativo</div><div class="kval">${activeEmployees.filter(e=>e['HORARIO']==='ROTATIVO').length}</div></div>
    <div class="kcard kb"><div class="klbl">Fuera convenio</div><div class="kval">${activeEmployees.filter(e=>e['Convenio']==='Fuera de Convenio').length}</div></div>
  </div>` : '';

  const titulo = isSupervisor ? 'Mi Equipo' : 'Nómina Completa';
  const subtitulo = isSupervisor
    ? `${activeEmployees.length} empleados · ${sectorLabel}`
    : `${activeEmployees.length} empleados activos${sucTit}${bajas.length>0?' · <span style="color:var(--d)">'+bajas.length+' baja(s) registrada(s)</span>':''}`;

  el.innerHTML=`<div class="sec active">
  <div class="sh"><div><h2>${titulo}</h2><p>${subtitulo}</p></div></div>
  ${kpisHtml}
  <div class="tcard">
    <div class="thead">
      <h3>${isSupervisor ? sectorLabel : 'Plantel Activo'}</h3>
      <input class="sinput" placeholder="Buscar por nombre, legajo, sector..." oninput="filterNom(this.value)" id="nom-search">
    </div>
    <div style="overflow-x:auto">
    <table id="nom-tbl">
      <thead><tr><th>Legajo</th><th>Nombre</th><th>Sector</th><th>Tarea</th><th>Horario</th><th>Convenio</th><th>Categoría</th><th>Antigüedad</th><th>Fecha Ingreso</th></tr></thead>
      <tbody id="nom-body">
        ${activeEmployees.map(e=>{
          const leg = String(e['Legajo']||'').trim();
          const fotoUrl = getFotoUrl(leg, 40);
          const avatar = fotoUrl
            ? `<img src="${fotoUrl}" loading="lazy" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--border)" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt=""><div class="av notranslate" translate="no" style="display:none;background:${avColor(e['Nombre']||'')}">${avSafe(e['Nombre']||'')}</div>`
            : `<div class="av notranslate" translate="no" style="background:${avColor(e['Nombre']||'')}">${avSafe(e['Nombre']||'')}</div>`;
          return `<tr onclick="showFichaEmpleado('${leg}')" style="cursor:pointer">
          <td><span style="color:var(--dim);font-size:11px">${leg}</span></td>
          <td><div style="display:flex;align-items:center;gap:8px">
            ${avatar}
            <strong style="font-size:12px">${e['Nombre']||'-'}</strong></div></td>
          <td>${e['Sector']||'-'}</td>
          <td style="color:var(--mid)">${e['Tarea']||'-'}</td>
          <td style="color:var(--mid);font-size:11px">${e['HORARIO']||'-'}</td>
          <td><span class="pill ${convPill(e['Convenio'])}">${e['Convenio']||'-'}</span></td>
          <td style="font-size:11px;color:var(--mid)">${e['Categoria']||'-'}</td>
          <td>${calcAntig(e['Fecha Ingreso']).toFixed(1)} a</td>
          <td style="font-size:11px;color:var(--mid)">${formatFecha(e['Fecha Ingreso'])}</td>
        </tr>`}).join('')}
      </tbody>
    </table></div>
  </div></div>`;
}

let fichaLegajo = null;

function showFichaEmpleado(legajo){
  fichaLegajo = String(legajo||'').trim();
  const btn = [...document.querySelectorAll('button.sb-tab')].find(b => (b.getAttribute('onclick')||'').includes("'Ficha 360'"));
  if(btn) switchTab(btn, 'Ficha 360');
  else renderTab('Ficha 360');
  window.scrollTo({top:0});
}

const fichaPesos = n => (Number(n)||0).toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const fichaLegNorm = v => { const s = String(v||'').trim(); return String(parseInt(s,10)||s); };
const fichaDia = 86400000;

function fichaTab(el){
  const lista = (employees||[]).filter(e => String(e['Legajo']||'').trim());
  const opciones = lista.map(e => `<option value="${escHtml(String(e['Legajo']).trim())} — ${escHtml(e['Nombre']||'')}"></option>`).join('');
  el.innerHTML = `<div class="sec active" id="ficha-sec">
    <div class="sh"><div><h2>Ficha 360</h2><p>Todo lo que hay de una persona en una sola pantalla</p></div>
      <button class="btn bts liq-noprint" onclick="window.print()">Imprimir</button></div>
    <div class="fcard liq-noprint" style="display:flex;gap:12px;align-items:end;flex-wrap:wrap">
      <div style="flex:1;min-width:240px"><div class="klbl">Legajo o nombre</div>
        <input class="sinput" id="ficha-emp" list="ficha-emps" placeholder="Escribí el legajo o el apellido" style="width:100%" autocomplete="off">
        <datalist id="ficha-emps">${opciones}</datalist></div>
      <button class="btn btp" onclick="fichaBuscar()">Ver ficha</button>
    </div>
    <div id="ficha-out">${fichaLegajo ? '' : '<div class="empty" style="padding:50px 20px"><div class="em">'+TAB_ICONS['Mi Equipo']+'</div>Buscá a una persona por legajo o apellido. También podés abrir la ficha tocando a alguien en Nómina o en Inicio.</div>'}</div>
  </div>`;
  const inp = document.getElementById('ficha-emp');
  inp.addEventListener('keydown', ev => { if(ev.key==='Enter') fichaBuscar(); });
  inp.addEventListener('change', () => { if(inp.value.includes('—')) fichaBuscar(); });
  if(fichaLegajo) fichaRender(fichaLegajo);
}

function fichaBuscar(){
  const out = document.getElementById('ficha-out');
  const t = String(document.getElementById('ficha-emp').value||'').trim();
  if(!t) return;
  const leg = t.split('—')[0].trim();
  let e = (employees||[]).find(x => String(x['Legajo']).trim() === leg);
  if(!e){
    const q = t.toLowerCase();
    const m = (employees||[]).filter(x => String(x['Nombre']||'').toLowerCase().includes(q));
    if(m.length === 1) e = m[0];
    else if(m.length > 1){ out.innerHTML = `<div class="alert" style="background:rgba(217,119,6,.1);color:var(--w)">Hay ${m.length} personas que coinciden. Elegí una de la lista o escribí el legajo.</div>`; return; }
  }
  if(!e){ out.innerHTML = '<div class="alert" style="background:rgba(217,119,6,.1);color:var(--w)">No encontré a esa persona en la nómina.</div>'; return; }
  fichaLegajo = String(e['Legajo']).trim();
  fichaRender(fichaLegajo);
}

function fichaAntigTexto(ing){
  const hoy = new Date(); if(!ing) return '-';
  let a = hoy.getFullYear() - ing.getFullYear(), m = hoy.getMonth() - ing.getMonth();
  if(hoy.getDate() < ing.getDate()) m--;
  if(m < 0){ a--; m += 12; }
  return `${a} ${a===1?'año':'años'} y ${m} ${m===1?'mes':'meses'}`;
}

function fichaSeries(filas, mapa){
  const porMes = {};
  (filas||[]).forEach(f => {
    const mes = String(f.Mes||f.mes||'').trim().slice(0,7);
    if(!/^\d{4}-\d{2}$/.test(mes)) return;
    const tipo = LIQ.clasificar(LIQ.norm(f.Novedad||f.novedad||''), mapa);
    if(!['FIJO','VARIABLE','NOREM'].includes(tipo)) return;
    porMes[mes] = (porMes[mes]||0) + LIQ.numero(f.Monto);
  });
  return Object.keys(porMes).sort().map(k => ({ mes:k, total:porMes[k] }));
}

async function fichaRender(legajo){
  const out = document.getElementById('ficha-out'); if(!out) return;
  const e = (employees||[]).find(x => String(x['Legajo']||'').trim() === legajo);
  if(!e){ out.innerHTML = '<div class="alert" style="background:rgba(217,119,6,.1);color:var(--w)">Esa persona no está en la nómina que podés ver.</div>'; return; }
  const inp = document.getElementById('ficha-emp'); if(inp) inp.value = `${legajo} — ${e['Nombre']||''}`;
  out.innerHTML = '<div style="display:flex;align-items:center;gap:14px;padding:30px"><div class="spinner"></div><span style="color:var(--mid)">Armando la ficha de ' + escHtml(e['Nombre']||'') + '...</span></div>';

  const esAdmin = role === 'admin';
  const tareas = [loadAusencias().catch(()=>{}), loadLicencias().catch(()=>{})];
  let filasSueldo = null, errSueldo = '';
  if(esAdmin){
    tareas.push(liqCargarConfig().catch(err => { errSueldo = err.message; }));
    tareas.push(api({ action:'sueldosLegajo', legajo }).then(f => { filasSueldo = f; }).catch(err => { errSueldo = err.message; }));
  }
  await Promise.all(tareas);
  if(fichaLegajo !== legajo || !document.getElementById('ficha-out')) return;   // cambió de persona o de pestaña

  const hoy = new Date();
  const desde12 = new Date(hoy.getTime() - 365*fichaDia);
  const ln = fichaLegNorm(legajo);
  const ing = parseFecha(e['Fecha Ingreso']);

  // Ausencias (últimos 12 meses). El reporte del sistema es mensual: una ausencia larga aparece una vez por mes,
  // con la misma fecha de inicio y la fecha de fin prevista a ese momento. Por eso cada fila cuenta solo los días
  // de su propio mes (igual que la pestaña Ausentismo) y en la lista se agrupa en un solo evento.
  const NO_CUENTA = ['ausencia justificada','perm. gremial'];      // igual que la tasa de la pestaña Ausentismo
  const mesDesde = (() => { const d = new Date(hoy.getFullYear(), hoy.getMonth() - 11, 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); })();
  const mesDe = r => { const m = String(r['Mes']||r['mes']||'').match(/(\d{4})-(\d{2})/); return m ? m[1] + '-' + m[2] : ''; };
  const diasFila = r => { const m = mesDe(r); if(!m) return 0; const [y, mm] = m.split('-').map(Number); return ausDiasEnMes(r['Fecha Inicio']||r['fecha inicio'], r['Fecha Fin']||r['fecha fin'], y, mm); };
  const motDe = r => String(r['Motivo']||r['motivo']||'Sin dato').trim();
  const aus12 = (ausenciasRaw||[]).filter(r => mesDe(r) >= mesDesde);
  const eventos = {};
  aus12.filter(r => fichaLegNorm(r['Legajo']||r['legajo']) === ln).forEach(r => {
    const ini = ausFecha(r['Fecha Inicio']||r['fecha inicio']); if(!ini) return;
    const k = motDe(r) + '|' + ini.toDateString();
    const d = diasFila(r), mes = mesDe(r);
    if(!eventos[k]) eventos[k] = { inicio: ini, fin: null, motivo: motDe(r), dias: 0, mes: '' };
    const ev = eventos[k]; ev.dias += d;
    if(mes >= ev.mes){ ev.mes = mes; ev.fin = ausFecha(r['Fecha Fin']||r['fecha fin']); }
  });
  const misAus = Object.values(eventos).map(ev => {
    const [y, m] = ev.mes.split('-').map(Number);
    ev.enCurso = ev.fin && ev.fin >= new Date(y, m, 1);     // la fecha de fin pasa el último mes reportado
    ev.cuenta = !NO_CUENTA.includes(ev.motivo.toLowerCase());
    return ev;
  }).sort((a,b) => b.inicio - a.inicio);
  const diasAusTot = misAus.filter(ev => ev.cuenta).reduce((s,ev)=>s+ev.dias,0);
  const sector = String(e['Sector']||'').trim();
  const delSector = new Set((employees||[]).filter(x => String(x['Sector']||'').trim() === sector).map(x => fichaLegNorm(x['Legajo'])));
  const diasSector = aus12.filter(r => delSector.has(fichaLegNorm(r['Legajo']||r['legajo'])) && !NO_CUENTA.includes(motDe(r).toLowerCase())).reduce((s,r)=>s+diasFila(r),0);
  const promSector = delSector.size ? diasSector / delSector.size : 0;
  const ausMotivo = {}; misAus.forEach(ev => { ausMotivo[ev.motivo] = (ausMotivo[ev.motivo]||0) + ev.dias; });
  const ultimoReporte = (ausenciasRaw||[]).reduce((mx, r) => { const m = mesDe(r); return m > mx ? m : mx; }, '');
  const mesTxt = k => { if(!k) return ''; const [y,m] = k.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString('es-AR',{month:'short', year:'numeric'}); };

  // Licencias (todo el historial cargado)
  const misLic = (licenciasRaw||[]).filter(r => fichaLegNorm(r['legajo']||r['Legajo']) === ln).map(r => ({ inicio:r['fecha inicio']||r['Fecha Inicio']||'', dias:parseInt(r['dias']||r['Dias']||0)||0, motivo:String(r['motivo']||r['Motivo']||'Sin dato').trim(), obs:String(r['Observacion']||r['observacion']||'').trim() }))
    .sort((a,b) => (parseFecha(b.inicio)||0) - (parseFecha(a.inicio)||0));
  const licDias = misLic.reduce((s,r)=>s+r.dias,0);
  const licDias12 = misLic.filter(r => { const f = parseFecha(r.inicio); return f && f >= desde12; }).reduce((s,r)=>s+r.dias,0);

  // Antigüedad, prueba e hitos
  const antTxt = fichaAntigTexto(ing);
  const finPrueba = ing ? new Date(ing.getFullYear(), ing.getMonth()+6, ing.getDate()) : null;
  const enPrueba = finPrueba && finPrueba > hoy;
  const aniosHoy = ing ? (hoy - ing) / (365.25*fichaDia) : 0;
  const prox = ing ? Math.floor(aniosHoy) + 1 : 0;
  const fechaProx = ing ? new Date(ing.getFullYear()+prox, ing.getMonth(), ing.getDate()) : null;
  const hito = [5,10,20].includes(prox) && fechaProx && (fechaProx - hoy) < 120*fichaDia;
  const antig31 = ing ? (new Date(hoy.getFullYear(),11,31) - ing) / (365.25*fichaDia) : 0;
  const vacAnio = antig31 < 5 ? 14 : antig31 < 10 ? 21 : antig31 < 20 ? 28 : 35;
  const fF = d => d ? d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}) : '-';

  // Sueldo y liquidación (solo administrador)
  let serie = [], liq = null, errLiq = '';
  if(esAdmin && filasSueldo && liqCfg){
    serie = fichaSeries(filasSueldo, liqCfg.mapa);
    try {
      const hoyISO = new Date(hoy.getTime() - hoy.getTimezoneOffset()*60000).toISOString().slice(0,10);
      liq = LIQ.calcular({ fechaIngreso:e['Fecha Ingreso'], fechaEgreso:hoyISO, convenio:e['Convenio']||'', filasSueldo, mapaConceptos:liqCfg.mapa, topes:liqCfg.topes, topeManual:0, preavisoOtorgado:false, vacPendientes:0, vacGozadasAnio:0 });
    } catch(err){ errLiq = err.message; }
  }

  // ── Armado ──
  const foto = getFotoUrl(legajo, 200);
  const ini = escHtml(avSafe(e['Nombre']||''));
  const fotoHtml = foto
    ? `<img src="${foto}" alt="" style="width:96px;height:96px;border-radius:18px;object-fit:cover;border:1px solid var(--border)" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ficha-ini',textContent:'${ini}'}))">`
    : `<div class="ficha-ini">${ini}</div>`;
  const chip = (txt, color) => `<span class="ficha-chip" style="color:${color};background:${color}14;border-color:${color}33">${txt}</span>`;
  const chips = [
    enPrueba ? chip('En período de prueba hasta el ' + fF(finPrueba), '#B45309') : '',
    hito ? chip(`Cumple ${prox} años el ${fF(fechaProx)}`, '#002E9D') : '',
    liq && liq.variables.some(v => v.usado > 0) ? chip('Tiene variables habituales', '#0F7B4A') : '',
  ].join('');
  const dato = (l, v) => `<div class="ficha-dato"><div class="klbl">${l}</div><div>${v}</div></div>`;
  const kpi = (cls, l, v, sub) => `<div class="kcard ${cls}"><div class="klbl">${l}</div><div class="kval">${v}</div>${sub?`<div style="font-size:11.5px;color:var(--dim);margin-top:6px">${sub}</div>`:''}</div>`;
  const compSector = delSector.size > 1 ? (diasAusTot > promSector*1.5 && diasAusTot - promSector >= 2 ? `<span style="color:var(--d)">Por encima del promedio del sector (${promSector.toFixed(1)})</span>` : `Promedio del sector: ${promSector.toFixed(1)}`) : '';
  const barras = (obj, color) => { const arr = Object.entries(obj).sort((a,b)=>b[1]-a[1]); const max = arr.length ? arr[0][1] : 1;
    return arr.map(([k,v]) => `<div style="display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:12.5px;margin:7px 0"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(k)}</span><div class="pbar"><div class="pfill" style="width:${Math.max(4,v/max*100)}%;background:${color}"></div></div><strong style="text-align:right">${v} d</strong></div>`).join(''); };
  const vacio = t => `<div style="color:var(--dim);font-size:13px;padding:6px 0">${t}</div>`;

  const filaAus = ev => `<tr${ev.cuenta?'':' style="color:var(--dim)"'}><td>${fF(ev.inicio)}</td><td>${ev.enCurso ? `<span style="color:var(--w);font-weight:600">Sigue</span><div style="font-size:11px;color:var(--dim)">fin previsto ${fF(ev.fin)}</div>` : fF(ev.fin)}</td><td>${escHtml(ev.motivo)}${ev.cuenta?'':'<div style="font-size:11px">No suma en la tasa</div>'}</td><td>${ev.dias}</td></tr>`;
  const ausHtml = `<div class="cc"><div class="ct">Ausencias · últimos 12 meses</div><div class="cs">${misAus.length} ${misAus.length===1?'ausencia':'ausencias'} · ${misAus.reduce((s,ev)=>s+ev.dias,0)} días hasta el reporte de ${mesTxt(ultimoReporte)}</div>
    ${misAus.length ? barras(ausMotivo, 'var(--a)') + `<table style="margin-top:12px"><thead><tr><th>Desde</th><th>Hasta</th><th>Motivo</th><th>Días</th></tr></thead><tbody>${misAus.slice(0,8).map(filaAus).join('')}</tbody></table>${misAus.length > 8 ? `<div style="font-size:11.5px;color:var(--dim);margin-top:8px">Y ${misAus.length-8} más en el año.</div>` : ''}` : vacio('Sin ausencias cargadas en los últimos 12 meses.')}</div>`;
  const licMot = {}; misLic.forEach(r => { licMot[r.motivo] = (licMot[r.motivo]||0) + r.dias; });
  const licHtml = `<div class="cc"><div class="ct">Licencias</div><div class="cs">${misLic.length} ${misLic.length===1?'licencia':'licencias'} en el historial · ${licDias} días</div>
    ${misLic.length ? barras(licMot, 'var(--b)') + `<table style="margin-top:12px"><thead><tr><th>Inicio</th><th>Motivo</th><th>Días</th></tr></thead><tbody>${misLic.slice(0,6).map(r=>`<tr><td>${formatFecha(r.inicio)}</td><td>${escHtml(r.motivo)}${r.obs?`<div style="font-size:11px;color:var(--dim)">${escHtml(r.obs.slice(0,80))}</div>`:''}</td><td>${r.dias}</td></tr>`).join('')}</tbody></table>` : vacio('Sin licencias cargadas.')}</div>`;

  let sueldoHtml = '', liqHtml = '';
  if(esAdmin){
    const ultimo = serie.length ? serie[serie.length-1] : null;
    const habituales = liq ? liq.variables.filter(v => v.usado > 0) : [];
    sueldoHtml = `<div class="cc"><div class="ct">Sueldo bruto por mes</div><div class="cs">Fijos, variables y no remunerativos (sin viáticos excluidos)</div>
      ${serie.length ? `<div style="height:190px"><canvas id="ficha-ch-sueldo"></canvas></div>
        <div style="font-size:12.5px;margin-top:12px"><div class="klbl" style="margin-bottom:6px">Variables habituales</div>${habituales.length ? habituales.map(v=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)"><span>${escHtml(v.concepto)}</span><strong>${fichaPesos(v.usado)}</strong></div>`).join('') : '<span style="color:var(--dim)">No tiene variables cobradas en 6 o más meses.</span>'}</div>`
        : vacio(errSueldo ? 'No se pudieron traer los sueldos: ' + escHtml(errSueldo) : 'No hay sueldos cargados de esta persona.')}</div>`;
    liqHtml = `<div class="cc"><div class="ct">Liquidación final estimada · si fuera hoy</div><div class="cs">Sin preaviso otorgado y sin vacaciones gozadas este año. Para ajustar, abrila en Liquidación final.</div>
      ${liq ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 14px">
          <div class="ficha-monto"><div class="klbl">Despido sin causa</div><div style="color:var(--a)">${fichaPesos(liq.escenarios.sinCausa)}</div></div>
          <div class="ficha-monto"><div class="klbl">Con causa o renuncia</div><div>${fichaPesos(liq.escenarios.conCausa)}</div></div></div>
        <div style="font-size:12.5px;color:var(--mid);line-height:1.7">Base indemnizatoria ${fichaPesos(liq.base)}${liq.topeAplicado ? ` · topeada a ${fichaPesos(liq.baseTopeada)}` : ''} · ${liq.antig.aniosIndemn} ${liq.antig.aniosIndemn===1?'año':'años'} para el art. 245 · preaviso ${liq.mesesPreaviso} ${liq.mesesPreaviso===1?'mes':'meses'}</div>
        ${liq.notas.length ? `<div style="font-size:11.5px;color:var(--w);margin-top:8px">${liq.notas.map(escHtml).join('<br>')}</div>` : ''}`
        : vacio(errLiq ? escHtml(errLiq) : (errSueldo ? 'No disponible sin los sueldos.' : 'No disponible.'))}
      <button class="btn bts liq-noprint" style="margin-top:14px" onclick="fichaAbrirLiq('${escHtml(legajo)}')">Abrir en Liquidación final</button></div>`;
  }

  out.innerHTML = `
  <div class="ficha-head">
    ${fotoHtml}
    <div style="flex:1;min-width:220px">
      <h3 class="ficha-nombre">${escHtml(e['Nombre']||'-')}</h3>
      <div style="color:var(--mid);font-size:13px;margin:2px 0 10px">Legajo ${escHtml(legajo)} · ${escHtml(e['Sector']||'-')} · ${escHtml(e['Tarea']||'-')}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill ${convPill(e['Convenio'])}">${escHtml(e['Convenio']||'-')}</span><span class="pill pgy">${escHtml(e['Ubicación']||e['Ubicacion']||'-')}</span>${chips}</div>
    </div>
  </div>
  <div class="ficha-datos">
    ${dato('Ingreso', formatFecha(e['Fecha Ingreso']))}${dato('Antigüedad', antTxt)}${dato('Horario', escHtml(e['HORARIO']||'-'))}
    ${dato('Categoría', escHtml(e['Categoria']||'-'))}${dato('Vacaciones ' + hoy.getFullYear(), vacAnio + ' días por antigüedad')}${dato('Preaviso que le corresponde', aniosHoy > 5 ? '2 meses' : (enPrueba ? 'No corresponde (prueba)' : '1 mes'))}
  </div>
  <div class="kgrid">
    ${kpi('kw','Días de ausencia (12 meses)', diasAusTot, compSector || 'Sin ausencias justificadas ni permisos gremiales')}
    ${kpi('kb','Días de licencia (12 meses)', licDias12, `${licDias} en todo el historial`)}
    ${esAdmin ? kpi('ka','Último sueldo bruto', serie.length ? fichaPesos(serie[serie.length-1].total) : '-', serie.length ? 'Mes ' + serie[serie.length-1].mes : '') : ''}
    ${esAdmin ? kpi('kd','Sin causa, si fuera hoy', liq ? fichaPesos(liq.escenarios.sinCausa) : '-', liq ? 'Estimación' : '') : ''}
  </div>
  <div class="cgrid">${ausHtml}${licHtml}${sueldoHtml}${liqHtml}</div>
  <div style="font-size:11px;color:var(--dim);margin-top:10px">Información confidencial de uso interno de RRHH (Ley 25.326 de protección de datos personales).</div>`;

  if(serie.length && document.getElementById('ficha-ch-sueldo')){
    if(charts.fichaSueldo) charts.fichaSueldo.destroy();
    charts.fichaSueldo = new Chart(document.getElementById('ficha-ch-sueldo'), { type:'line',
      data:{ labels: serie.map(s => { const [y,m] = s.mes.split('-'); return new Date(+y, +m-1, 1).toLocaleDateString('es-AR',{month:'short',year:'2-digit'}); }),
        datasets:[{ data: serie.map(s => Math.round(s.total)), borderColor:'#002E9D', backgroundColor:'rgba(0,46,157,.08)', fill:true, cubicInterpolationMode:'monotone', pointRadius:3, pointBackgroundColor:'#002E9D' }] },
      options:{ maintainAspectRatio:false, plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: c => fichaPesos(c.parsed.y) } } },
        scales:{ x:{ ticks:{color:'#5B6474'}, grid:{display:false} }, y:{ ticks:{ color:'#5B6474', callback: v => '$' + (v/1e6).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' M', maxTicksLimit:5 }, grid:{color:'#E3E8F2'} } } } });
  }
}

function fichaAbrirLiq(legajo){
  const e = (employees||[]).find(x => String(x['Legajo']||'').trim() === legajo);
  const btn = [...document.querySelectorAll('button.sb-tab')].find(b => (b.getAttribute('onclick')||'').includes("'Liquidación final'"));
  if(!btn || !e) return;
  switchTab(btn, 'Liquidación final');
  const esperar = setInterval(() => {
    const inp = document.getElementById('liq-emp');
    if(inp){ clearInterval(esperar); inp.value = `${legajo} — ${e['Nombre']||''}`; liqCalcular(); }
  }, 150);
  setTimeout(() => clearInterval(esperar), 10000);
}

function filterNom(q){
  const rows=document.querySelectorAll('#nom-body tr');
  const qq=q.toLowerCase();
  rows.forEach(r=>r.style.display=r.textContent.toLowerCase().includes(qq)?'':'none');
}

function myTeam(el){
  // Leer sectores del usuario (puede ser "DEPOSITO" o "DEPOSITO, EXPEDICION, SALON")
  const rawSector = currentUser ? (currentUser.sector||'') : '';
  const userSectors = rawSector.split(',').map(s=>s.trim()).filter(Boolean);

  if(userSectors.length === 0){
    el.innerHTML=`<div class="sec active">
    <div class="sh"><div><h2>Mi Equipo</h2><p>Empleados bajo tu supervisión</p></div></div>
    <div class="empty"><div class="em"></div><p>No tenés sectores asignados. Contactá a RRHH.</p></div>
    </div>`;
    return;
  }

  let team = getActiveEmployees().filter(e => userSectors.includes((e['Sector']||'').trim()));

  // Si el supervisor tiene sucursal asignada, filtrar también por ubicación

async function loadAusencias(){
  if(ausenciasLoaded && ausenciasRaw.length > 0) return;
  try {
    const res = await hojaResp("Ausentismo");
    if(res.ok){
      const data = await res.json();
      if(data && data.length > 0){
        ausenciasRaw = data;
        ausenciasLoaded = true;
        console.log("✅ Ausentismo en vivo:", data.length, "registros");
        return;
      }
    }
  } catch(e){ console.warn("Ausentismo Apps Script failed:", e.message); }

  // Sin datos: se muestra vacío (ya no hay copia dentro del archivo)
  ausenciasRaw = [];
  ausenciasLoaded = false;
}

// Días de una ausencia dentro de un mes. Fecha Fin es inclusiva: del 6/6 al 12/6 son 7 días y una ausencia de un día (inicio = fin) cuenta 1.
function ausFecha(v){ if(v instanceof Date) return v; const f = parseFecha(v); if(f) return f; const d = new Date(v); return isNaN(d) ? null : d; }
function ausDiasEnMes(fIni, fFin, anio, mes){
  const d1 = ausFecha(fIni), d2 = ausFecha(fFin);
  if(!d1 || !d2) return 0;
  const ini = new Date(d1.getFullYear(), d1.getMonth(), d1.getDate());
  const finExcl = new Date(d2.getFullYear(), d2.getMonth(), d2.getDate() + 1);
  const mStart = new Date(anio, mes-1, 1), mEnd = new Date(anio, mes, 1);
  const start = ini > mStart ? ini : mStart, end = finExcl < mEnd ? finExcl : mEnd;
  return Math.max(Math.round((end - start) / 86400000), 0);
}

function procesarAusenciasRaw(raw, excluir, headcountOverride=null){
  const filtered = raw.filter(r => {
    const mot = String(r['Motivo']||r['motivo']||'').trim();
    return !excluir.includes(mot);
  });

  // Group by Mes column
  // Normalize mes value from any date format to YYYY-MM
  const normalizeMes = (val) => {
    if(!val) return '';
    const s = String(val).trim();
    if(s.match(/^\d{4}-\d{2}$/)) return s;
    const m = s.match(/(\d{4})-(\d{2})/);
    return m ? m[1]+'-'+m[2] : '';
  };

  const porMesMap = {};
  filtered.forEach(r => {
    const mes = normalizeMes(r['Mes']||r['mes']||'');
    if(!mes) return;
    if(!porMesMap[mes]) porMesMap[mes] = [];
    porMesMap[mes].push(r);
  });

  const mesesOrdenados = Object.keys(porMesMap).sort();

  const diasEnMes = ausDiasEnMes;

  const headcount = headcountOverride || employees.length || 794;
  // Días reales de cada mes (la empresa trabaja los 7 días)
  const diasDelMes = (anio, mes) => new Date(anio, mes, 0).getDate();

  // Calculate stats per month
  const porMes = mesesOrdenados.map(mesKey => {
    const [anio, mesNum] = mesKey.split('-').map(Number);
    const rows = porMesMap[mesKey];
    let dias = 0; const emps = new Set();
    rows.forEach(r => {
      const d = diasEnMes(r['Fecha Inicio']||r['fecha inicio'], r['Fecha Fin']||r['fecha fin'], anio, mesNum);
      if(d > 0){ dias += d; emps.add(String(r['Legajo']||r['legajo']||'').trim()); }
    });
    const diasMes = diasDelMes(anio, mesNum);
    const tasa = parseFloat(((dias/(headcount*diasMes))*100).toFixed(2));
    const label = new Date(anio, mesNum-1, 1).toLocaleDateString('es-AR',{month:'short', year:'numeric'});
    return {mesKey, label, anio, mesNum, dias, empleados:emps.size, tasa};
  });

  // Last month
  const ultimo = porMes[porMes.length-1];
  const penultimo = porMes.length > 1 ? porMes[porMes.length-2] : null;
  const variacion = (ultimo && penultimo) ? parseFloat((ultimo.tasa - penultimo.tasa).toFixed(2)) : 0;

  // Build per-employee for last month
  const lastRows = ultimo ? porMesMap[ultimo.mesKey] : [];
  const empData = {};
  lastRows.forEach(r => {
    const leg = String(r['Legajo']||r['legajo']||'').trim();
    const nom = String(r['Nombre']||r['nombre']||'').trim();
    const mot = String(r['Motivo']||r['motivo']||'Sin dato').trim();
    const d = diasEnMes(r['Fecha Inicio']||r['fecha inicio'], r['Fecha Fin']||r['fecha fin'], ultimo.anio, ultimo.mesNum);
    if(!leg || d===0) return;
    if(!empData[leg]) empData[leg] = {Legajo:leg, Nombre:nom, total_dias:0, total_eventos:0, ultimo_motivo:mot};
    empData[leg].total_dias += d;
    empData[leg].total_eventos++;
    empData[leg].ultimo_motivo = mot;
  });

  // Motivo for last month
  const porMotivo = {};
  lastRows.forEach(r => {
    const mot = String(r['Motivo']||r['motivo']||'Sin dato').trim();
    const d = diasEnMes(r['Fecha Inicio']||r['fecha inicio'], r['Fecha Fin']||r['fecha fin'], ultimo.anio, ultimo.mesNum);
    if(d > 0) porMotivo[mot] = (porMotivo[mot]||0) + d;
  });

  // Criticos for last month
  const criticosMap = {};
  lastRows.filter(r => ['Suspension','Accidente','Ausencia s/aviso','Aus. c/Aviso'].includes(String(r['Motivo']||'').trim()))
    .forEach(r => {
      const key = `${r['Legajo']}-${r['Motivo']}`;
      if(!criticosMap[key]) criticosMap[key] = {Legajo:String(r['Legajo']||''), Nombre:String(r['Nombre']||''), Motivo:String(r['Motivo']||''), count:0};
      criticosMap[key].count++;
    });

  return {
    empleados: Object.values(empData).sort((a,b)=>b.total_dias-a.total_dias),
    porMes,
    porMotivo: Object.entries(porMotivo).sort((a,b)=>b[1]-a[1]).map(([Motivo,dias])=>({Motivo,dias})),
    criticos: Object.values(criticosMap),
    totalDias: ultimo ? ultimo.dias : 0,
    totalEventos: lastRows.length,
    empleadosAfectados: Object.keys(empData).length,
    mesActual: ultimo ? ultimo.label : '',
    mesKey: ultimo ? ultimo.mesKey : '',
    diasHabiles: 30,
    tasaAusentismo: ultimo ? ultimo.tasa : 0,
    variacion,
    mesPrevio: penultimo ? penultimo.label : '',
    tasaPrevia: penultimo ? penultimo.tasa : 0,
    todosMeses: porMes,
    mesesDisponibles: mesesOrdenados,
  };
}

// ─── Helpers de sector para supervisor ───────────────────────────────────────
function getUserSectors(){
  if(!currentUser || !currentUser.sector) return [];
  return currentUser.sector.split(',').map(s=>s.trim()).filter(Boolean);
}
function getSectorLegajos(){
  // Devuelve Set de legajos que pertenecen a los sectores del supervisor
  const sectors = getUserSectors();
  if(!sectors.length) return null; // null = sin filtro
  const suc = currentUser && currentUser.sucursal ? currentUser.sucursal.trim().toLowerCase() : '';
  const legSet = new Set();
  getActiveEmployees().forEach(e => {
    if(sectors.includes((e['Sector']||'').trim())){
      // Si el supervisor tiene sucursal asignada, filtrar también por ubicación
      if(suc){
        const empUbi = String(e['Ubicación']||e['Ubicacion']||'').trim().toLowerCase();
        if(empUbi.includes(suc)) legSet.add(String(e['Legajo']).trim());
      } else {
        legSet.add(String(e['Legajo']).trim());
      }
    }
  });
  return legSet;
}

// ─── Helpers de sucursal para analyst / admin ────────────────────────────────
function getUserSucursal(){
  if(role === 'admin' && adminSucursal !== 'ambas') return adminSucursal;
  if(!currentUser || !currentUser.sucursal) return '';
  return currentUser.sucursal.trim();
}
function getSucursalFilter(){
  if(role === 'admin' && adminSucursal !== 'ambas'){
    return (e) => String(e['Ubicación']||'').trim().toLowerCase() === adminSucursal.toLowerCase();
  }
  if(role !== 'analyst') return null;
  const suc = currentUser && currentUser.sucursal ? currentUser.sucursal.trim() : '';
  if(!suc) return null;
  return (e) => String(e['Ubicación']||'').trim().toLowerCase() === suc.toLowerCase();
}
function filterBySucursal(arr){
  const fn = getSucursalFilter();
  if(!fn) return arr;
  const filtered = arr.filter(fn);
  console.log(`🏢 Filtro sucursal "${getUserSucursal()}": ${filtered.length} de ${arr.length} empleados`);
  if(filtered.length === 0 && arr.length > 0){
    const muestra = [...new Set(arr.slice(0,5).map(e=>e['Ubicación']||'(vacío)'))];
    console.warn('⚠️ Valores de "Ubicación" en nómina:', muestra);
  }
  return filtered;
}
function getSucursalLegajos(){
  const fn = getSucursalFilter();
  if(!fn) return null;
  const legSet = new Set();
  getActiveEmployees().filter(fn).forEach(e => legSet.add(String(e['Legajo']).trim()));
  console.log(`📍 getSucursalLegajos: ${legSet.size} legajos para "${getUserSucursal()}"`);
  if(legSet.size === 0){
    const muestra = [...new Set(getActiveEmployees().slice(0,8).map(e=>e['Ubicación']||'(vacío)'))];
    console.warn('⚠️ Valores de Ubicación en nómina:', muestra);
  }
  return legSet;
}
function sucursalTitle(){
  if(role === 'admin' && adminSucursal !== 'ambas'){
    return ` · ${adminSucursal.charAt(0).toUpperCase() + adminSucursal.slice(1)}`;
  }
  if(role !== 'analyst') return '';
  const suc = getUserSucursal();
  return suc ? ` · ${suc}` : '';
}

async function ausentismoTab(el, mesSeleccionado=null){
  el.innerHTML = `<div class="sec active">
    <div class="sh"><div><h2>Ausentismo</h2><p>Cargando datos...</p></div></div>
    <div style="display:flex;align-items:center;justify-content:center;padding:60px;gap:16px">
      <div class="spinner"></div><span style="color:var(--mid)">Cargando ausentismo...</span>
    </div></div>`;

  await loadAusencias();
  const excluir = ['Ausencia Justificada','Perm. Gremial'];

  // Filtro de sector (supervisor) o sucursal (analyst)
  const sectorLegajos = (role === 'supervisor') ? getSectorLegajos() : (role === 'analyst' || (role === 'admin' && adminSucursal !== 'ambas')) ? getSucursalLegajos() : null;
  const filterBySector = (raw) => sectorLegajos
    ? raw.filter(r => {
        const leg = String(r['Legajo']||'').trim();
        return sectorLegajos.has(leg) || sectorLegajos.has(String(parseInt(leg)||leg));
      })
    : raw;

  const rawFiltrado = ausenciasRaw ? filterBySector(ausenciasRaw) : null;
  const hcSector = sectorLegajos ? sectorLegajos.size : null;
  let d = rawFiltrado ? procesarAusenciasRaw(rawFiltrado, excluir, hcSector) : procesarAusenciasRaw([], excluir, hcSector);

  // Título para supervisor o analyst
  const sectorTitle = (role === 'supervisor' && getUserSectors().length)
    ? ` · ${getUserSectors().join(', ')}`
    : sucursalTitle();

  // If a specific month is selected, recalculate for that month
  if(mesSeleccionado && ausenciasRaw){
    const normMes = (val) => {
      if(!val) return '';
      const s = String(val).trim();
      if(s.match(/^\d{4}-\d{2}$/)) return s;
      const m = s.match(/(\d{4})-(\d{2})/);
      return m ? m[1]+'-'+m[2] : '';
    };
    const filtered = filterBySector(ausenciasRaw).filter(r => {
      const mot = String(r['Motivo']||r['motivo']||'').trim();
      const mes = normMes(r['Mes']||r['mes']||'');
      return !excluir.includes(mot) && mes === mesSeleccionado;
    });
    const [anio, mesNum] = mesSeleccionado.split('-').map(Number);
    const label = new Date(anio,mesNum-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});
    const diasEnMes = (fIni, fFin) => ausDiasEnMes(fIni, fFin, anio, mesNum);
    const empDet={}, motDet={}, critDet={};
    let totalD=0; const empsSet=new Set();
    filtered.forEach(r=>{
      const leg=String(r['Legajo']||'').trim(), nom=String(r['Nombre']||'').trim();
      const mot=String(r['Motivo']||'Sin dato').trim();
      const dv=diasEnMes(r['Fecha Inicio']||r['fecha inicio'],r['Fecha Fin']||r['fecha fin']);
      if(!leg||dv===0) return;
      totalD+=dv; empsSet.add(leg);
      if(!empDet[leg]) empDet[leg]={Legajo:leg,Nombre:nom,total_dias:0,total_eventos:0,ultimo_motivo:mot};
      empDet[leg].total_dias+=dv; empDet[leg].total_eventos++;
      motDet[mot]=(motDet[mot]||0)+dv;
      if(['Suspension','Accidente','Ausencia s/aviso','Aus. c/Aviso'].includes(mot)){
        const k=`${leg}-${mot}`;
        if(!critDet[k]) critDet[k]={Legajo:leg,Nombre:nom,Motivo:mot,count:0};
        critDet[k].count++;
      }
    });
    const diasMesSel=new Date(anio, mesNum, 0).getDate();
    // Para supervisor usamos el headcount de su sector; para otros, el total
    const hcBase = hcSector || (employees.length||794);
    const tasa=parseFloat(((totalD/(hcBase*diasMesSel))*100).toFixed(1));
    d = {
      ...d,
      empleados: Object.values(empDet).sort((a,b)=>b.total_dias-a.total_dias),
      porMotivo: Object.entries(motDet).sort((a,b)=>b[1]-a[1]).map(([Motivo,dias])=>({Motivo,dias})),
      criticos: Object.values(critDet),
      totalDias: totalD, totalEventos: filtered.length,
      empleadosAfectados: empsSet.size,
      mesActual: label, tasaAusentismo: tasa
    };
  }

  const totalEmp = d.empleadosAfectados;
  const headcount = sectorLegajos ? sectorLegajos.size : (employees.length || 794);
  const pctAus = ((totalEmp/headcount)*100).toFixed(1);
  const varDir = parseFloat(d.variacion||0);
  const mesActivo = mesSeleccionado || (d.mesKey||'');

  el.innerHTML=`<div class="sec active">
  <div class="sh">
    <div><h2>Ausentismo</h2>
      <p>${mesSeleccionado ? 'Análisis de mes seleccionado' : 'Último mes cargado'} · ${d.mesActual}${sectorTitle}</p>
    </div>
    <button class="btn bts" onclick="ausenciasLoaded=false;ausentismoTab(document.getElementById('content'))">↻ Actualizar</button>
  </div>

  <!-- SELECTOR DE MES -->
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap">

        class="btn ${m.mesKey===mesActivo?'btp':'bts'}"
        style="font-size:11px;padding:5px 12px">${m.label}</button>
    `).join('') : ''}
    ${mesSeleccionado ? `<button onclick="ausentismoTab(document.getElementById('content'))" class="btn bts" style="font-size:11px;padding:5px 12px">↩ Último mes</button>` : ''}
  </div>

  ${!mesSeleccionado && varDir !== 0 ? `
  <div class="alert ${varDir > 0 ? 'ad' : 'ag'}">
    ${varDir > 0 ? '▲' : '▼'} Tasa de ausentismo 
    <strong>${varDir > 0 ? 'aumentó' : 'bajó'} ${Math.abs(varDir)}%</strong> 
    respecto a ${d.mesPrevio} (era ${d.tasaPrevia}%)
  </div>` : ''}

  ${d.criticos && d.criticos.filter(c=>c.Motivo==='Suspension').length>0 ?
    `<div class="alert ad">${d.criticos.filter(c=>c.Motivo==='Suspension').reduce((a,b)=>a+b.count,0)} suspensiones en ${d.mesActual}</div>` : ''}
  ${d.criticos && d.criticos.filter(c=>c.Motivo==='Accidente').length>0 ?
    `<div class="alert aw">${d.criticos.filter(c=>c.Motivo==='Accidente').reduce((a,b)=>a+b.count,0)} accidentes en ${d.mesActual}</div>` : ''}

  <div class="kgrid">
    <div class="kcard kd"><div class="klbl">Tasa Ausentismo</div><div class="kval">${d.tasaAusentismo}%</div>
      <span class="kchg ${varDir>0?'cdo':varDir<0?'cup':'cne'}">${varDir>0?'↑ +'+varDir:varDir<0?'↓ '+varDir:'= sin cambio'}</span></div>
    <div class="kcard kw"><div class="klbl">Empleados afectados</div><div class="kval">${totalEmp}</div><span class="kchg cdo">${pctAus}% plantel</span></div>
    <div class="kcard ka"><div class="klbl">Días ausentes</div><div class="kval">${d.totalDias}</div><span class="kchg cne">${d.mesActual}</span></div>
    <div class="kcard kd"><div class="klbl">Suspensiones</div><div class="kval">${d.criticos?d.criticos.filter(c=>c.Motivo==='Suspension').reduce((a,b)=>a+b.count,0):0}</div></div>
    <div class="kcard kw"><div class="klbl">Accidentes</div><div class="kval">${d.criticos?d.criticos.filter(c=>c.Motivo==='Accidente').reduce((a,b)=>a+b.count,0):0}</div></div>
  </div>

  <div class="cgrid">
    <div class="cc">
      <div class="ct">Evolución Mensual</div>

      <canvas id="ch-aus-mes"></canvas>
    </div>

      <canvas id="ch-aus-mot"></canvas>
    </div>
  </div>

  <div class="tcard">
    <div class="thead">

      <tbody>
        ${d.empleados.slice(0,15).map((e,i)=>`<tr>

          <td><div style="display:flex;align-items:center;gap:8px">

          <td><span class="pill ${e.total_dias>15?'pd':e.total_dias>5?'pw':'pg'}">${e.total_dias>15?'Crítico':e.total_dias>5?'Moderado':'Normal'}</span></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>

  ${d.criticos && d.criticos.filter(c=>['Suspension','Accidente'].includes(c.Motivo)).length > 0 ? `
  <div class="tcard">
    <div class="thead"><h3>Casos Críticos · ${d.mesActual}</h3></div>
    <table>
      <thead><tr><th>Empleado</th><th>Legajo</th><th>Motivo</th><th>Cantidad</th></tr></thead>
      <tbody>
        ${d.criticos.filter(c=>['Suspension','Accidente'].includes(c.Motivo)).sort((a,b)=>b.count-a.count).map(e=>`<tr>
          <td><strong>${e.Nombre}</strong></td>
          <td style="color:var(--dim);font-size:11px">${e.Legajo}</td>
          <td><span class="pill ${e.Motivo==='Suspension'?'pd':'pw'}">${e.Motivo}</span></td>

        </tr>`).join('')}
