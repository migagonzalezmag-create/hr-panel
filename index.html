<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRnini · Panel de Gestión</title>
<link rel="manifest" href="manifest-hrnini.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/hrnini-192.png">
<link rel="apple-touch-icon" href="icons/hrnini-192.png">
<meta name="theme-color" content="#002E9D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HRnini">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="liquidacion.js"></script>
<style>
:root {
  /* Marca Nini (identidad/guia-de-marca.md): azul #002E9D, rojo #E81911 */
  --bg:#F5F7FB; --surface:#FFFFFF; --surface2:#F0F3F9; --border:#E3E8F2;
  --a:#002E9D; --b:#5B7FD6; --c:#0F7B4A; --w:#B45309; --d:#D2140D; --rojo:#E81911;
  --text:#1F2937; --dim:#5B6474; --mid:#4B5563;
  --card2:#F0F3F9; --txt:#1F2937;
}
*{margin:0;padding:0;box-sizing:border-box}
@media print{.sidebar,.topbar,.sb-overlay,.liq-noprint,.toast{display:none!important}.content{margin:0!important;padding:0!important;max-width:none!important}body{background:#fff!important;color:#000!important}.kcard,.cc,.tcard,.fcard{background:#fff!important;border-color:#bbb!important;break-inside:avoid}td,th,.klbl,.cs{color:#000!important}}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#002E9D 0,#002E9D 42%,var(--bg) 42%);
  position:relative;overflow:hidden}
#login::before{content:none}
.lcard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:44px 40px;width:420px;box-shadow:0 20px 50px rgba(0,30,100,.18);
  animation:fadeUp .6s ease}
.llogo{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.llogo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--a),var(--b));border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:18px}
.llogo h1{font-family:'Poppins',sans-serif;font-size:20px;font-weight:700;color:var(--a)}
.llogo img{height:46px;width:auto}
.llogo span{color:var(--a)}
.lcard h2{font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;color:var(--a);margin-bottom:6px}
.lcard>p{color:var(--mid);font-size:14px;margin-bottom:32px}
.roles{display:grid;gap:10px;margin-bottom:24px}
.rbtn{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;
  border:1.5px solid var(--border);background:var(--surface2);color:var(--text);
  cursor:pointer;transition:all .2s;text-align:left;font-family:inherit}
.rbtn:hover{border-color:var(--a);background:rgba(0,46,157,.07)}
.rbtn.active{border-color:var(--a);background:rgba(0,46,157,.12);box-shadow:0 0 20px rgba(0,46,157,.15)}
.ricon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.rinfo strong{display:block;font-size:14px;font-weight:600}
.rinfo small{color:var(--mid);font-size:12px}
.lbtn{width:100%;padding:14px;border-radius:12px;border:none;
  background:var(--a);color:#fff;
  font-family:'Poppins',sans-serif;font-size:15px;font-weight:600;cursor:pointer;
  transition:opacity .2s,transform .1s;letter-spacing:.3px}
.lbtn:hover{opacity:.9;transform:translateY(-1px)}

/* LOADING */
#loading{display:none;min-height:100vh;align-items:center;justify-content:center;
  flex-direction:column;gap:20px;background:var(--bg)}
.spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--a);
  border-radius:50%;animation:spin .8s linear infinite}
#loading p{color:var(--mid);font-size:14px}

/* APP */
#app{display:none;min-height:100vh}

/* SIDEBAR */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:110;
  transition:transform .3s ease}
.sb-logo{padding:20px 18px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--border)}
.sb-logo .tlogo{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--a)}
.sb-logo img{height:38px;width:auto}
.sb-logo small{display:block;font-size:11px;font-weight:400;color:var(--dim)}
.sb-group{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);padding:14px 14px 6px;display:flex;align-items:center;gap:8px}
.sb-group svg{width:14px;height:14px}
.sb-nav{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px}
.sb-tab{padding:9px 14px;border-radius:9px;border:none;background:transparent;color:var(--text);
  font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;transition:all .2s;
  text-align:left;white-space:nowrap;display:flex;align-items:center;gap:8px;text-decoration:none}
.sb-tab:hover:not(.active){color:var(--a);background:var(--surface2)}
.sb-tab.active{background:rgba(0,46,157,.12);color:var(--a);font-weight:600;
  box-shadow:none}
.sb-tab.sb-main.active{background:var(--a);color:#fff}
.sb-tab .tab-icon{width:18px;height:18px;display:inline-flex;flex-shrink:0}
.sb-tab .tab-icon svg{width:18px;height:18px}
.sb-footer{padding:14px 18px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.sb-user{display:flex;align-items:center;gap:8px}

/* TOPBAR (solo mobile) */
.topbar{display:none;align-items:center;padding:0 14px;height:50px;background:var(--surface);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.tlogo{font-family:'Poppins',sans-serif;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.dot{display:none}
.tright{display:flex;align-items:center;gap:10px}
.rbadge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.2px}
.ba{background:rgba(15,123,74,.15);color:var(--c);border:1px solid rgba(15,123,74,.25)}
.bs{background:rgba(217,119,6,.15);color:var(--w);border:1px solid rgba(217,119,6,.25)}
.bd{background:rgba(0,46,157,.15);color:var(--a);border:1px solid rgba(0,46,157,.25)}
.xbtn{padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;
  color:var(--dim);font-family:inherit;font-size:12px;cursor:pointer;transition:all .2s}
.xbtn:hover{border-color:var(--d);color:var(--d)}
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:105}

/* CONTENT */
.content{flex:1;padding:28px 32px;max-width:1440px;margin:0 auto;width:auto;margin-left:248px}
.sec{display:none;animation:fadeUp .3s ease}
.sec.active{display:block}

/* SECTION HEADER */
.sh{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.sh h2{font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;color:var(--a);margin-bottom:3px}
.sh p{color:var(--mid);font-size:13px}

/* KPI GRID */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 1px 2px rgba(16,24,40,.04);
  position:relative;overflow:hidden;transition:transform .2s}
.kcard:hover{transform:translateY(-2px)}
.kcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kcard.ka::before{background:var(--a)}
.kcard.kb::before{background:var(--b)}
.kcard.kc::before{background:var(--c)}
.kcard.kw::before{background:var(--w)}
.kcard.kd::before{background:var(--d)}
.klbl{font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.kval{font-family:'Poppins',sans-serif;font-size:28px;font-weight:700;line-height:1;margin-bottom:6px}
.kcard.ka .kval{color:var(--a)} .kcard.kb .kval{color:var(--b)}
.kcard.kc .kval{color:var(--c)} .kcard.kw .kval{color:var(--w)} .kcard.kd .kval{color:var(--d)}
.kchg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.cup{background:rgba(15,123,74,.12);color:var(--c)} .cdo{background:rgba(232,25,17,.12);color:var(--d)}
.cne{background:rgba(91,100,116,.15);color:var(--dim)}

/* CHARTS */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.cgrid.c3{grid-template-columns:2fr 1fr 1fr}
@media(max-width:860px){.cgrid,.cgrid.c3{grid-template-columns:1fr}}
.cc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.ct{font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;margin-bottom:3px}
.cs{font-size:11px;color:var(--dim);margin-bottom:14px}
canvas{max-height:220px}

/* TABLE */
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);overflow:hidden;margin-bottom:20px}
.thead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.thead h3{font-family:'Poppins',sans-serif;font-size:13px;font-weight:700}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:9px 18px;font-size:10px;font-weight:600;color:var(--dim);
  text-transform:uppercase;letter-spacing:.8px;background:var(--surface2);border-bottom:1px solid var(--border)}
td{padding:11px 18px;font-size:12px;border-bottom:1px solid #EEF2F9}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(0,46,157,.03)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600}
.pg{background:rgba(15,123,74,.12);color:var(--c)} .pb{background:rgba(0,46,157,.12);color:var(--a)}
.pw{background:rgba(217,119,6,.12);color:var(--w)} .pd{background:rgba(232,25,17,.12);color:var(--d)}
.pgy{background:rgba(91,100,116,.15);color:var(--mid)}

/* SEARCH */
.sinput{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);
  padding:7px 12px;font-family:inherit;font-size:12px;outline:none;width:200px;transition:border-color .2s}
.sinput:focus{border-color:var(--a)}

/* ALERT */
.alert{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;margin-bottom:10px;font-size:12px}
.aw{background:rgba(217,119,6,.1);border:1px solid rgba(217,119,6,.25);color:var(--w)}
.ad{background:rgba(232,25,17,.1);border:1px solid rgba(232,25,17,.25);color:var(--d)}
.ai{background:rgba(0,46,157,.08);border:1px solid rgba(0,46,157,.2);color:var(--a)}
.ag{background:rgba(15,123,74,.08);border:1px solid rgba(15,123,74,.2);color:var(--c)}

/* FORM */
.fcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:18px}
.fcard h3{font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;margin-bottom:16px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:700px){.fgrid,.fg3{grid-template-columns:1fr}}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
label{font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.6px}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:9px 12px;font-family:inherit;font-size:13px;transition:border-color .2s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(0,46,157,.1)}
select option{background:var(--surface2)}
textarea{resize:vertical;min-height:70px}
.brow{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.btn{padding:9px 18px;border-radius:8px;border:none;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.btp{background:var(--a);color:#fff}
.btp:hover{background:#001F6B}
.bts{background:var(--surface2);border:1px solid var(--border);color:var(--mid)}
.bts:hover{border-color:var(--a);color:var(--text)}

/* PROGRESS */
.pbar{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:3px}
.pfill{height:100%;border-radius:3px}

/* COST */
.chl{background:#EEF2FB;
  border:1px solid rgba(0,46,157,.2);border-radius:14px;padding:22px;margin-bottom:18px}
.chlg{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:600px){.chlg{grid-template-columns:1fr 1fr}}
.ci h4{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.ci .amt{font-family:'Poppins',sans-serif;font-size:20px;font-weight:800;color:var(--a)}
.ci .amt.dng{color:var(--d)} .ci .amt.grn{color:var(--c)}

/* AVATAR */
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0;overflow:hidden;white-space:nowrap;min-width:30px}
.notranslate,.av{-webkit-text-fill-color:initial}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--dim)}
.empty .em{font-size:36px;margin-bottom:10px}
.empty p{font-size:13px}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--c);
  border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--c);box-shadow:0 8px 24px rgba(16,24,40,.15);z-index:999;
  transform:translateY(60px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}

/* MOBILE */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sb-overlay.open{display:block}
  .topbar{display:flex}
  .hamburger{display:block}
  .content{margin-left:0;padding:14px}
  .kgrid{grid-template-columns:1fr 1fr}
  .chlg{grid-template-columns:1fr 1fr}
  th,td{padding:8px 12px}
  .sinput{width:100%}
  .lcard{width:95%;padding:32px 24px}
}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 8px var(--a)}50%{box-shadow:0 0 16px var(--a),0 0 4px var(--c)}}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lcard">
    <div class="llogo">
      <img src="icons/nini-logo.png" alt="Logo de Nini">
      <h1>HRnini <small style="display:block;font-size:12px;font-weight:400;color:var(--dim)">Panel de Gestión de RRHH</small></h1>
    </div>
    <h2>Te damos la bienvenida</h2>
    <p>Ingresá con tu usuario y contraseña</p>
    <div style="display:grid;gap:12px;margin-bottom:20px">
      <div class="fg">
        <label style="font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:block">Usuario</label>
        <input type="text" id="inp-user" placeholder="Tu nombre y apellido" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="fg">
        <label style="font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;display:block">Contraseña</label>
        <input type="password" id="inp-pass" placeholder="••••••••" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div id="login-error" style="display:none;color:var(--d);font-size:12px;background:rgba(232,25,17,.1);border:1px solid rgba(232,25,17,.25);border-radius:8px;padding:10px 12px">
        Usuario o contraseña incorrectos
      </div>
    </div>
    <button class="lbtn" onclick="doLogin()">Ingresar →</button>
    <p style="text-align:center;margin-top:14px;font-size:11px;color:var(--dim)">¿Problemas para ingresar? Contactá a RRHH</p>
  </div>
</div>

<!-- LOADING -->
<div id="loading" style="display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:var(--bg)">
  <div class="spinner"></div>
  <p style="color:var(--mid);font-size:14px">Cargando datos desde Google Sheets…</p>
</div>

<!-- APP -->
<div id="app">
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sb-logo">
      <div class="tlogo"><img src="icons/nini-logo.png" alt="Logo de Nini"><div>HRnini<small>Panel de Gestión</small></div></div>
    </div>
    <div id="suc-filter" style="display:none;padding:10px 14px;border-bottom:1px solid var(--border);gap:4px;flex-wrap:wrap">
      <span style="font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.8px;width:100%;margin-bottom:2px">SEDE</span>
      <button id="suc-ambas" class="btn bts" style="font-size:11px;padding:4px 10px;flex:1" onclick="setAdminSucursal('ambas')">Ambas</button>
      <button id="suc-lp" class="btn" style="font-size:11px;padding:4px 10px;flex:1;background:var(--card2);color:var(--txt)" onclick="setAdminSucursal('la plata')">LP</button>
      <button id="suc-mo" class="btn" style="font-size:11px;padding:4px 10px;flex:1;background:var(--card2);color:var(--txt)" onclick="setAdminSucursal('moreno')">MO</button>
    </div>
    <div class="sb-nav" id="sb-nav"></div>
    <div class="sb-footer">
      <div class="sb-user">
        <span id="rbadge" class="rbadge"></span>
      </div>
      <button class="xbtn" style="width:100%;text-align:center" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="sb-overlay" id="sb-overlay" onclick="toggleSidebar()"></div>

  <!-- TOPBAR -->
  <div class="topbar">
    <button class="hamburger" onclick="toggleSidebar()" aria-label="Abrir menú"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="tlogo" style="margin-left:10px"><img src="icons/nini-logo.png" alt="" style="height:28px;width:auto">HRnini</div>
    <div class="tright" style="margin-left:auto">
    </div>
  </div>

  <div class="content" id="content"></div>
</div>

<div class="toast" id="toast">✓ <span id="tmsg"></span></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmQBrIe-bBFRidksFzWTx2JYf-LrVv7pGKnZdNmoFyOc3PqagjwNq6vavd6sKeQF4vGg/exec";

// ─── CONEXIÓN SEGURA CON EL APPS SCRIPT ───────────────────────
// El login se valida en el servidor y cada pedido viaja con un token.
// Este archivo no guarda datos de empleados ni contraseñas.
const SESION_KEY = 'hrnini_sesion';
let authToken = null;

async function api(payload){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita el preflight CORS de Apps Script
    body: JSON.stringify(Object.assign({}, payload, { token: authToken })),
  });
  const data = await res.json();
  if(data && !Array.isArray(data) && data.error){
    if(data.code === 'AUTH' && payload.action !== 'login') sesionVencida();
    const err = new Error(data.error); err.code = data.code; throw err;
  }
  return data;
}

// Devuelve un objeto parecido a fetch() para no reescribir cada cargador.
async function hojaResp(hoja){
  const data = await api({ action: 'datos', hoja });
  return { ok: true, json: async () => data };
}

function guardarSesion(token, usuario){

function parseCSV(txt){
  const lines = txt.trim().split('\n');
  const headers = lines[0].split(',').map(h=>h.trim().replace(/"/g,''));
  return lines.slice(1).map(line=>{
    const vals = splitCSVLine(line);
    const obj = {};
    headers.forEach((h,i)=>{ obj[h] = (vals[i]||'').trim().replace(/"/g,''); });
    return obj;
  }).filter(e=>e['Legajo']&&e['Legajo'].trim()!=='');
}

function splitCSVLine(line){
  const result=[]; let cur='', inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){inQ=!inQ}
    else if(c===','&&!inQ){result.push(cur);cur='';}
    else cur+=c;
  }
  result.push(cur);
  return result;
}

function parseFecha(fechaStr){
  if(!fechaStr) return null;
  const s = String(fechaStr).trim();
  // Formato ISO con hora: 2026-07-13T00:00:00.000Z (lo que suele mandar Google Sheets)
  // Se toma SOLO la parte de fecha, ignorando hora/zona horaria, para evitar que
  // se corra un día al convertir a la zona horaria local (Argentina UTC-3)
  const isoConHora = s.match(/^(\d{4})-(\d{2})-(\d{2})T/);
  if(isoConHora){
    return new Date(parseInt(isoConHora[1]), parseInt(isoConHora[2])-1, parseInt(isoConHora[3]));
  }
  // Formato ISO: 1987-07-01
  if(s.match(/^\d{4}-\d{2}-\d{2}$/)){
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  // Formato dd/mm/yyyy: 01/07/1987
  if(s.match(/^\d{1,2}\/\d{1,2}\/\d{4}$/)){
    const [d,m,y] = s.split('/').map(Number);
    return new Date(y, m-1, d);
  }
  // Formato número serial de Excel (días desde 1/1/1900)
  if(s.match(/^\d{5}$/)){
    const serial = parseInt(s);
    const utc = new Date(Date.UTC(1899, 11, 30) + serial * 86400000);
    return new Date(utc.getFullYear(), utc.getMonth(), utc.getDate());
  }
  // Fallback
  const d = new Date(fechaStr);
  return isNaN(d) ? null : d;
}

function formatFecha(fechaStr){
  const d = parseFecha(fechaStr);
  if(!d) return '-';
  return d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit', year:'numeric'});
}

function calcAntig(fechaStr){
  if(!fechaStr) return 0;
  const d = parseFecha(fechaStr);
  if(!d || isNaN(d)) return 0;
  return ((new Date()-d)/1000/60/60/24/365.25);
}

function buildApp(){

      return `<a class="sb-tab" href="${EXTERNAL_TABS[t]}" target="_blank" rel="noopener">${icono}${t} ↗</a>`;
    }
    return `<button class="sb-tab ${t==='Inicio'?'sb-main':''} ${t===r.tabs[0]?'active':''}" onclick="switchTab(this,'${t}')">${icono}${t}</button>`;
  };
  const enGrupo = new Set();
  let html = '';
  TAB_GROUPS.forEach(g => {
    const tabs = g.tabs.filter(t => r.tabs.includes(t));

    if(g.nombre) html += `<div class="sb-group">${g.icono}${g.nombre}</div>`;
    html += tabs.map(t => itemTab(t, !g.nombre)).join('');
  });
  const sueltas = r.tabs.filter(t => !enGrupo.has(t));
  if(sueltas.length) html += `<div class="sb-group">Otros</div>` + sueltas.map(t => itemTab(t, false)).join('');

    if(userSectors.length > 0){

function antigTab(el){
  const employees_act=filterBySucursal(getActiveEmployees());
  const tramos={' <1 año':[],'1-3 años':[],'3-5 años':[],'5-10 años':[],'10-20 años':[],' +20 años':[]};
  employees_act.forEach(e=>{
    const a=calcAntig(e['Fecha Ingreso']);
    const n=e['Nombre']||'';
    if(a<1) tramos[' <1 año'].push(n);
    else if(a<3) tramos['1-3 años'].push(n);
    else if(a<5) tramos['3-5 años'].push(n);
    else if(a<10) tramos['5-10 años'].push(n);
    else if(a<20) tramos['10-20 años'].push(n);
    else tramos[' +20 años'].push(n);
  });

  // Longest serving
  const sorted=[...employees_act].sort((a,b)=>calcAntig(b['Fecha Ingreso'])-calcAntig(a['Fecha Ingreso']));

  el.innerHTML=`<div class="sec active">
  <div class="sh"><div><h2>Análisis de Antigüedad</h2><p>Distribución temporal del plantel</p></div></div>
  <div class="kgrid">
    ${Object.entries(tramos).map(([t,arr],i)=>{
      const cols=['kd','kw','ka','ka','kc','kc'];
      return `<div class="kcard ${cols[i]}"><div class="klbl">${t}</div><div class="kval">${arr.length}</div>
        <span class="kchg cne">${((arr.length/employees_act.length)*100).toFixed(1)}% del plantel</span></div>`;
    }).join('')}
  </div>
  <div class="cgrid">
    <div class="cc"><div class="ct">Pirámide de Antigüedad</div><div class="cs">Cantidad de empleados por tramo</div><canvas id="ch-ant2"></canvas></div>
    <div class="cc"><div class="ct">Top 10 Mayor Antigüedad</div><div class="cs">Empleados con más trayectoria</div>
      <div style="margin-top:8px">
      ${sorted.slice(0,10).map((e,i)=>{
        const a=calcAntig(e['Fecha Ingreso']);
        return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;overflow:hidden">
          <span style="color:var(--dim);font-size:11px;width:18px;flex-shrink:0">${i+1}</span>
          <div class="av notranslate" translate="no" style="background:${avColor(e['Nombre']||'')};flex-shrink:0">${avSafe(e['Nombre']||'')}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e['Nombre']||'-'}</div>
            <div style="font-size:10px;color:var(--dim)">${e['Sector']||'-'}</div>
          </div>
          <span style="font-size:12px;font-weight:700;color:var(--c);flex-shrink:0">${a.toFixed(1)}a</span>
        </div>`;}).join('')}
      </div>
    </div>
  </div></div>`;

  setTimeout(()=>{
    charts.ant2=new Chart(document.getElementById('ch-ant2'),{type:'bar',
      data:{labels:Object.keys(tramos),datasets:[{data:Object.values(tramos).map(a=>a.length),
        backgroundColor:['#E81911','#D97706','#002E9D','#002E9D','#0F7B4A','#0F7B4A'],borderRadius:6,borderSkipped:false}]},
      options:{plugins:{legend:{display:false}},scales:{
        x:{ticks:{color:'#5B6474',font:{size:10}},grid:{display:false}},
        y:{ticks:{color:'#5B6474'},grid:{color:'#E3E8F2'}}}}});
  },50);
}

function myTeam(el){
  // Leer sectores del usuario (puede ser "DEPOSITO" o "DEPOSITO, EXPEDICION, SALON")
  const rawSector = currentUser ? (currentUser.sector||'') : '';
  const userSectors = rawSector.split(',').map(s=>s.trim()).filter(Boolean);

  if(userSectors.length === 0){
    el.innerHTML=`<div class="sec active">
    <div class="sh"><div><h2>Mi Equipo</h2><p>Empleados bajo tu supervisión</p></div></div>
    <div class="empty"><div class="em">⚠️</div><p>No tenés sectores asignados. Contactá a RRHH.</p></div>
    </div>`;
    return;
  }

  let team = getActiveEmployees().filter(e => userSectors.includes((e['Sector']||'').trim()));

  // Si el supervisor tiene sucursal asignada, filtrar también por ubicación
  const userSuc = currentUser && currentUser.sucursal ? currentUser.sucursal.trim().toLowerCase() : '';
  if(userSuc){
    team = team.filter(e => {
      const empUbi = String(e['Ubicación']||e['Ubicacion']||'').trim().toLowerCase();

  const sectorLabel = userSectors.length === 1 ? userSectors[0] : userSectors.join(' · ');
  const sucLabel = userSuc ? ` · ${currentUser.sucursal}` : '';

  el.innerHTML=`<div class="sec active">
  <div class="sh"><div><h2>Mi Equipo</h2><p>${sectorLabel}${sucLabel}</p></div></div>
  <div class="kgrid">
    <div class="kcard ka"><div class="klbl">Total personas</div><div class="kval">${team.length}</div></div>
    <div class="kcard kc"><div class="klbl">Antigüedad promedio</div><div class="kval">${avg(team.map(e=>calcAntig(e['Fecha Ingreso']))).toFixed(1)}a</div></div>

  </div>
  ${userSectors.length > 1 ? `
  <div class="fcard" style="margin-bottom:12px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <span style="font-size:12px;color:var(--mid);font-weight:600">Sectores:</span>
      ${userSectors.map(s=>{
        const count = team.filter(e=>(e['Sector']||'').trim()===s).length;
        return `<span class="pill pb">${s} <strong>(${count})</strong></span>`;

    <div class="thead"><h3>Equipo — ${sectorLabel}</h3><span class="pill pb">${team.length} personas</span></div>

      <tbody>${team.map(e=>`<tr>
        <td style="color:var(--dim);font-size:11px">${e['Legajo']}</td>
        <td><div style="display:flex;align-items:center;gap:8px">
          <div class="av notranslate" translate="no" style="background:${avColor(e['Nombre']||'')}">${avSafe(e['Nombre']||'')}</div>

async function loadAusencias(){
  if(ausenciasLoaded && ausenciasRaw.length > 0) return;
  try {
    const res = await hojaResp("Ausentismo");
    if(res.ok){
      const data = await res.json();
      if(data && data.length > 0){
        ausenciasRaw = data;
        ausenciasLoaded = true;
        console.log("✅ Ausentismo en vivo:", data.length, "registros");
        return;
      }
    }
  } catch(e){ console.warn("Ausentismo Apps Script failed:", e.message); }

  // Sin datos: se muestra vacío (ya no hay copia dentro del archivo)
  ausenciasRaw = [];
  ausenciasLoaded = false;
}

function procesarAusenciasRaw(raw, excluir, headcountOverride=null){
  const filtered = raw.filter(r => {
    const mot = String(r['Motivo']||r['motivo']||'').trim();
    return !excluir.includes(mot);
  });

  // Group by Mes column
  // Normalize mes value from any date format to YYYY-MM
  const normalizeMes = (val) => {
    if(!val) return '';
    const s = String(val).trim();
    if(s.match(/^\d{4}-\d{2}$/)) return s;
    const m = s.match(/(\d{4})-(\d{2})/);
    return m ? m[1]+'-'+m[2] : '';
  };

  const porMesMap = {};
  filtered.forEach(r => {
    const mes = normalizeMes(r['Mes']||r['mes']||'');
    if(!mes) return;
    if(!porMesMap[mes]) porMesMap[mes] = [];
    porMesMap[mes].push(r);
  });

  const mesesOrdenados = Object.keys(porMesMap).sort();

  const diasEnMes = (fIni, fFin, anio, mes) => {
    if(!fIni || !fFin) return 0;
    const d1 = new Date(fIni), d2 = new Date(fFin);
    if(isNaN(d1)||isNaN(d2)) return 0;
    const mStart = new Date(anio, mes-1, 1);
    const mEnd = new Date(anio, mes, 1);
    const start = new Date(Math.max(d1, mStart));
    const end = new Date(Math.min(d2, mEnd));
    return Math.max(Math.round((end-start)/(1000*60*60*24)), 0);
  };

  const headcount = headcountOverride || employees.length || 794;
  // Días reales de cada mes (la empresa trabaja los 7 días)
  const diasDelMes = (anio, mes) => new Date(anio, mes, 0).getDate();

  // Calculate stats per month
  const porMes = mesesOrdenados.map(mesKey => {
    const [anio, mesNum] = mesKey.split('-').map(Number);
    const rows = porMesMap[mesKey];
    let dias = 0; const emps = new Set();
    rows.forEach(r => {
      const d = diasEnMes(r['Fecha Inicio']||r['fecha inicio'], r['Fecha Fin']||r['fecha fin'], anio, mesNum);
      if(d > 0){ dias += d; emps.add(String(r['Legajo']||r['legajo']||'').trim()); }
    });
    const diasMes = diasDelMes(anio, mesNum);
    const tasa = parseFloat(((dias/(headcount*diasMes))*100).toFixed(2));
    const label = new Date(anio, mesNum-1, 1).toLocaleDateString('es-AR',{month:'short', year:'numeric'});
    return {mesKey, label, anio, mesNum, dias, empleados:emps.size, tasa};
  });

  // Last month
  const ultimo = porMes[porMes.length-1];
  const penultimo = porMes.length > 1 ? porMes[porMes.length-2] : null;
  const variacion = (ultimo && penultimo) ? parseFloat((ultimo.tasa - penultimo.tasa).toFixed(2)) : 0;

  // Build per-employee for last month
  const lastRows = ultimo ? porMesMap[ultimo.mesKey] : [];
  const empData = {};
  lastRows.forEach(r => {
    const leg = String(r['Legajo']||r['legajo']||'').trim();
    const nom = String(r['Nombre']||r['nombre']||'').trim();
    const mot = String(r['Motivo']||r['motivo']||'Sin dato').trim();
    const d = diasEnMes(r['Fecha Inicio']||r['fecha inicio'], r['Fecha Fin']||r['fecha fin'], ultimo.anio, ultimo.mesNum);
    if(!leg || d===0) return;
    if(!empData[leg]) empData[leg] = {Legajo:leg, Nombre:nom, total_dias:0, total_eventos:0, ultimo_motivo:mot};
    empData[leg].total_dias += d;
    empData[leg].total_eventos++;
    empData[leg].ultimo_motivo = mot;
  });

  // Motivo for last month
  const porMotivo = {};
  lastRows.forEach(r => {
    const mot = String(r['Motivo']||r['motivo']||'Sin dato').trim();
    const d = diasEnMes(r['Fecha Inicio']||r['fecha inicio'], r['Fecha Fin']||r['fecha fin'], ultimo.anio, ultimo.mesNum);
    if(d > 0) porMotivo[mot] = (porMotivo[mot]||0) + d;
  });

  // Criticos for last month
  const criticosMap = {};
  lastRows.filter(r => ['Suspension','Accidente','Ausencia s/aviso','Aus. c/Aviso'].includes(String(r['Motivo']||'').trim()))
    .forEach(r => {
      const key = `${r['Legajo']}-${r['Motivo']}`;
      if(!criticosMap[key]) criticosMap[key] = {Legajo:String(r['Legajo']||''), Nombre:String(r['Nombre']||''), Motivo:String(r['Motivo']||''), count:0};
      criticosMap[key].count++;
    });

  return {
    empleados: Object.values(empData).sort((a,b)=>b.total_dias-a.total_dias),
    porMes,
    porMotivo: Object.entries(porMotivo).sort((a,b)=>b[1]-a[1]).map(([Motivo,dias])=>({Motivo,dias})),
    criticos: Object.values(criticosMap),
    totalDias: ultimo ? ultimo.dias : 0,
    totalEventos: lastRows.length,
    empleadosAfectados: Object.keys(empData).length,
    mesActual: ultimo ? ultimo.label : '',
    mesKey: ultimo ? ultimo.mesKey : '',
    diasHabiles: 30,
    tasaAusentismo: ultimo ? ultimo.tasa : 0,
    variacion,
    mesPrevio: penultimo ? penultimo.label : '',
    tasaPrevia: penultimo ? penultimo.tasa : 0,
    todosMeses: porMes,
    mesesDisponibles: mesesOrdenados,
  };
}

// ─── Helpers de sector para supervisor ───────────────────────────────────────
function getUserSectors(){
  if(!currentUser || !currentUser.sector) return [];
  return currentUser.sector.split(',').map(s=>s.trim()).filter(Boolean);
}
function getSectorLegajos(){
  // Devuelve Set de legajos que pertenecen a los sectores del supervisor
  const sectors = getUserSectors();
  if(!sectors.length) return null; // null = sin filtro
  const suc = currentUser && currentUser.sucursal ? currentUser.sucursal.trim().toLowerCase() : '';
  const legSet = new Set();
  getActiveEmployees().forEach(e => {
    if(sectors.includes((e['Sector']||'').trim())){
      // Si el supervisor tiene sucursal asignada, filtrar también por ubicación
      if(suc){
        const empUbi = String(e['Ubicación']||e['Ubicacion']||'').trim().toLowerCase();
        if(empUbi.includes(suc)) legSet.add(String(e['Legajo']).trim());
      } else {
        legSet.add(String(e['Legajo']).trim());
      }
    }
  });
  return legSet;
}

// ─── Helpers de sucursal para analyst / admin ────────────────────────────────
function getUserSucursal(){
  if(role === 'admin' && adminSucursal !== 'ambas') return adminSucursal;
  if(!currentUser || !currentUser.sucursal) return '';
  return currentUser.sucursal.trim();
}
function getSucursalFilter(){
  if(role === 'admin' && adminSucursal !== 'ambas'){
    return (e) => String(e['Ubicación']||'').trim().toLowerCase() === adminSucursal.toLowerCase();
  }
  if(role !== 'analyst') return null;
  const suc = currentUser && currentUser.sucursal ? currentUser.sucursal.trim() : '';
  if(!suc) return null;
  return (e) => String(e['Ubicación']||'').trim().toLowerCase() === suc.toLowerCase();
}
function filterBySucursal(arr){
  const fn = getSucursalFilter();
  if(!fn) return arr;
  const filtered = arr.filter(fn);
  console.log(`🏢 Filtro sucursal "${getUserSucursal()}": ${filtered.length} de ${arr.length} empleados`);
  if(filtered.length === 0 && arr.length > 0){
    const muestra = [...new Set(arr.slice(0,5).map(e=>e['Ubicación']||'(vacío)'))];
    console.warn('⚠️ Valores de "Ubicación" en nómina:', muestra);
  }
  return filtered;
}
function getSucursalLegajos(){
  const fn = getSucursalFilter();
  if(!fn) return null;
  const legSet = new Set();
  getActiveEmployees().filter(fn).forEach(e => legSet.add(String(e['Legajo']).trim()));
  console.log(`📍 getSucursalLegajos: ${legSet.size} legajos para "${getUserSucursal()}"`);
  if(legSet.size === 0){
    const muestra = [...new Set(getActiveEmployees().slice(0,8).map(e=>e['Ubicación']||'(vacío)'))];
    console.warn('⚠️ Valores de Ubicación en nómina:', muestra);
  }
  return legSet;
}
function sucursalTitle(){
  if(role === 'admin' && adminSucursal !== 'ambas'){
    return ` · ${adminSucursal.charAt(0).toUpperCase() + adminSucursal.slice(1)}`;
  }
  if(role !== 'analyst') return '';
  const suc = getUserSucursal();
  return suc ? ` · ${suc}` : '';
}

  const sectorLegajos = (role === 'supervisor') ? getSectorLegajos() : (role === 'analyst' || (role === 'admin' && adminSucursal !== 'ambas')) ? getSucursalLegajos() : null;

      })

  let d = rawFiltrado ? procesarAusenciasRaw(rawFiltrado, excluir, hcSector) : procesarAusenciasRaw([], excluir, hcSector);

  // Título para supervisor o analyst
  const sectorTitle = (role === 'supervisor' && getUserSectors().length)
    ? ` · ${getUserSectors().join(', ')}`
    : sucursalTitle();

  // If a specific month is selected, recalculate for that month
  if(mesSeleccionado && ausenciasRaw){
    const normMes = (val) => {
      if(!val) return '';
      const s = String(val).trim();
      if(s.match(/^\d{4}-\d{2}$/)) return s;
      const m = s.match(/(\d{4})-(\d{2})/);
      return m ? m[1]+'-'+m[2] : '';
    };
    const filtered = filterBySector(ausenciasRaw).filter(r => {
      const mot = String(r['Motivo']||r['motivo']||'').trim();
      const mes = normMes(r['Mes']||r['mes']||'');
      return !excluir.includes(mot) && mes === mesSeleccionado;
    });
    const [anio, mesNum] = mesSeleccionado.split('-').map(Number);
    const label = new Date(anio,mesNum-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});
    const diasEnMes = (fIni, fFin) => {
      if(!fIni||!fFin) return 0;
      const d1=new Date(fIni),d2=new Date(fFin);
      if(isNaN(d1)||isNaN(d2)) return 0;
      const mS=new Date(anio,mesNum-1,1), mE=new Date(anio,mesNum,1);
      return Math.max(Math.round((new Date(Math.min(d2,mE))-new Date(Math.max(d1,mS)))/(86400000)),0);
    };
    const empDet={}, motDet={}, critDet={};
    let totalD=0; const empsSet=new Set();
    filtered.forEach(r=>{
      const leg=String(r['Legajo']||'').trim(), nom=String(r['Nombre']||'').trim();
      const mot=String(r['Motivo']||'Sin dato').trim();

      if(!leg||dv===0) return;
      totalD+=dv; empsSet.add(leg);
      if(!empDet[leg]) empDet[leg]={Legajo:leg,Nombre:nom,total_dias:0,total_eventos:0,ultimo_motivo:mot};
      empDet[leg].total_dias+=dv; empDet[leg].total_eventos++;
      motDet[mot]=(motDet[mot]||0)+dv;
      if(['Suspension','Accidente','Ausencia s/aviso','Aus. c/Aviso'].includes(mot)){
        const k=`${leg}-${mot}`;
        if(!critDet[k]) critDet[k]={Legajo:leg,Nombre:nom,Motivo:mot,count:0};
        critDet[k].count++;
      }
    });
    const diasMesSel=new Date(anio, mesNum, 0).getDate();
    // Para supervisor usamos el headcount de su sector; para otros, el total
    const hcBase = hcSector || (employees.length||794);
    const tasa=parseFloat(((totalD/(hcBase*diasMesSel))*100).toFixed(1));
    d = {
      ...d,
      empleados: Object.values(empDet).sort((a,b)=>b.total_dias-a.total_dias),
      porMotivo: Object.entries(motDet).sort((a,b)=>b[1]-a[1]).map(([Motivo,dias])=>({Motivo,dias})),
      criticos: Object.values(critDet),
      totalDias: totalD, totalEventos: filtered.length,
      empleadosAfectados: empsSet.size,
      mesActual: label, tasaAusentismo: tasa
    };
  }

  const totalEmp = d.empleadosAfectados;
  const headcount = sectorLegajos ? sectorLegajos.size : (employees.length || 794);
  const pctAus = ((totalEmp/headcount)*100).toFixed(1);
  const varDir = parseFloat(d.variacion||0);
  const mesActivo = mesSeleccionado || (d.mesKey||'');

  el.innerHTML=`<div class="sec active">
  <div class="sh">
    <div><h2>Ausentismo</h2>
      <p>${mesSeleccionado ? 'Análisis de mes seleccionado' : 'Último mes cargado'} · ${d.mesActual}${sectorTitle}</p>
    </div>
    <button class="btn bts" onclick="ausenciasLoaded=false;ausentismoTab(document.getElementById('content'))">↻ Actualizar</button>
  </div>

  <!-- SELECTOR DE MES -->
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap">

      <button onclick="ausentismoTab(document.getElementById('content'),'${m.mesKey}')"
        class="btn ${m.mesKey===mesActivo?'btp':'bts'}"
        style="font-size:11px;padding:5px 12px">${m.label}</button>
    `).join('') : ''}
    ${mesSeleccionado ? `<button onclick="ausentismoTab(document.getElementById('content'))" class="btn bts" style="font-size:11px;padding:5px 12px">↩ Último mes</button>` : ''}
  </div>

  ${!mesSeleccionado && varDir !== 0 ? `
  <div class="alert ${varDir > 0 ? 'ad' : 'ag'}">
    ${varDir > 0 ? '📈' : '📉'} Tasa de ausentismo 
    <strong>${varDir > 0 ? 'aumentó' : 'bajó'} ${Math.abs(varDir)}%</strong>

  </div>` : ''}

  ${d.criticos && d.criticos.filter(c=>c.Motivo==='Suspension').length>0 ?
    `<div class="alert ad">🚨 ${d.criticos.filter(c=>c.Motivo==='Suspension').reduce((a,b)=>a+b.count,0)} suspensiones en ${d.mesActual}</div>` : ''}
  ${d.criticos && d.criticos.filter(c=>c.Motivo==='Accidente').length>0 ?
    `<div class="alert aw">⚠️ ${d.criticos.filter(c=>c.Motivo==='Accidente').reduce((a,b)=>a+b.count,0)} accidentes en ${d.mesActual}</div>` : ''}

  <div class="kgrid">
    <div class="kcard kd"><div class="klbl">Tasa Ausentismo</div><div class="kval">${d.tasaAusentismo}%</div>
      <span class="kchg ${varDir>0?'cdo':varDir<0?'cup':'cne'}">${varDir>0?'↑ +'+varDir:varDir<0?'↓ '+varDir:'= sin cambio'}</span></div>
    <div class="kcard kw"><div class="klbl">Empleados afectados</div><div class="kval">${totalEmp}</div><span class="kchg cdo">${pctAus}% plantel</span></div>
    <div class="kcard ka"><div class="klbl">Días ausentes</div><div class="kval">${d.totalDias}</div><span class="kchg cne">${d.mesActual}</span></div>
    <div class="kcard kd"><div class="klbl">Suspensiones</div><div class="kval">${d.criticos?d.criticos.filter(c=>c.Motivo==='Suspension').reduce((a,b)=>a+b.count,0):0}</div></div>
    <div class="kcard kw"><div class="klbl">Accidentes</div><div class="kval">${d.criticos?d.criticos.filter(c=>c.Motivo==='Accidente').reduce((a,b)=>a+b.count,0):0}</div></div>
  </div>

  <div class="cgrid">

  <div class="tcard">

        </tr>`).join('')}

  ${d.criticos && d.criticos.filter(c=>['Suspension','Accidente'].includes(c.Motivo)).length > 0 ? `

      <tbody>
        ${d.criticos.filter(c=>['Suspension','Accidente'].includes(c.Motivo)).sort((a,b)=>b.count-a.count).map(e=>`<tr>
          <td><strong>${e.Nombre}</strong></td>

  setTimeout(()=>{

function getActiveEmployees(){

}

function countBy(arr,key){
  return arr.reduce((acc,e)=>{const v=e[key]||'Sin dato';acc[v]=(acc[v]||0)+1;return acc;},{});
}
function avg(arr){ return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0; }
function avInit(n){ try{ const clean=(n||'?').split(/[,\s]+/).filter(p=>p.length>1&&/^[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ]/.test(p)); return clean.slice(0,2).map(p=>p[0].toUpperCase()).join('')||'?'; }catch(e){ return '?'; } }
function avColor(n){ const c=['rgba(0,46,157,.25)','rgba(91,127,214,.25)','rgba(15,123,74,.2)','rgba(217,119,6,.2)','rgba(232,25,17,.2)']; return c[(n.charCodeAt(0)||0)%c.length]; }
function escHtml(s){ 
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function avSafe(n){ 
  try{ 
    const clean = String(n||'').replace(/<[^>]*>/g,'').trim();
    const parts = clean.split(/[,\s]+/).filter(p=>p.length>0&&/^[A-Za-záéíóúÁÉÍÓÚñÑ]/.test(p));
    const init = parts.slice(0,2).map(p=>p[0].toUpperCase()).join('');
    return init||'•';
  }catch(e){ return '•'; }
}
function safeName(n){
  return escHtml(String(n||'').replace(/<[^>]*>/g,'').trim());
}
function convPill(c){ return c==='Comercio'?'pb':c==='Camioneros'?'pw':c==='Fuera de Convenio'?'pgy':'pg'; }
function todayStr(){ return new Date().toISOString().split('T')[0]; }
function showToast(msg){ const t=document.getElementById('toast'); document.getElementById('tmsg').textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }

// ── PROCESSAR AUSENTISMO (carga manual) ──────────────────────────────────────
function procesarAusentismo(input){
  const file = input.files[0];
  if(!file) return;
  const mesVal = document.getElementById('aus-mes').value;
  const habiles = parseInt(document.getElementById('aus-habiles').value)||22;
  const [anio, mes] = mesVal.split('-').map(Number);
  const res = document.getElementById('res-aus');
  const mesLabel = new Date(anio, mes-1, 1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  res.innerHTML = `<div style="color:var(--mid);font-size:12px">⏳ Procesando ${file.name}...</div>`;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const text = e.target.result;
      const lines = text.split('\n').filter(l=>l.trim());
      const headers = lines[0].split(',').map(h=>h.trim().replace(/"/g,'').toLowerCase());
      const fIniIdx = headers.findIndex(h=>h.includes('inicio'));
      const fFinIdx = headers.findIndex(h=>h.includes('fin'));
      const motivoIdx = headers.findIndex(h=>h.includes('motivo'));
      const legIdx = headers.findIndex(h=>h.includes('legajo'));
      const excluir = ['ausencia justificada','perm. gremial'];
      let totalDias=0, totalEmps=new Set(), byMotivo={};
      lines.slice(1).forEach(line=>{
        const vals = line.split(',').map(v=>v.trim().replace(/"/g,''));
        const mot = (vals[motivoIdx]||'').trim();
        if(excluir.includes(mot.toLowerCase())) return;
        const fIni = new Date(vals[fIniIdx]);
        const fFin = new Date(vals[fFinIdx]);
        if(isNaN(fIni)||isNaN(fFin)) return;
        const mesInicio = new Date(anio, mes-1, 1);
        const mesFin = new Date(anio, mes, 1);
        const inicio = new Date(Math.max(fIni, mesInicio));
        const fin = new Date(Math.min(fFin, mesFin));
        const dias = Math.max(Math.round((fin-inicio)/(1000*60*60*24)),0);
        if(dias <= 0) return;
        totalDias += dias;
        totalEmps.add(vals[legIdx]||'');
        byMotivo[mot] = (byMotivo[mot]||0) + dias;
      });
      const tasa = ((totalDias/(employees.length||794)/habiles)*100).toFixed(2);
      res.innerHTML = `
        <div class="alert ag">✅ Ausentismo de ${mesLabel} procesado</div>
        <div class="kgrid" style="margin-top:12px;grid-template-columns:repeat(4,1fr)">
          <div class="kcard ka"><div class="klbl">Días ausentes</div><div class="kval" style="font-size:20px">${totalDias}</div></div>
          <div class="kcard kd"><div class="klbl">Tasa</div><div class="kval" style="font-size:20px">${tasa}%</div></div>
          <div class="kcard kw"><div class="klbl">Empleados</div><div class="kval" style="font-size:20px">${totalEmps.size}</div></div>
          <div class="kcard kb"><div class="klbl">Días hábiles</div><div class="kval" style="font-size:20px">${habiles}</div></div>
        </div>
        <div style="margin-top:12px">${Object.entries(byMotivo).sort((a,b)=>b[1]-a[1]).map(([m,d])=>`
          <div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--border)">
            <span>${m}</span><span style="font-weight:700;color:var(--a)">${d} días</span>
          </div>`).join('')}
        </div>
        <p style="font-size:11px;color:var(--dim);margin-top:10px">💡 Pegá las filas en la hoja "Ausentismo" de Google Sheets con la columna Mes = ${mesVal}</p>`;
    } catch(err){ res.innerHTML=`<div class="alert ad">❌ Error: ${err.message}</div>`; }
  };
  reader.readAsText(file,'UTF-8');
}

      const legajosActuales = new Set(employees.map(e=>(e['Legajo']||'').toString().trim()));
      lines.slice(1).forEach(line=>{
        const vals = line.split(',').map(v=>v.trim().replace(/"/g,''));
        const leg = vals[legajoIdx];
        if(!leg) return;
        if(legajosActuales.has(leg)){ duplicados.push(leg); }
        else {
          const emp = {};
          headers.forEach((h,i)=>{ emp[h]=vals[i]||''; });
          emp['Legajo'] = leg; emp['Estado'] = 'Activo';
          nuevos.push(emp);
        }
      });
      if(nuevos.length > 0){
        employees.push(...nuevos);
        res.innerHTML=`
          <div class="alert ag">✅ ${nuevos.length} empleado(s) agregado(s)</div>
          ${duplicados.length>0?`<div class="alert aw">⚠️ ${duplicados.length} legajos ya existían</div>`:''}
          <p style="font-size:11px;color:var(--dim);margin-top:8px">💡 Actualizá también tu Google Sheets para que los cambios sean permanentes.</p>`;
      } else {
        res.innerHTML=`<div class="alert aw">⚠️ No se encontraron empleados nuevos.</div>`;
      }
    } catch(err){ res.innerHTML=`<div class="alert ad">❌ Error: ${err.message}</div>`; }
  };
  reader.readAsText(file, 'UTF-8');
}

let licenciasRaw = null;

function procesarLicenciasRaw(raw, legajosFilter){
  // Normalizar legajosFilter eliminando ceros y espacios
  let legNormSet = null;
  if(legajosFilter){
    legNormSet = new Set([...legajosFilter].map(l => String(parseInt(l.trim())||l.trim())));
  }
  const porEmp={}, porMotivo={}, porAnio={};
  let totalRegistros=0, totalDias=0;
  raw.forEach(r=>{
    const leg=String(r['legajo']||r['Legajo']||'').trim();
    if(!leg) return;
    // Filtro por legajos si aplica — normaliza espacios y ceros
    if(legNormSet){
      const legNorm = String(parseInt(leg)||leg);
      if(!legNormSet.has(leg) && !legNormSet.has(legNorm)) return;
    }
    const nom=String(r['nombre']||r['Nombre']||'').replace(/<[^>]*>/g,'').trim().replace(/[\n\r\t]/g,' ').substring(0,60);
    const dias=parseInt(r['dias']||r['Dias']||0)||0;
    const mot=String(r['motivo']||r['Motivo']||'Sin dato').trim();
    const fechaStr=r['fecha inicio']||r['Fecha Inicio']||'';
    const anio=fechaStr?(parseFecha(fechaStr)?.getFullYear()||0):0;
    const obs=String(r['Observacion']||r['observacion']||'').trim().slice(0,100);
    totalRegistros++; totalDias+=dias;
    porMotivo[mot]=(porMotivo[mot]||0)+dias;
    if(anio>2010) porAnio[anio]=(porAnio[anio]||0)+dias;
    if(!porEmp[leg]) porEmp[leg]={legajo:leg,nombre:nom,totalDias:0,totalEventos:0,motivos:{},ultimos:[]};
    porEmp[leg].totalDias+=dias; porEmp[leg].totalEventos++;
    porEmp[leg].motivos[mot]=(porEmp[leg].motivos[mot]||0)+dias;
    porEmp[leg].ultimos.push({fecha:fechaStr,dias,motivo:mot,obs});
  });
  Object.values(porEmp).forEach(e => {
    e.ultimos.sort((a,b) => (parseFecha(b.fecha)||0) - (parseFecha(a.fecha)||0));
  });
  return {
    empleados:Object.values(porEmp),
    porMotivo:Object.entries(porMotivo).sort((a,b)=>b[1]-a[1]).map(([motivo,dias])=>({motivo,dias})),
    porAnio:Object.entries(porAnio).sort((a,b)=>a[0]-b[0]).map(([anio,dias])=>({anio:parseInt(anio),dias})),
    totalRegistros, totalDias, totalEmpleados:Object.keys(porEmp).length
  };
}

async function loadLicencias(){
  if(licenciasLoaded && licenciasRaw) return;
  try {
    const res = await hojaResp("Licencias");
    if(res.ok){
      const raw = await res.json();
      if(raw && raw.length > 0){
        licenciasRaw = raw;
        licencias = procesarLicenciasRaw(raw, null);
        licenciasLoaded=true;
        console.log("✅ Licencias en vivo:", licencias.totalRegistros, "registros");
        return;
      }
    }
  } catch(e){ console.warn("loadLicencias failed:", e.message); }
  licenciasRaw=[];
  licencias=procesarLicenciasRaw([], null);
  licenciasLoaded=false;
}

async function loadSueldos(){
  if(sueldosLoaded && sueldos.length > 0) return;
  // Try Apps Script
  try {
    const res = await hojaResp("Sueldos");
    if(res.ok){
      const data = await res.json();
      if(data && data.length > 0){
        sueldos = data.map(r => {
          const obj = {};
          Object.keys(r).forEach(k => obj[k] = String(r[k]||''));
          return obj;
        });
        sueldosLoaded = true;
        console.log("✅ Sueldos via Apps Script:", sueldos.length);
        return;
      }
    }
  } catch(e){ console.warn("Sueldos Apps Script failed:", e.message); }
  sueldos = [];
  sueldosLoaded = true;
}

function normalizeMesSueldos(val){
  if(!val) return '';
  const s = String(val).trim();
  if(s.match(/^\d{4}-\d{2}$/)) return s;
  const m = s.match(/(\d{4})-(\d{2})/);
  return m ? m[1]+'-'+m[2] : '';
}

function getSector(legajo){
  const emp = employees.find(e => String(e['Legajo']||'').trim() === String(legajo).trim());
  return emp ? (emp['Sector']||'Sin sector') : 'Sin sector';
}

  'CONTRIBUCION ART','CONTRIB. ART'

];

];

// ─── SUELDOS: estado de sede/mes ─────────────────────────────
let _sedeSueldos = 'ambas';
let _mesActualSueldos = '';

function normSede(val){
  const s = String(val||'').trim().toLowerCase();
  if(s.includes('moreno')) return 'moreno';
  if(s.includes('plata')) return 'la plata';
  return 'sin sede';
}

function sedeLabel(s){
  return s === 'la plata' ? 'La Plata' : s === 'moreno' ? 'Moreno' : s === 'ambas' ? 'Ambas sedes' : 'Sin sede asignada';
}

async function sueldosTab(el){
  el.innerHTML = `<div class="sec active">
    <div class="sh"><div><h2>Sueldos</h2><p>Cargando datos...</p></div></div>
    <div style="display:flex;align-items:center;justify-content:center;padding:60px;gap:16px">
      <div class="spinner"></div><span style="color:var(--mid)">Cargando sueldos...</span>
    </div></div>`;

  await loadSueldos();

  if(!sueldos.length){
    el.innerHTML = `<div class="sec active">
      <div class="sh"><div><h2>Sueldos</h2></div></div>
      <div class="alert ad">❌ No se pudieron cargar los datos de sueldos.</div>
    </div>`;
    return;
  }

  // Admin arranca con la sede elegida en el sidebar; el resto con "ambas"
  _sedeSueldos = (role === 'admin') ? adminSucursal : 'ambas';

  const mesesMap = {};
  sueldos.forEach(r => {
    const mes = normalizeMesSueldos(r['Mes']||r['mes']||'');
    if(mes) mesesMap[mes] = true;
  });
  const mesesDisp = Object.keys(mesesMap).sort();
  const mesActual = mesesDisp[mesesDisp.length - 1];
  const mesPrevio = mesesDisp.length > 1 ? mesesDisp[mesesDisp.length - 2] : null;

  renderSueldosMes(el, mesActual, mesesDisp, mesPrevio);
}

function renderSueldosMes(el, mesKey, mesesDisp, mesPrevio){
  _mesActualSueldos = mesKey;
  _mesesSueldos = mesesDisp;
  _mesPrevioSueldos = mesPrevio || '';

  const mesData = sueldos.filter(r => normalizeMesSueldos(r['Mes']||r['mes']||'') === mesKey);
  const mesLabel = mesKey ? (()=>{ const [a,m]=mesKey.split('-').map(Number); return new Date(a,m-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'}); })() : '';

  // Mapa de nómina por legajo (una sola pasada)
  const empMap = {};
  employees.forEach(e => { empMap[String(e['Legajo']||'').trim()] = e; });

  // Enriquecer con sector, convenio y sede
  const enrichedAll = mesData.map(r => {
    const leg = String(r['Legajo']||r['legajo']||'').trim();
    const emp = empMap[leg];
    const sedeRaw = r['Sede'] || r['sede'] || r['Ubicación'] || r['Ubicacion'] ||
                    (emp ? (emp['Ubicación'] || emp['Ubicacion'] || '') : '');
    return {
      ...r,
      legajo: leg,
      nombre: String(r['Nombre'] || r['nombre'] || (emp ? emp['Nombre'] : '') || ''),
      sector: emp ? (emp['Sector'] || 'Sin sector') : 'Sin sector',
      convenio: emp ? (emp['Convenio'] || 'Sin convenio') : 'Sin convenio',
      sede: normSede(sedeRaw),
      monto: parseFloat(String(r['Monto']||r['monto']||'0').replace(',','.')) || 0,
      novedad: String(r['Novedad']||r['novedad']||'').trim().toUpperCase(),
    };
  });

  // Clasificadores
  const isAporte  = r => APORTES_PATRONALES.some(a => r.novedad.includes(a));
  const isExtra   = r => HORAS_EXTRAS.some(a => r.novedad === a);
  const isFeriado = r => FERIADOS.some(a => r.novedad === a);
  const isDomingo = r => DOMINGOS.some(a => r.novedad === a);
  const isLicPaga = r => LICENCIAS_PAGAS.some(a => r.novedad === a);
  const isDesc    = r => DESCUENTOS.some(a => r.novedad.includes(a));

  const resumen = rows => {
    const sum = f => rows.filter(f).reduce((a,r)=>a+r.monto, 0);
    const masa     = sum(r => !isAporte(r) && !isDesc(r) && r.monto > 0);
    const aportes  = sum(isAporte);
    const extras   = sum(isExtra);
    const feriados = sum(isFeriado);
    const domingos = sum(isDomingo);
    const licPagas = sum(isLicPaga);
    const emps     = new Set(rows.map(r=>r.legajo).filter(Boolean)).size;
    const costo    = masa + aportes;
    const adic     = extras + feriados + domingos;
    return { masa, aportes, extras, feriados, domingos, licPagas, emps, costo, adic, prom: emps ? costo/emps : 0 };
  };

  const fmt = n => '$' + Math.round(n||0).toLocaleString('es-AR');
  const pct = (a,b,dec=1) => b ? ((a/b)*100).toFixed(dec) + '%' : '-';

  // Resumen por sede (siempre sobre el total del mes)
  const sedesPresentes = ['la plata','moreno'];
  const sinSedeRows = enrichedAll.filter(r => r.sede === 'sin sede');
  if(sinSedeRows.length) sedesPresentes.push('sin sede');
  const resSede = {};
  sedesPresentes.forEach(s => { resSede[s] = resumen(enrichedAll.filter(r => r.sede === s)); });
  const resTotal = resumen(enrichedAll);

  // Filas del detalle según sede elegida
  const enriched = _sedeSueldos === 'ambas' ? enrichedAll : enrichedAll.filter(r => r.sede === _sedeSueldos);
  const R = resumen(enriched);

  // Por convenio (sede filtrada)
  const convenios = [...new Set(enriched.map(r=>r.convenio))].filter(Boolean);
  const porConvenio = convenios.map(conv => ({ convenio: conv, ...resumen(enriched.filter(r=>r.convenio===conv)) }))
                               .sort((a,b)=>b.masa-a.masa);

  // Adicionales por sector (sede filtrada)
  const extrasPorSector = {};
  enriched.filter(r => isExtra(r)||isFeriado(r)||isDomingo(r)).forEach(r => {
    extrasPorSector[r.sector] = (extrasPorSector[r.sector]||0) + r.monto;
  });
  const extSectorSort = Object.entries(extrasPorSector).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // Top adicionales por empleado (sede filtrada)
  const extrasPorEmp = {};
  enriched.filter(r=>isExtra(r)||isFeriado(r)||isDomingo(r)).forEach(r=>{
    const leg = r.legajo;
    if(!extrasPorEmp[leg]) extrasPorEmp[leg] = {legajo:leg, nombre:r.nombre, sector:r.sector, convenio:r.convenio, sede:r.sede, extras:0, feriados:0, domingos:0, total:0};
    if(isExtra(r))   extrasPorEmp[leg].extras   += r.monto;
    if(isFeriado(r)) extrasPorEmp[leg].feriados += r.monto;
    if(isDomingo(r)) extrasPorEmp[leg].domingos += r.monto;
    extrasPorEmp[leg].total += r.monto;
  });
  const topExtras = Object.values(extrasPorEmp).sort((a,b)=>b.total-a.total).slice(0,10);

  const mini = (label, val, color) => `
    <div style="background:var(--surface2);border-radius:8px;padding:8px 10px">

      <div style="font-size:13px;font-weight:700;${color?'color:'+color:''}">${val}</div>

    ${sedesPresentes.map(s=>{

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          ${mini('Empleados', x.emps)}

          ${mini('Aportes', fmt(x.aportes), 'var(--w)')}

  </div>

  <div class="cgrid">

        labels: sedesPresentes.map(sedeLabel),
        datasets:[
          {label:'Masa base',   data: sedesPresentes.map(s=>resSede[s].masa - resSede[s].adic), backgroundColor:'rgba(0,46,157,.75)', borderRadius:4, borderSkipped:false},
          {label:'Adicionales', data: sedesPresentes.map(s=>resSede[s].adic),                   backgroundColor:'rgba(232,25,17,.75)',  borderRadius:4, borderSkipped:false},
          {label:'Aportes',     data: sedesPresentes.map(s=>resSede[s].aportes),                backgroundColor:'rgba(217,119,6,.75)', borderRadius:4, borderSkipped:false},
        ]
      },
      options:{
        plugins:{
          legend:{labels:{color:'#4B5563',font:{size:11}}},
          tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': $'+Math.round(ctx.raw).toLocaleString('es-AR')}}
        },
        scales:{
          x:{stacked:true, ticks:{color:'#5B6474'}, grid:{display:false}},
          y:{stacked:true, ticks:{color:'#5B6474', callback:v=>'$'+Math.round(v/1000000)+'M'}, grid:{color:'#E3E8F2'}}
        }
      }
    });

    // Adicionales por tipo
    charts.adictipo = new Chart(document.getElementById('ch-adic-tipo'),{
      type:'doughnut',
      data:{
        labels:['Horas Extra','Feriados','Domingos','Licencias Pagas'],
        datasets:[{ data:[R.extras,R.feriados,R.domingos,R.licPagas], backgroundColor:['#E81911','#D97706','#002E9D','#0F7B4A'], borderWidth:0, hoverOffset:5 }]
      },
      options:{plugins:{legend:{labels:{color:'#4B5563',font:{size:11}}}},cutout:'55%'}
    });

    // Adicionales por sector
    charts.extsect = new Chart(document.getElementById('ch-ext-sect'),{
      type:'bar',
      data:{labels:extSectorSort.map(e=>e[0]),datasets:[{
        data:extSectorSort.map(e=>e[1]), backgroundColor:'rgba(217,119,6,.75)', borderRadius:5, borderSkipped:false
      }]},
      options:{indexAxis:'y',plugins:{legend:{display:false},
        tooltip:{callbacks:{label:ctx=>'$'+Math.round(ctx.raw).toLocaleString('es-AR')}}},
        scales:{
          x:{ticks:{color:'#5B6474',callback:v=>'$'+Math.round(v/1000000)+'M'},grid:{color:'#E3E8F2'}},
          y:{ticks:{color:'#5B6474',font:{size:10}},grid:{display:false}}
        }}
    });
  },50);
}

async function loadAcademia(){
  if(academiaLoaded) return;
  try{
    const r = await fetch(`${ACADEMIA_URL}?accion=statsRH`);
    const d = await r.json();
    if(d.ok) { academiaData = d; academiaLoaded = true; }

}

let negData = null;
let negFiltered = null;

async function negociacionesTab(el){
  el.innerHTML = `<div class="sec active">
    <div class="sh"><div><h2>Negociaciones</h2><p>Cargando datos históricos...</p></div></div>
    <div style="display:flex;align-items:center;justify-content:center;padding:60px;gap:16px">
      <div class="spinner"></div><span style="color:var(--mid)">Cargando negociaciones...</span>
    </div></div>`;

  try {
    const res = await hojaResp("Negociaciones");
    const raw = await res.json();
    negData = raw.map(r => ({
      legajo: String(r['Legajo']||'').trim(),
      nombre: r['Nombre']||'',
      fecha: r['Fecha Baja']||'',
      año: parseInt(r['Año'])||0,
      forma: r['Forma Extincion']||'',
      sector: r['Sector']||'',
      sede: r['Sede']||'',
      motivo: r['Motivo']||'',
      montoARS: parseFloat(r['Monto Negociado'])||0,
      indemARS: parseFloat(r['Indem Ley'])||0,
      ahorroARS: parseFloat(r['Ahorro ARS'])||0,
      pctPagado: parseFloat(r['Porcentaje Pagado'])||0,
      valorDolar: parseFloat(r['Valor Dolar'])||0,
      montoUSD: parseFloat(r['Monto Negociado USD'])||0,
      indemUSD: parseFloat(r['Indem Ley USD'])||0,
      ahorroUSD: parseFloat(r['Ahorro USD'])||0,
    })).filter(r => r.nombre && r.año > 0);

    negFiltered = [...negData];
    renderNegociaciones(el);
  } catch(e){
    el.innerHTML = `<div class="sec active">
      <div class="sh"><div><h2>Negociaciones</h2><p>Error de conexión</p></div></div>
      <div class="empty"><div class="em">📡</div><p>No se pudo cargar la hoja Negociaciones. Verificá que exista en el Google Sheets.</p>
      <button class="btn bts" style="margin-top:16px" onclick="negociacionesTab(document.getElementById('content'))">↻ Reintentar</button>
      </div></div>`;
  }
}

function renderNegociaciones(el){
  const d = negFiltered;

  // KPIs generales
  const total = d.length;
  const ahorroUSD = d.reduce((s,r) => s + r.ahorroUSD, 0);
  const ahorroARS = d.reduce((s,r) => s + r.ahorroARS, 0);
  const montoUSD = d.reduce((s,r) => s + r.montoUSD, 0);
  const indemUSD = d.reduce((s,r) => s + r.indemUSD, 0);
  const pctProm = total > 0 ? d.reduce((s,r) => s + r.pctPagado, 0) / total : 0;
  const pctAhorro = indemUSD > 0 ? ((1 - montoUSD / indemUSD) * 100) : 0;

  // Opciones filtros
  const años = [...new Set(negData.map(r=>r.año))].sort((a,b)=>b-a);
  const sectores = [...new Set(negData.map(r=>r.sector))].sort();
  const sedes = [...new Set(negData.map(r=>r.sede))].sort();
  const motivos = [...new Set(negData.map(r=>r.motivo))].sort();

  // Resumen por año
  const porAño = {};
  d.forEach(r => {
    if(!porAño[r.año]) porAño[r.año] = {cant:0, ahorroUSD:0, montoUSD:0, indemUSD:0};
    porAño[r.año].cant++;
    porAño[r.año].ahorroUSD += r.ahorroUSD;
    porAño[r.año].montoUSD += r.montoUSD;
    porAño[r.año].indemUSD += r.indemUSD;
  });

  // Resumen por motivo
  const porMotivo = {};
  d.forEach(r => {
    if(!porMotivo[r.motivo]) porMotivo[r.motivo] = {cant:0, ahorroUSD:0};
    porMotivo[r.motivo].cant++;
    porMotivo[r.motivo].ahorroUSD += r.ahorroUSD;
  });
  const motivoArr = Object.entries(porMotivo).sort((a,b) => b[1].cant - a[1].cant);

  // Resumen por sector (top 10)
  const porSector = {};
  d.forEach(r => {
    if(!porSector[r.sector]) porSector[r.sector] = {cant:0, ahorroUSD:0};
    porSector[r.sector].cant++;
    porSector[r.sector].ahorroUSD += r.ahorroUSD;
  });
  const sectorArr = Object.entries(porSector).sort((a,b) => b[1].cant - a[1].cant).slice(0,10);

  const fmtUSD = (v) => v >= 1000000 ? (v/1000000).toFixed(2)+'M' : v >= 1000 ? (v/1000).toFixed(1)+'K' : v.toFixed(0);
  const fmtARS = (v) => v >= 1000000000 ? (v/1000000000).toFixed(1)+'B' : v >= 1000000 ? (v/1000000).toFixed(1)+'M' : v >= 1000 ? (v/1000).toFixed(0)+'K' : v.toFixed(0);

  el.innerHTML = `<div class="sec active">
    <div class="sh">
      <div>
        <h2>Negociaciones</h2>
        <p>Historial de bajas negociadas · ${total} registros</p>
      </div>
      <button class="btn bts" onclick="negociacionesTab(document.getElementById('content'))">↻ Actualizar</button>
    </div>

    <!-- FILTROS -->
    <div style="display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;align-items:center">
      <div style="display:flex;gap:6px;align-items:center">
        <span style="font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase">Año</span>
        <select id="neg-año" class="sel" onchange="negFiltrar()">
          <option value="">Todos</option>
          ${años.map(a=>`<option value="${a}">${a}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <span style="font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase">Sector</span>
        <select id="neg-sector" class="sel" onchange="negFiltrar()">
          <option value="">Todos</option>
          ${sectores.map(s=>`<option value="${s}">${s}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <span style="font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase">Sede</span>
        <select id="neg-sede" class="sel" onchange="negFiltrar()">
          <option value="">Todas</option>
          ${sedes.map(s=>`<option value="${s}">${s}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <span style="font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase">Motivo</span>
        <select id="neg-motivo" class="sel" onchange="negFiltrar()">
          <option value="">Todos</option>
          ${motivos.map(m=>`<option value="${m}">${m}</option>`).join('')}
        </select>
      </div>
    </div>

    <!-- KPIs -->
    <div class="kgrid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
      <div class="kcard"><div class="klbl">Total negociaciones</div><div class="kval">${total}</div></div>
      <div class="kcard"><div class="klbl">Ahorro total USD</div><div class="kval" style="color:var(--c)">$${fmtUSD(ahorroUSD)}</div></div>
      <div class="kcard"><div class="klbl">Ahorro total ARS</div><div class="kval" style="color:var(--c)">$${fmtARS(ahorroARS)}</div></div>
      <div class="kcard"><div class="klbl">% Ahorro vs Ley</div><div class="kval" style="color:var(--c)">${pctAhorro.toFixed(1)}%</div></div>
      <div class="kcard"><div class="klbl">Pagado promedio</div><div class="kval">${pctProm.toFixed(1)}%</div></div>
      <div class="kcard"><div class="klbl">Indem. Ley USD</div><div class="kval" style="color:var(--dim)">$${fmtUSD(indemUSD)}</div></div>
    </div>

    <!-- RESUMEN POR AÑO -->
    <div class="card" style="margin-bottom:18px">
      <div style="padding:14px 18px;border-bottom:1px solid var(--border)">
        <span style="font-family:Syne,sans-serif;font-size:13px;font-weight:700">Resumen por Año</span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>Año</th><th>Cant.</th><th>Pagado USD</th><th>Indem. Ley USD</th><th>Ahorro USD</th><th>% Ahorro</th>
          </tr></thead>
          <tbody>
            ${Object.entries(porAño).sort((a,b)=>parseInt(b[0])-parseInt(a[0])).map(([año,v])=>{
              const pct = v.indemUSD > 0 ? ((1 - v.montoUSD/v.indemUSD)*100) : 0;
              return `<tr>
                <td style="font-weight:700">${año}</td>
                <td>${v.cant}</td>
                <td>$${v.montoUSD.toLocaleString('es-AR',{maximumFractionDigits:0})}</td>
                <td>$${v.indemUSD.toLocaleString('es-AR',{maximumFractionDigits:0})}</td>
                <td style="color:var(--c);font-weight:600">$${v.ahorroUSD.toLocaleString('es-AR',{maximumFractionDigits:0})}</td>
                <td><span class="tag" style="background:rgba(15,123,74,.15);color:var(--c)">${pct.toFixed(1)}%</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <!-- RESUMEN POR MOTIVO Y SECTOR -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px">
      <div class="card">
        <div style="padding:14px 18px;border-bottom:1px solid var(--border)">
          <span style="font-family:Syne,sans-serif;font-size:13px;font-weight:700">Por Motivo</span>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>Motivo</th><th>Cant.</th><th>Ahorro USD</th></tr></thead>
            <tbody>
              ${motivoArr.map(([m,v])=>`<tr>
                <td>${m}</td><td>${v.cant}</td>
                <td style="color:var(--c)">$${v.ahorroUSD.toLocaleString('es-AR',{maximumFractionDigits:0})}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div style="padding:14px 18px;border-bottom:1px solid var(--border)">
          <span style="font-family:Syne,sans-serif;font-size:13px;font-weight:700">Top 10 Sectores</span>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>Sector</th><th>Cant.</th><th>Ahorro USD</th></tr></thead>
            <tbody>
              ${sectorArr.map(([s,v])=>`<tr>
                <td>${s}</td><td>${v.cant}</td>
                <td style="color:var(--c)">$${v.ahorroUSD.toLocaleString('es-AR',{maximumFractionDigits:0})}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- DETALLE -->
    <div class="card">
      <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
        <span style="font-family:Syne,sans-serif;font-size:13px;font-weight:700">Detalle de Negociaciones</span>
        <span style="font-size:12px;color:var(--dim)">${total} registros</span>
      </div>
      <div style="overflow-x:auto;max-height:500px;overflow-y:auto">
        <table>
          <thead><tr style="position:sticky;top:0;z-index:2">
            <th>Legajo</th><th>Nombre</th><th>Fecha</th><th>Sector</th><th>Sede</th><th>Motivo</th>
            <th>Pagado USD</th><th>Indem. Ley USD</th><th>Ahorro USD</th><th>% Pagado</th>

function inicioFmtF(f){ return String(f.getUTCDate()).padStart(2,'0') + '/' + String(f.getUTCMonth()+1).padStart(2,'0') + '/' + f.getUTCFullYear(); }

function inicioCalcular(varData, topes){
  const hoyL = new Date();
  const hoy = new Date(Date.UTC(hoyL.getFullYear(), hoyL.getMonth(), hoyL.getDate()));
  const en30 = new Date(hoy.getTime() + 30*86400000);
  const emps = filterBySucursal(getActiveEmployees());
  const porLegajo = {};
  emps.forEach(e => porLegajo[String(e['Legajo']).trim()] = e);
  const dias = (a, b) => Math.round((b - a) / 86400000);

  // Período de prueba (6 meses)
  const enPrueba = [], pruebaVence = [];
  // Hitos de antigüedad (5, 10 y 20 años)
  const hitos = [];
  let sumaAnt = 0, nAnt = 0;
  emps.forEach(e => {
    const ing = LIQ.parseFecha(e['Fecha Ingreso']);
    if(!ing) return;
    const fin = new Date(Date.UTC(ing.getUTCFullYear(), ing.getUTCMonth()+6, ing.getUTCDate()));
    if(fin > hoy){ enPrueba.push(e); if(fin <= en30) pruebaVence.push({ e, fecha: fin, faltan: dias(hoy, fin) }); }
    const ant = LIQ.antiguedad(ing, hoy); sumaAnt += ant.anios + ant.meses/12; nAnt++;
    const prox = ant.anios + 1;
    const aniv = new Date(Date.UTC(ing.getUTCFullYear()+prox, ing.getUTCMonth(), ing.getUTCDate()));
    if([5,10,20].includes(prox) && aniv > hoy && aniv <= en30){
      const que = prox === 5 ? 'pasa a 2 meses de preaviso y 21 días de vacaciones' : prox === 10 ? 'pasa a 28 días de vacaciones' : 'pasa a 35 días de vacaciones';
      hitos.push({ e, fecha: aniv, anios: prox, que, faltan: dias(hoy, aniv) });
    }
  });
  pruebaVence.sort((a,b) => a.fecha - b.fecha);
  hitos.sort((a,b) => a.fecha - b.fecha);

  // Variables habituales (solo administrador)
  let habituales = [], porVolverse = [];
  if(varData && varData.items){
    varData.items.forEach(v => {
      const e = porLegajo[String(v.legajo).trim()];
      if(!e) return;                 // fuera del filtro de sede o dado de baja
      (v.estado === 'habitual' ? habituales : porVolverse).push({ e, ...v });
    });
    const orden = (a,b) => b.promedio - a.promedio;
    habituales.sort(orden); porVolverse.sort(orden);
  }

  // Topes desactualizados (solo administrador)
  const topesViejos = [];
  if(topes){
    const ult = {};
    topes.forEach(t => {
      const conv = String(t['Convenio']||'').trim(); const d = LIQ.parseFecha(t['Vigencia desde']); const m = LIQ.numero(t['Tope']);
      if(!conv || !d || !m) return;
      if(!ult[conv] || d > ult[conv].d) ult[conv] = { conv, d, m };
    });
    Object.values(ult).forEach(t => {
      const meses = (hoy.getUTCFullYear()-t.d.getUTCFullYear())*12 + hoy.getUTCMonth()-t.d.getUTCMonth();
      if(meses > 3) topesViejos.push({ ...t, meses });
    });
  }
  const personasHab = new Set(habituales.map(h => h.legajo)).size;
  const personasPorV = new Set(porVolverse.map(h => h.legajo)).size;
  return { emps, enPrueba, pruebaVence, hitos, habituales, porVolverse, personasHab, personasPorV, topesViejos,
           antProm: nAnt ? sumaAnt/nAnt : 0, meses: varData ? varData.meses : [] };
}

function liqBuscarEmpleado(txt){
  const t = String(txt||'').trim();
  if(!t) return null;
  const leg = t.split('—')[0].trim();
  let e = (employees||[]).find(x => String(x['Legajo']).trim() === leg);
  if(e) return e;
  const q = t.toLowerCase();
  const matches = (employees||[]).filter(x => String(x['Nombre']||'').toLowerCase().includes(q));
  return matches.length === 1 ? matches[0] : (matches.length ? { _varios: matches } : null);
}

function liqHistorico(emp){
  const anioAct = new Date().getFullYear();
  const filas = (liqCfg.neg||[]).map(n => ({
