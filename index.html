  setTimeout(()=>{
    // Evolution chart
    const allMeses = d.todosMeses||d.porMes;

    charts.ausmes = new Chart(document.getElementById('ch-aus-mes'),{

    // Motivo chart

function getActiveEmployees(){
  const bajasSet = new Set(bajas.map(b => b.legajo.toString().trim()));
  return employees.filter(e => !bajasSet.has((e['Legajo']||'').toString().trim()));
}

function countBy(arr,key){
  return arr.reduce((acc,e)=>{const v=e[key]||'Sin dato';acc[v]=(acc[v]||0)+1;return acc;},{});
}
function avg(arr){ return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0; }
function avInit(n){ try{ const clean=(n||'?').split(/[,\s]+/).filter(p=>p.length>1&&/^[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ]/.test(p)); return clean.slice(0,2).map(p=>p[0].toUpperCase()).join('')||'?'; }catch(e){ return '?'; } }
function avColor(n){ const c=['rgba(0,46,157,.25)','rgba(91,127,214,.25)','rgba(15,123,74,.2)','rgba(217,119,6,.2)','rgba(232,25,17,.2)']; return c[(n.charCodeAt(0)||0)%c.length]; }
function escHtml(s){ 
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function avSafe(n){ 
  try{ 
    const clean = String(n||'').replace(/<[^>]*>/g,'').trim();
    const parts = clean.split(/[,\s]+/).filter(p=>p.length>0&&/^[A-Za-záéíóúÁÉÍÓÚñÑ]/.test(p));
    const init = parts.slice(0,2).map(p=>p[0].toUpperCase()).join('');
    return init||'•';
  }catch(e){ return '•'; }
}
function safeName(n){
  return escHtml(String(n||'').replace(/<[^>]*>/g,'').trim());
}
function convPill(c){ return c==='Comercio'?'pb':c==='Camioneros'?'pw':c==='Fuera de Convenio'?'pgy':'pg'; }
function todayStr(){ return new Date().toISOString().split('T')[0]; }
function showToast(msg){ const t=document.getElementById('toast'); document.getElementById('tmsg').textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }

// ── PROCESSAR AUSENTISMO (carga manual) ──────────────────────────────────────
function procesarAusentismo(input){
  const file = input.files[0];
  if(!file) return;
  const mesVal = document.getElementById('aus-mes').value;
  const habiles = parseInt(document.getElementById('aus-habiles').value)||22;
  const [anio, mes] = mesVal.split('-').map(Number);
  const res = document.getElementById('res-aus');
  const mesLabel = new Date(anio, mes-1, 1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  res.innerHTML = `<div style="color:var(--mid);font-size:12px">Procesando ${file.name}...</div>`;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const text = e.target.result;
      const lines = text.split('\n').filter(l=>l.trim());
      const headers = lines[0].split(',').map(h=>h.trim().replace(/"/g,'').toLowerCase());
      const fIniIdx = headers.findIndex(h=>h.includes('inicio'));
      const fFinIdx = headers.findIndex(h=>h.includes('fin'));
      const motivoIdx = headers.findIndex(h=>h.includes('motivo'));
      const legIdx = headers.findIndex(h=>h.includes('legajo'));
      const excluir = ['ausencia justificada','perm. gremial'];
      let totalDias=0, totalEmps=new Set(), byMotivo={};
      lines.slice(1).forEach(line=>{
        const vals = line.split(',').map(v=>v.trim().replace(/"/g,''));
        const mot = (vals[motivoIdx]||'').trim();
        if(excluir.includes(mot.toLowerCase())) return;
        const fIni = new Date(vals[fIniIdx]);
        const fFin = new Date(vals[fFinIdx]);
        if(isNaN(fIni)||isNaN(fFin)) return;
        const mesInicio = new Date(anio, mes-1, 1);
        const mesFin = new Date(anio, mes, 1);
        const inicio = new Date(Math.max(fIni, mesInicio));
        const fin = new Date(Math.min(new Date(fFin.getFullYear(), fFin.getMonth(), fFin.getDate()+1), mesFin));
        const dias = Math.max(Math.round((fin-inicio)/(1000*60*60*24)),0);
        if(dias <= 0) return;
        totalDias += dias;
        totalEmps.add(vals[legIdx]||'');
        byMotivo[mot] = (byMotivo[mot]||0) + dias;
      });
      const tasa = ((totalDias/(employees.length||794)/habiles)*100).toFixed(2);
      res.innerHTML = `
        <div class="alert ag">Ausentismo de ${mesLabel} procesado</div>
        <div class="kgrid" style="margin-top:12px;grid-template-columns:repeat(4,1fr)">
          <div class="kcard ka"><div class="klbl">Días ausentes</div><div class="kval" style="font-size:20px">${totalDias}</div></div>
          <div class="kcard kd"><div class="klbl">Tasa</div><div class="kval" style="font-size:20px">${tasa}%</div></div>
          <div class="kcard kw"><div class="klbl">Empleados</div><div class="kval" style="font-size:20px">${totalEmps.size}</div></div>
          <div class="kcard kb"><div class="klbl">Días hábiles</div><div class="kval" style="font-size:20px">${habiles}</div></div>
        </div>
        <div style="margin-top:12px">${Object.entries(byMotivo).sort((a,b)=>b[1]-a[1]).map(([m,d])=>`
          <div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--border)">
            <span>${m}</span><span style="font-weight:700;color:var(--a)">${d} días</span>
          </div>`).join('')}
        </div>
        <p style="font-size:11px;color:var(--dim);margin-top:10px">Pegá las filas en la hoja "Ausentismo" de Google Sheets con la columna Mes = ${mesVal}</p>`;
    } catch(err){ res.innerHTML=`<div class="alert ad">Error: ${err.message}</div>`; }
  };
  reader.readAsText(file,'UTF-8');
}

function procesarAltas(input){
  const file = input.files[0];
  if(!file) return;
  const res = document.getElementById('res-altas');
  res.innerHTML = `<div style="color:var(--mid);font-size:12px">Procesando ${file.name}...</div>`;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const text = e.target.result;
      const lines = text.split('\n').filter(l=>l.trim());
      if(lines.length < 2){ res.innerHTML=`<div class="alert ad">Archivo vacío</div>`; return; }
      const headers = lines[0].split(',').map(h=>h.trim().replace(/"/g,'').toLowerCase());
      const legajoIdx = headers.findIndex(h=>h.includes('legajo'));
      if(legajoIdx === -1){ res.innerHTML=`<div class="alert ad">No se encontró columna Legajo</div>`; return; }
      const nuevos = [], duplicados = [];
      const legajosActuales = new Set(employees.map(e=>(e['Legajo']||'').toString().trim()));
      lines.slice(1).forEach(line=>{
        const vals = line.split(',').map(v=>v.trim().replace(/"/g,''));
        const leg = vals[legajoIdx];
        if(!leg) return;
        if(legajosActuales.has(leg)){ duplicados.push(leg); }
        else {
          const emp = {};
          headers.forEach((h,i)=>{ emp[h]=vals[i]||''; });
          emp['Legajo'] = leg; emp['Estado'] = 'Activo';
          nuevos.push(emp);
        }
      });
      if(nuevos.length > 0){
        employees.push(...nuevos);
        res.innerHTML=`
          <div class="alert ag">${nuevos.length} empleado(s) agregado(s)</div>
          ${duplicados.length>0?`<div class="alert aw">${duplicados.length} legajos ya existían</div>`:''}

}

  const found = getActiveEmployees().filter(e=>
    (e['Nombre']||e['Nombe']||'').toLowerCase().includes(q.toLowerCase()) ||

let licenciasRaw = null;

function procesarLicenciasRaw(raw, legajosFilter){
  // Normalizar legajosFilter eliminando ceros y espacios
  let legNormSet = null;
  if(legajosFilter){
    legNormSet = new Set([...legajosFilter].map(l => String(parseInt(l.trim())||l.trim())));
  }
  const porEmp={}, porMotivo={}, porAnio={};
  let totalRegistros=0, totalDias=0;
  raw.forEach(r=>{
    const leg=String(r['legajo']||r['Legajo']||'').trim();
    if(!leg) return;
    // Filtro por legajos si aplica — normaliza espacios y ceros
    if(legNormSet){
      const legNorm = String(parseInt(leg)||leg);
      if(!legNormSet.has(leg) && !legNormSet.has(legNorm)) return;
    }
    const nom=String(r['nombre']||r['Nombre']||'').replace(/<[^>]*>/g,'').trim().replace(/[\n\r\t]/g,' ').substring(0,60);
    const dias=parseInt(r['dias']||r['Dias']||0)||0;
    const mot=String(r['motivo']||r['Motivo']||'Sin dato').trim();
    const fechaStr=r['fecha inicio']||r['Fecha Inicio']||'';
    const anio=fechaStr?(parseFecha(fechaStr)?.getFullYear()||0):0;
    const obs=String(r['Observacion']||r['observacion']||'').trim().slice(0,100);
    totalRegistros++; totalDias+=dias;
    porMotivo[mot]=(porMotivo[mot]||0)+dias;
    if(anio>2010) porAnio[anio]=(porAnio[anio]||0)+dias;
    if(!porEmp[leg]) porEmp[leg]={legajo:leg,nombre:nom,totalDias:0,totalEventos:0,motivos:{},ultimos:[]};
    porEmp[leg].totalDias+=dias; porEmp[leg].totalEventos++;
    porEmp[leg].motivos[mot]=(porEmp[leg].motivos[mot]||0)+dias;
    porEmp[leg].ultimos.push({fecha:fechaStr,dias,motivo:mot,obs});
  });
  Object.values(porEmp).forEach(e => {
    e.ultimos.sort((a,b) => (parseFecha(b.fecha)||0) - (parseFecha(a.fecha)||0));
  });
  return {
    empleados:Object.values(porEmp),
    porMotivo:Object.entries(porMotivo).sort((a,b)=>b[1]-a[1]).map(([motivo,dias])=>({motivo,dias})),
    porAnio:Object.entries(porAnio).sort((a,b)=>a[0]-b[0]).map(([anio,dias])=>({anio:parseInt(anio),dias})),
    totalRegistros, totalDias, totalEmpleados:Object.keys(porEmp).length
  };
}

async function loadLicencias(){
  if(licenciasLoaded && licenciasRaw) return;
  try {
    const res = await hojaResp("Licencias");
    if(res.ok){
      const raw = await res.json();
      if(raw && raw.length > 0){
        licenciasRaw = raw;
        licencias = procesarLicenciasRaw(raw, null);
        licenciasLoaded=true;
        console.log("✅ Licencias en vivo:", licencias.totalRegistros, "registros");
        return;
      }
    }
  } catch(e){ console.warn("loadLicencias failed:", e.message); }
  licenciasRaw=[];
  licencias=procesarLicenciasRaw([], null);
  licenciasLoaded=false;
}

async function loadSueldos(){
  if(sueldosLoaded && sueldos.length > 0) return;
  // Try Apps Script
  try {
    const res = await hojaResp("Sueldos");
    if(res.ok){
      const data = await res.json();
      if(data && data.length > 0){
        sueldos = data.map(r => {
          const obj = {};
          Object.keys(r).forEach(k => obj[k] = String(r[k]||''));
          return obj;
        });
        sueldosLoaded = true;
        console.log("✅ Sueldos via Apps Script:", sueldos.length);
        return;
      }
    }
  } catch(e){ console.warn("Sueldos Apps Script failed:", e.message); }
  sueldos = [];
  sueldosLoaded = true;
}

function normalizeMesSueldos(val){
  if(!val) return '';
  const s = String(val).trim();
  if(s.match(/^\d{4}-\d{2}$/)) return s;
  const m = s.match(/(\d{4})-(\d{2})/);
  return m ? m[1]+'-'+m[2] : '';
}

function getSector(legajo){
  const emp = employees.find(e => String(e['Legajo']||'').trim() === String(legajo).trim());
  return emp ? (emp['Sector']||'Sin sector') : 'Sin sector';
}

  'DIA X MUDANZA','DIA DE EXAMEN','DIAS ACC. A CARGO EMPRESA','SAC S/ ACCIDENTE ART',
  'DIAS ACC. A CARGO A.R.T.'
];
const DESCUENTOS = [
  'JUBILACION','LEY 19.032','OBRA SOCIAL','DESC. FALLO DE CAJA','HORAS A DESCONTAR',
  'DESC. ANTICIPO  F.','CONT. SOLIDARIA','SIND. AF. VOLUNT.','DESC. VACACIONES',
  'DIAS NO TRABAJADOS','CUOTA  ASOCIACION MUTUAL','FALTANTE DE CAJA','AUSENCIAS',
  'RETEN. CUOTA  ALIMENTARIA','RETENCION GANANCIAS','DESC. ANTICIPOS','S.E.C. 2%',
  'FAECYS 0.5%','CONTRIB. SINDICATO','SUSPENSIONES','DESC ANTICIPO','RET. EMBARGO HAB.',
  'IMP. A LAS GANANCIAS (Año Ant)','APORTE SOLIDARIO','CTA. SINDICAL VIAJ.',
  'SEGURO DE VIDA','SEGURO DE SEPELIO','RETENC. CUOTA ALIMENTARIA',
  'RET. EMBARGO HAB.','DESC ANTICIPO  Ct.:2 de 3','DESC ANTICIPO  Ct.:1 de 2',
  'DESC. ANTICIPOS  Ct.:3 de 3'
];

// ─── SUELDOS: estado de sede/mes ─────────────────────────────
let _sedeSueldos = 'ambas';
let _mesActualSueldos = '';

function normSede(val){
  const s = String(val||'').trim().toLowerCase();
  if(s.includes('moreno')) return 'moreno';
  if(s.includes('plata')) return 'la plata';
  return 'sin sede';
}

function sedeLabel(s){
  return s === 'la plata' ? 'La Plata' : s === 'moreno' ? 'Moreno' : s === 'ambas' ? 'Ambas sedes' : 'Sin sede asignada';
}

async function sueldosTab(el){
  el.innerHTML = `<div class="sec active">
    <div class="sh"><div><h2>Sueldos</h2><p>Cargando datos...</p></div></div>
    <div style="display:flex;align-items:center;justify-content:center;padding:60px;gap:16px">
      <div class="spinner"></div><span style="color:var(--mid)">Cargando sueldos...</span>
    </div></div>`;

  await loadSueldos();

  if(!sueldos.length){
    el.innerHTML = `<div class="sec active">
      <div class="sh"><div><h2>Sueldos</h2></div></div>
      <div class="alert ad">No se pudieron cargar los datos de sueldos.</div>
    </div>`;
    return;
  }

  // Admin arranca con la sede elegida en el sidebar; el resto con "ambas"
  _sedeSueldos = (role === 'admin') ? adminSucursal : 'ambas';

  const mesesMap = {};
  sueldos.forEach(r => {
    const mes = normalizeMesSueldos(r['Mes']||r['mes']||'');
    if(mes) mesesMap[mes] = true;
  });
  const mesesDisp = Object.keys(mesesMap).sort();
  const mesActual = mesesDisp[mesesDisp.length - 1];
  const mesPrevio = mesesDisp.length > 1 ? mesesDisp[mesesDisp.length - 2] : null;

  renderSueldosMes(el, mesActual, mesesDisp, mesPrevio);
}

function renderSueldosMes(el, mesKey, mesesDisp, mesPrevio){
  _mesActualSueldos = mesKey;
  _mesesSueldos = mesesDisp;
  _mesPrevioSueldos = mesPrevio || '';

  const mesData = sueldos.filter(r => normalizeMesSueldos(r['Mes']||r['mes']||'') === mesKey);
  const mesLabel = mesKey ? (()=>{ const [a,m]=mesKey.split('-').map(Number); return new Date(a,m-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'}); })() : '';

  // Mapa de nómina por legajo (una sola pasada)
  const empMap = {};
  employees.forEach(e => { empMap[String(e['Legajo']||'').trim()] = e; });

  // Enriquecer con sector, convenio y sede
  const enrichedAll = mesData.map(r => {
    const leg = String(r['Legajo']||r['legajo']||'').trim();
    const emp = empMap[leg];
    const sedeRaw = r['Sede'] || r['sede'] || r['Ubicación'] || r['Ubicacion'] ||
                    (emp ? (emp['Ubicación'] || emp['Ubicacion'] || '') : '');
    return {
      ...r,
      legajo: leg,
      nombre: String(r['Nombre'] || r['nombre'] || (emp ? emp['Nombre'] : '') || ''),
      sector: emp ? (emp['Sector'] || 'Sin sector') : 'Sin sector',
      convenio: emp ? (emp['Convenio'] || 'Sin convenio') : 'Sin convenio',
      sede: normSede(sedeRaw),
      monto: parseFloat(String(r['Monto']||r['monto']||'0').replace(',','.')) || 0,
      novedad: String(r['Novedad']||r['novedad']||'').trim().toUpperCase(),
    };
  });

  // Clasificadores
  const isAporte  = r => APORTES_PATRONALES.some(a => r.novedad.includes(a));
  const isExtra   = r => HORAS_EXTRAS.some(a => r.novedad === a);
  const isFeriado = r => FERIADOS.some(a => r.novedad === a);
  const isDomingo = r => DOMINGOS.some(a => r.novedad === a);
  const isLicPaga = r => LICENCIAS_PAGAS.some(a => r.novedad === a);
  const isDesc    = r => DESCUENTOS.some(a => r.novedad.includes(a));

  const resumen = rows => {
    const sum = f => rows.filter(f).reduce((a,r)=>a+r.monto, 0);
    const masa     = sum(r => !isAporte(r) && !isDesc(r) && r.monto > 0);
    const aportes  = sum(isAporte);
    const extras   = sum(isExtra);
    const feriados = sum(isFeriado);
    const domingos = sum(isDomingo);
    const licPagas = sum(isLicPaga);
    const emps     = new Set(rows.map(r=>r.legajo).filter(Boolean)).size;
    const costo    = masa + aportes;
    const adic     = extras + feriados + domingos;
    return { masa, aportes, extras, feriados, domingos, licPagas, emps, costo, adic, prom: emps ? costo/emps : 0 };
  };

  const fmt = n => '$' + Math.round(n||0).toLocaleString('es-AR');
  const pct = (a,b,dec=1) => b ? ((a/b)*100).toFixed(dec) + '%' : '-';

  // Resumen por sede (siempre sobre el total del mes)
  const sedesPresentes = ['la plata','moreno'];
  const sinSedeRows = enrichedAll.filter(r => r.sede === 'sin sede');
  if(sinSedeRows.length) sedesPresentes.push('sin sede');
  const resSede = {};
  sedesPresentes.forEach(s => { resSede[s] = resumen(enrichedAll.filter(r => r.sede === s)); });
  const resTotal = resumen(enrichedAll);

  // Filas del detalle según sede elegida
  const enriched = _sedeSueldos === 'ambas' ? enrichedAll : enrichedAll.filter(r => r.sede === _sedeSueldos);
  const R = resumen(enriched);

  // Por convenio (sede filtrada)
  const convenios = [...new Set(enriched.map(r=>r.convenio))].filter(Boolean);
  const porConvenio = convenios.map(conv => ({ convenio: conv, ...resumen(enriched.filter(r=>r.convenio===conv)) }))
                               .sort((a,b)=>b.masa-a.masa);

  // Adicionales por sector (sede filtrada)
  const extrasPorSector = {};
  enriched.filter(r => isExtra(r)||isFeriado(r)||isDomingo(r)).forEach(r => {
    extrasPorSector[r.sector] = (extrasPorSector[r.sector]||0) + r.monto;
  });
  const extSectorSort = Object.entries(extrasPorSector).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // Top adicionales por empleado (sede filtrada)
  const extrasPorEmp = {};
  enriched.filter(r=>isExtra(r)||isFeriado(r)||isDomingo(r)).forEach(r=>{
    const leg = r.legajo;
    if(!extrasPorEmp[leg]) extrasPorEmp[leg] = {legajo:leg, nombre:r.nombre, sector:r.sector, convenio:r.convenio, sede:r.sede, extras:0, feriados:0, domingos:0, total:0};
    if(isExtra(r))   extrasPorEmp[leg].extras   += r.monto;
    if(isFeriado(r)) extrasPorEmp[leg].feriados += r.monto;
    if(isDomingo(r)) extrasPorEmp[leg].domingos += r.monto;
    extrasPorEmp[leg].total += r.monto;
  });
  const topExtras = Object.values(extrasPorEmp).sort((a,b)=>b.total-a.total).slice(0,10);

  const mini = (label, val, color) => `
    <div style="background:var(--surface2);border-radius:8px;padding:8px 10px">
      <div style="font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px">${label}</div>
      <div style="font-size:13px;font-weight:700;${color?'color:'+color:''}">${val}</div>
    </div>`;

  const sedeTit = _sedeSueldos === 'ambas' ? '' : ' · ' + sedeLabel(_sedeSueldos);

  el.innerHTML = `<div class="sec active">
  <div class="sh">
    <div><h2>Sueldos · ${mesLabel}${sedeTit}</h2><p>Análisis de costos laborales para Dirección</p></div>
    <button class="btn bts" onclick="sueldosLoaded=false;sueldosTab(document.getElementById('content'))">↻ Actualizar</button>
  </div>

  <!-- SELECTOR DE MES -->
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
    <span style="font-size:12px;color:var(--dim);width:48px">Mes:</span>
    ${mesesDisp.map(m=>{
      const [ma,mm]=m.split('-').map(Number);
      const lbl = new Date(ma,mm-1,1).toLocaleDateString('es-AR',{month:'short',year:'numeric'});
      return `<button onclick="cambiarMesSueldos('${m}')" class="btn ${m===mesKey?'btp':'bts'}" style="font-size:11px;padding:5px 12px">${lbl}</button>`;
    }).join('')}
  </div>

  <!-- SELECTOR DE SEDE -->
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <span style="font-size:12px;color:var(--dim);width:48px">Sede:</span>
    ${[['ambas','Ambas'],['la plata','La Plata'],['moreno','Moreno']].map(([k,l])=>
      `<button onclick="cambiarSedeSueldos('${k}')" class="btn ${k===_sedeSueldos?'btp':'bts'}" style="font-size:11px;padding:5px 12px">${l}</button>`
    ).join('')}
  </div>

  ${sinSedeRows.length ? `<div class="alert aw">${resSede['sin sede'].emps} legajo(s) de sueldos no se encontraron en la Nómina (posibles bajas), así que no se les pudo asignar sede. Suman ${fmt(resSede['sin sede'].costo)}.</div>` : ''}

  <!-- COMPARATIVA POR SEDE -->
  <div style="font-family:Poppins,sans-serif;font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin:4px 0 10px">Comparativa por sede</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px">
    ${sedesPresentes.map(s=>{
      const x = resSede[s];
      const sel = _sedeSueldos === s;
      const clickable = s !== 'sin sede';
      return `<div class="cc" ${clickable?`onclick="cambiarSedeSueldos('${s}')"`:''} style="${clickable?'cursor:pointer;':''}${sel?'border-color:var(--a);box-shadow:0 0 0 1px var(--a);':''}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div class="ct">${sedeLabel(s)}</div>
          <span class="pill ${s==='sin sede'?'pw':'pb'}">${pct(x.costo, resTotal.costo)} del costo</span>
        </div>
        <div style="font-family:Poppins,sans-serif;font-size:22px;font-weight:800;color:var(--a)">${fmt(x.costo)}</div>
        <div class="cs">Costo total empresa (bruto + aportes)</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          ${mini('Empleados', x.emps)}
          ${mini('Costo prom.', fmt(x.prom))}
          ${mini('Masa bruta', fmt(x.masa))}
          ${mini('Aportes', fmt(x.aportes), 'var(--w)')}
          ${mini('Adicionales', fmt(x.adic), 'var(--d)')}
          ${mini('% adic./masa', pct(x.adic, x.masa))}
        </div>
      </div>`;
    }).join('')}
  </div>

  <div class="cgrid">
    <div class="tcard" style="margin-bottom:0">
      <div class="thead"><h3>Detalle por Sede</h3><span class="pill pb">${mesLabel}</span></div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Sede</th><th>Emp.</th><th>Masa Bruta</th><th>Aportes</th><th>Costo Total</th><th>% Costo</th><th>Costo Prom.</th><th>H. Extra</th><th>Feriados</th><th>Domingos</th><th>Lic. Pagas</th></tr></thead>
        <tbody>
          ${sedesPresentes.map(s=>{ const x=resSede[s]; return `<tr style="${_sedeSueldos===s?'background:rgba(0,46,157,.06)':''}">
            <td><strong>${sedeLabel(s)}</strong></td>
            <td style="color:var(--mid)">${x.emps}</td>
            <td>${fmt(x.masa)}</td>
            <td style="color:var(--w)">${fmt(x.aportes)}</td>
            <td style="font-weight:700;color:var(--a)">${fmt(x.costo)}</td>
            <td>${pct(x.costo, resTotal.costo)}</td>
            <td>${fmt(x.prom)}</td>
            <td style="color:${x.extras>0?'var(--d)':'var(--dim)'}">${x.extras>0?fmt(x.extras):'-'}</td>
            <td style="color:${x.feriados>0?'var(--w)':'var(--dim)'}">${x.feriados>0?fmt(x.feriados):'-'}</td>
            <td style="color:${x.domingos>0?'var(--a)':'var(--dim)'}">${x.domingos>0?fmt(x.domingos):'-'}</td>
            <td style="color:var(--mid)">${x.licPagas>0?fmt(x.licPagas):'-'}</td>
          </tr>`; }).join('')}
          <tr style="background:rgba(0,46,157,.1);font-weight:700">
            <td>TOTAL EMPRESA</td>
            <td>${resTotal.emps}</td>
            <td>${fmt(resTotal.masa)}</td>
            <td style="color:var(--w)">${fmt(resTotal.aportes)}</td>
            <td style="color:var(--a)">${fmt(resTotal.costo)}</td>
            <td>100%</td>
            <td>${fmt(resTotal.prom)}</td>
            <td style="color:var(--d)">${fmt(resTotal.extras)}</td>
            <td style="color:var(--w)">${fmt(resTotal.feriados)}</td>
            <td>${fmt(resTotal.domingos)}</td>
            <td>${fmt(resTotal.licPagas)}</td>
          </tr>
        </tbody>
      </table></div>
    </div>
    <div class="cc">
      <div class="ct">Composición del Costo por Sede</div>
      <div class="cs">Masa base · Adicionales · Aportes patronales</div>
      <canvas id="ch-sede-comp"></canvas>
    </div>
  </div>

  <!-- KPIs PRINCIPALES (sede filtrada) -->
  <div style="font-family:Poppins,sans-serif;font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin:20px 0 10px">Indicadores · ${sedeLabel(_sedeSueldos)}</div>
  <div class="kgrid">
    <div class="kcard ka"><div class="klbl">Costo Total Empresa</div><div class="kval" style="font-size:18px">${fmt(R.costo)}</div><span class="kchg cne">Bruto + Aportes</span></div>
    <div class="kcard kb"><div class="klbl">Masa Salarial Bruta</div><div class="kval" style="font-size:18px">${fmt(R.masa)}</div><span class="kchg cne">${R.emps} empleados</span></div>
    <div class="kcard kw"><div class="klbl">Aportes Patronales</div><div class="kval" style="font-size:18px">${fmt(R.aportes)}</div><span class="kchg cne">${pct(R.aportes, R.costo)} del costo</span></div>
    <div class="kcard kc"><div class="klbl">Costo Prom./Empleado</div><div class="kval" style="font-size:18px">${fmt(R.prom)}</div></div>
  </div>

  <div style="font-family:Poppins,sans-serif;font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin:16px 0 10px">Conceptos adicionales</div>
  <div class="kgrid">
    <div class="kcard kd"><div class="klbl">Horas Extra</div><div class="kval" style="font-size:18px">${fmt(R.extras)}</div><span class="kchg cdo">${pct(R.extras, R.masa)} de la masa</span></div>
    <div class="kcard kw"><div class="klbl">Feriados Trabajados</div><div class="kval" style="font-size:18px">${fmt(R.feriados)}</div><span class="kchg cne">${pct(R.feriados, R.masa, 2)} de la masa</span></div>
    <div class="kcard kb"><div class="klbl">Domingos Trabajados</div><div class="kval" style="font-size:18px">${fmt(R.domingos)}</div><span class="kchg cne">${pct(R.domingos, R.masa, 2)} de la masa</span></div>
    <div class="kcard kc"><div class="klbl">Licencias Pagas</div><div class="kval" style="font-size:18px">${fmt(R.licPagas)}</div><span class="kchg cne">${pct(R.licPagas, R.masa, 2)} de la masa</span></div>
    <div class="kcard kb"><div class="klbl">Total Adicionales</div><div class="kval" style="font-size:18px">${fmt(R.adic)}</div><span class="kchg cdo">${pct(R.adic, R.masa)} de la masa</span></div>
  </div>

  <!-- POR CONVENIO -->
  <div class="tcard" style="margin-top:20px">
    <div class="thead"><h3>Costo por Convenio · ${sedeLabel(_sedeSueldos)}</h3><span class="pill pb">${mesLabel}</span></div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Convenio</th><th>Empleados</th><th>Masa Bruta</th><th>Aportes</th><th>Costo Total</th><th>Horas Extra</th><th>Feriados</th><th>Domingos</th><th>Lic. Pagas</th></tr></thead>
      <tbody>
        ${porConvenio.map(c=>`<tr>
          <td><strong>${c.convenio}</strong></td>
          <td style="color:var(--mid)">${c.emps}</td>
          <td style="font-weight:600">${fmt(c.masa)}</td>
          <td style="color:var(--w)">${fmt(c.aportes)}</td>
          <td style="font-weight:700;color:var(--a)">${fmt(c.costo)}</td>
          <td style="color:${c.extras>0?'var(--d)':'var(--dim)'}">${c.extras>0?fmt(c.extras):'-'}</td>
          <td style="color:${c.feriados>0?'var(--w)':'var(--dim)'}">${c.feriados>0?fmt(c.feriados):'-'}</td>
          <td style="color:${c.domingos>0?'var(--b)':'var(--dim)'}">${c.domingos>0?fmt(c.domingos):'-'}</td>
          <td style="color:var(--mid)">${c.licPagas>0?fmt(c.licPagas):'-'}</td>
        </tr>`).join('')}
        <tr style="background:rgba(0,46,157,.06);font-weight:700">
          <td>TOTAL</td>
          <td>${R.emps}</td>
          <td>${fmt(R.masa)}</td>
          <td style="color:var(--w)">${fmt(R.aportes)}</td>
          <td style="color:var(--a)">${fmt(R.costo)}</td>
          <td style="color:var(--d)">${fmt(R.extras)}</td>
          <td style="color:var(--w)">${fmt(R.feriados)}</td>
          <td>${fmt(R.domingos)}</td>
          <td>${fmt(R.licPagas)}</td>
        </tr>
      </tbody>
    </table></div>
  </div>

  <!-- GRAFICAS -->
  <div class="cgrid">
    <div class="cc">
      <div class="ct">Adicionales por Tipo</div>
      <div class="cs">${sedeLabel(_sedeSueldos)} · extras, feriados, domingos y licencias</div>
      <canvas id="ch-adic-tipo"></canvas>
    </div>
    <div class="cc">
      <div class="ct">Adicionales por Sector</div>
      <div class="cs">${sedeLabel(_sedeSueldos)} · top 8 — extras + feriados + domingos</div>
      <canvas id="ch-ext-sect"></canvas>
    </div>
  </div>

  <!-- TOP EXTRAS POR EMPLEADO -->
  <div class="tcard">
    <div class="thead"><h3>Top 10 — Adicionales por Empleado · ${sedeLabel(_sedeSueldos)}</h3><span class="pill pd">Extras + Feriados + Domingos</span></div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>#</th><th>Empleado</th><th>Sede</th><th>Sector</th><th>Convenio</th><th>Horas Extra</th><th>Feriados</th><th>Domingos</th><th>Total</th></tr></thead>
      <tbody>
        ${topExtras.length ? topExtras.map((e,i)=>`<tr>
          <td style="color:var(--dim);font-weight:700">${i+1}</td>
          <td><div style="display:flex;align-items:center;gap:8px">
            <div class="av notranslate" translate="no" style="background:${avColor(e.nombre||'?')};flex-shrink:0">${avSafe(e.nombre)}</div>
            <strong style="font-size:12px">${safeName(e.nombre)}</strong></div></td>
          <td style="font-size:11px">${sedeLabel(e.sede)}</td>
          <td><span class="pill pgy" style="font-size:10px">${e.sector}</span></td>
          <td style="font-size:11px;color:var(--mid)">${e.convenio}</td>
          <td style="color:${e.extras>0?'var(--d)':'var(--dim)'}">${e.extras>0?fmt(e.extras):'-'}</td>
          <td style="color:${e.feriados>0?'var(--w)':'var(--dim)'}">${e.feriados>0?fmt(e.feriados):'-'}</td>
          <td style="color:${e.domingos>0?'var(--a)':'var(--dim)'}">${e.domingos>0?fmt(e.domingos):'-'}</td>
          <td style="font-weight:700;color:var(--c)">${fmt(e.total)}</td>
        </tr>`).join('') : `<tr><td colspan="9" style="text-align:center;color:var(--dim);padding:20px">Sin adicionales en ${sedeLabel(_sedeSueldos)} para este mes</td></tr>`}
      </tbody>
    </table></div>
  </div>

  </div>`;

  setTimeout(()=>{
    // Composición por sede (apilado)
    charts.sedecomp = new Chart(document.getElementById('ch-sede-comp'),{
      type:'bar',
      data:{
        labels: sedesPresentes.map(sedeLabel),
        datasets:[
          {label:'Masa base',   data: sedesPresentes.map(s=>resSede[s].masa - resSede[s].adic), backgroundColor:'rgba(0,46,157,.75)', borderRadius:4, borderSkipped:false},
          {label:'Adicionales', data: sedesPresentes.map(s=>resSede[s].adic),                   backgroundColor:'rgba(232,25,17,.75)',  borderRadius:4, borderSkipped:false},
          {label:'Aportes',     data: sedesPresentes.map(s=>resSede[s].aportes),                backgroundColor:'rgba(217,119,6,.75)', borderRadius:4, borderSkipped:false},
        ]
      },
      options:{
        plugins:{
          legend:{labels:{color:'#4B5563',font:{size:11}}},
          tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': $'+Math.round(ctx.raw).toLocaleString('es-AR')}}
        },
        scales:{
          x:{stacked:true, ticks:{color:'#5B6474'}, grid:{display:false}},
          y:{stacked:true, ticks:{color:'#5B6474', callback:v=>'$'+Math.round(v/1000000)+'M'}, grid:{color:'#E3E8F2'}}
        }
      }
    });

    // Adicionales por tipo
    charts.adictipo = new Chart(document.getElementById('ch-adic-tipo'),{
      type:'doughnut',
      data:{
        labels:['Horas Extra','Feriados','Domingos','Licencias Pagas'],
        datasets:[{ data:[R.extras,R.feriados,R.domingos,R.licPagas], backgroundColor:['#E81911','#D97706','#002E9D','#0F7B4A'], borderWidth:0, hoverOffset:5 }]
      },
      options:{plugins:{legend:{labels:{color:'#4B5563',font:{size:11}}}},cutout:'55%'}
    });

    // Adicionales por sector
    charts.extsect = new Chart(document.getElementById('ch-ext-sect'),{
      type:'bar',
      data:{labels:extSectorSort.map(e=>e[0]),datasets:[{
        data:extSectorSort.map(e=>e[1]), backgroundColor:'rgba(217,119,6,.75)', borderRadius:5, borderSkipped:false
      }]},
      options:{indexAxis:'y',plugins:{legend:{display:false},
        tooltip:{callbacks:{label:ctx=>'$'+Math.round(ctx.raw).toLocaleString('es-AR')}}},
        scales:{
          x:{ticks:{color:'#5B6474',callback:v=>'$'+Math.round(v/1000000)+'M'},grid:{color:'#E3E8F2'}},
          y:{ticks:{color:'#5B6474',font:{size:10}},grid:{display:false}}
        }}
    });
  },50);
}

async function loadAcademia(){
  if(academiaLoaded) return;

let negData = null;
let negFiltered = null;

async function negociacionesTab(el){
  el.innerHTML = `<div class="sec active">
    <div class="sh"><div><h2>Negociaciones</h2><p>Cargando datos históricos...</p></div></div>
    <div style="display:flex;align-items:center;justify-content:center;padding:60px;gap:16px">

    </div></div>`;

  try {
    const res = await hojaResp("Negociaciones");
    const raw = await res.json();
    negData = raw.map(r => ({
      legajo: String(r['Legajo']||'').trim(),
      nombre: r['Nombre']||'',
      fecha: r['Fecha Baja']||'',
      año: parseInt(r['Año'])||0,
      forma: r['Forma Extincion']||'',
      sector: r['Sector']||'',
      sede: r['Sede']||'',

      montoUSD: parseFloat(r['Monto Negociado USD'])||0,
      indemUSD: parseFloat(r['Indem Ley USD'])||0,
      ahorroUSD: parseFloat(r['Ahorro USD'])||0,

      <button class="btn bts" style="margin-top:16px" onclick="negociacionesTab(document.getElementById('content'))">↻ Reintentar</button>
      </div></div>`;
  }
}

function renderNegociaciones(el){
  const d = negFiltered;

  // KPIs generales
  const total = d.length;
  const ahorroUSD = d.reduce((s,r) => s + r.ahorroUSD, 0);
  const ahorroARS = d.reduce((s,r) => s + r.ahorroARS, 0);
  const montoUSD = d.reduce((s,r) => s + r.montoUSD, 0);
  const indemUSD = d.reduce((s,r) => s + r.indemUSD, 0);
  const pctProm = total > 0 ? d.reduce((s,r) => s + r.pctPagado, 0) / total : 0;
  const pctAhorro = indemUSD > 0 ? ((1 - montoUSD / indemUSD) * 100) : 0;

  // Opciones filtros
  const años = [...new Set(negData.map(r=>r.año))].sort((a,b)=>b-a);
  const sectores = [...new Set(negData.map(r=>r.sector))].sort();
  const sedes = [...new Set(negData.map(r=>r.sede))].sort();
  const motivos = [...new Set(negData.map(r=>r.motivo))].sort();

  // Resumen por año
  const porAño = {};
  d.forEach(r => {
    if(!porAño[r.año]) porAño[r.año] = {cant:0, ahorroUSD:0, montoUSD:0, indemUSD:0};
    porAño[r.año].cant++;
    porAño[r.año].ahorroUSD += r.ahorroUSD;
    porAño[r.año].montoUSD += r.montoUSD;
    porAño[r.año].indemUSD += r.indemUSD;
  });

  // Resumen por motivo
  const porMotivo = {};
  d.forEach(r => {
    if(!porMotivo[r.motivo]) porMotivo[r.motivo] = {cant:0, ahorroUSD:0};
    porMotivo[r.motivo].cant++;
    porMotivo[r.motivo].ahorroUSD += r.ahorroUSD;
  });
  const motivoArr = Object.entries(porMotivo).sort((a,b) => b[1].cant - a[1].cant);

  // Resumen por sector (top 10)
  const porSector = {};
  d.forEach(r => {
    if(!porSector[r.sector]) porSector[r.sector] = {cant:0, ahorroUSD:0};
    porSector[r.sector].cant++;
    porSector[r.sector].ahorroUSD += r.ahorroUSD;
  });
  const sectorArr = Object.entries(porSector).sort((a,b) => b[1].cant - a[1].cant).slice(0,10);

  const fmtUSD = (v) => v >= 1000000 ? (v/1000000).toFixed(2)+'M' : v >= 1000 ? (v/1000).toFixed(1)+'K' : v.toFixed(0);
  const fmtARS = (v) => v >= 1000000000 ? (v/1000000000).toFixed(1)+'B' : v >= 1000000 ? (v/1000000).toFixed(1)+'M' : v >= 1000 ? (v/1000).toFixed(0)+'K' : v.toFixed(0);

  el.innerHTML = `<div class="sec active">
    <div class="sh">
      <div>
        <h2>Negociaciones</h2>
        <p>Historial de bajas negociadas · ${total} registros</p>
      </div>
      <button class="btn bts" onclick="negociacionesTab(document.getElementById('content'))">↻ Actualizar</button>
    </div>

    <!-- FILTROS -->
    <div style="display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;align-items:center">
      <div style="display:flex;gap:6px;align-items:center">
        <span style="font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase">Año</span>
        <select id="neg-año" class="sel" onchange="negFiltrar()">
          <option value="">Todos</option>
          ${años.map(a=>`<option value="${a}">${a}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <span style="font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase">Sector</span>
        <select id="neg-sector" class="sel" onchange="negFiltrar()">
          <option value="">Todos</option>
          ${sectores.map(s=>`<option value="${s}">${s}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <span style="font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase">Sede</span>
        <select id="neg-sede" class="sel" onchange="negFiltrar()">
          <option value="">Todas</option>
          ${sedes.map(s=>`<option value="${s}">${s}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <span style="font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase">Motivo</span>
        <select id="neg-motivo" class="sel" onchange="negFiltrar()">
          <option value="">Todos</option>
          ${motivos.map(m=>`<option value="${m}">${m}</option>`).join('')}
        </select>
      </div>
    </div>

    <!-- KPIs -->
    <div class="kgrid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
      <div class="kcard"><div class="klbl">Total negociaciones</div><div class="kval">${total}</div></div>
      <div class="kcard"><div class="klbl">Ahorro total USD</div><div class="kval" style="color:var(--c)">$${fmtUSD(ahorroUSD)}</div></div>
      <div class="kcard"><div class="klbl">Ahorro total ARS</div><div class="kval" style="color:var(--c)">$${fmtARS(ahorroARS)}</div></div>
      <div class="kcard"><div class="klbl">% Ahorro vs Ley</div><div class="kval" style="color:var(--c)">${pctAhorro.toFixed(1)}%</div></div>
      <div class="kcard"><div class="klbl">Pagado promedio</div><div class="kval">${pctProm.toFixed(1)}%</div></div>
      <div class="kcard"><div class="klbl">Indem. Ley USD</div><div class="kval" style="color:var(--dim)">$${fmtUSD(indemUSD)}</div></div>
    </div>

    <!-- RESUMEN POR AÑO -->
    <div class="card" style="margin-bottom:18px">
      <div style="padding:14px 18px;border-bottom:1px solid var(--border)">
        <span style="font-family:Poppins,sans-serif;font-size:13px;font-weight:700">Resumen por Año</span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>Año</th><th>Cant.</th><th>Pagado USD</th><th>Indem. Ley USD</th><th>Ahorro USD</th><th>% Ahorro</th>
          </tr></thead>
          <tbody>
            ${Object.entries(porAño).sort((a,b)=>parseInt(b[0])-parseInt(a[0])).map(([año,v])=>{
              const pct = v.indemUSD > 0 ? ((1 - v.montoUSD/v.indemUSD)*100) : 0;
              return `<tr>
                <td style="font-weight:700">${año}</td>
                <td>${v.cant}</td>
                <td>$${v.montoUSD.toLocaleString('es-AR',{maximumFractionDigits:0})}</td>
                <td>$${v.indemUSD.toLocaleString('es-AR',{maximumFractionDigits:0})}</td>
                <td style="color:var(--c);font-weight:600">$${v.ahorroUSD.toLocaleString('es-AR',{maximumFractionDigits:0})}</td>
                <td><span class="tag" style="background:rgba(15,123,74,.15);color:var(--c)">${pct.toFixed(1)}%</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <!-- RESUMEN POR MOTIVO Y SECTOR -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px">
      <div class="card">
        <div style="padding:14px 18px;border-bottom:1px solid var(--border)">
          <span style="font-family:Poppins,sans-serif;font-size:13px;font-weight:700">Por Motivo</span>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>Motivo</th><th>Cant.</th><th>Ahorro USD</th></tr></thead>
            <tbody>
              ${motivoArr.map(([m,v])=>`<tr>
                <td>${m}</td><td>${v.cant}</td>
                <td style="color:var(--c)">$${v.ahorroUSD.toLocaleString('es-AR',{maximumFractionDigits:0})}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div style="padding:14px 18px;border-bottom:1px solid var(--border)">
          <span style="font-family:Poppins,sans-serif;font-size:13px;font-weight:700">Top 10 Sectores</span>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>Sector</th><th>Cant.</th><th>Ahorro USD</th></tr></thead>
            <tbody>
              ${sectorArr.map(([s,v])=>`<tr>
                <td>${s}</td><td>${v.cant}</td>
                <td style="color:var(--c)">$${v.ahorroUSD.toLocaleString('es-AR',{maximumFractionDigits:0})}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- DETALLE -->
    <div class="card">
      <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
        <span style="font-family:Poppins,sans-serif;font-size:13px;font-weight:700">Detalle de Negociaciones</span>
        <span style="font-size:12px;color:var(--dim)">${total} registros</span>
      </div>
      <div style="overflow-x:auto;max-height:500px;overflow-y:auto">
        <table>

function inicioFmtF(f){ return String(f.getUTCDate()).padStart(2,'0') + '/' + String(f.getUTCMonth()+1).padStart(2,'0') + '/' + f.getUTCFullYear(); }

function inicioCalcular(varData, topes){
  const hoyL = new Date();
  const hoy = new Date(Date.UTC(hoyL.getFullYear(), hoyL.getMonth(), hoyL.getDate()));
  const en30 = new Date(hoy.getTime() + 30*86400000);
  const emps = filterBySucursal(getActiveEmployees());
  const porLegajo = {};
  emps.forEach(e => porLegajo[String(e['Legajo']).trim()] = e);
  const dias = (a, b) => Math.round((b - a) / 86400000);

  // Período de prueba (6 meses)
  const enPrueba = [], pruebaVence = [];
  // Hitos de antigüedad (5, 10 y 20 años)
  const hitos = [];
  let sumaAnt = 0, nAnt = 0;
  emps.forEach(e => {
    const ing = LIQ.parseFecha(e['Fecha Ingreso']);
    if(!ing) return;
    const fin = new Date(Date.UTC(ing.getUTCFullYear(), ing.getUTCMonth()+6, ing.getUTCDate()));
    if(fin > hoy){ enPrueba.push(e); if(fin <= en30) pruebaVence.push({ e, fecha: fin, faltan: dias(hoy, fin) }); }
    const ant = LIQ.antiguedad(ing, hoy); sumaAnt += ant.anios + ant.meses/12; nAnt++;
    const prox = ant.anios + 1;
    const aniv = new Date(Date.UTC(ing.getUTCFullYear()+prox, ing.getUTCMonth(), ing.getUTCDate()));
    if([5,10,20].includes(prox) && aniv > hoy && aniv <= en30){
      const que = prox === 5 ? 'pasa a 2 meses de preaviso y 21 días de vacaciones' : prox === 10 ? 'pasa a 28 días de vacaciones' : 'pasa a 35 días de vacaciones';
      hitos.push({ e, fecha: aniv, anios: prox, que, faltan: dias(hoy, aniv) });
    }
  });
  pruebaVence.sort((a,b) => a.fecha - b.fecha);
  hitos.sort((a,b) => a.fecha - b.fecha);

  // Variables habituales (solo administrador)
  let habituales = [], porVolverse = [];
  if(varData && varData.items){
    varData.items.forEach(v => {
      const e = porLegajo[String(v.legajo).trim()];
      if(!e) return;                 // fuera del filtro de sede o dado de baja
      (v.estado === 'habitual' ? habituales : porVolverse).push({ e, ...v });
    });
    const orden = (a,b) => b.promedio - a.promedio;
    habituales.sort(orden); porVolverse.sort(orden);
  }

  // Topes desactualizados (solo administrador)
  const topesViejos = [];
  if(topes){
    const ult = {};
    topes.forEach(t => {
      const conv = String(t['Convenio']||'').trim(); const d = LIQ.parseFecha(t['Vigencia desde']); const m = LIQ.numero(t['Tope']);
      if(!conv || !d || !m) return;
      if(!ult[conv] || d > ult[conv].d) ult[conv] = { conv, d, m };
    });
    Object.values(ult).forEach(t => {
      const meses = (hoy.getUTCFullYear()-t.d.getUTCFullYear())*12 + hoy.getUTCMonth()-t.d.getUTCMonth();
      if(meses > 3) topesViejos.push({ ...t, meses });
    });
  }
  const personasHab = new Set(habituales.map(h => h.legajo)).size;
  const personasPorV = new Set(porVolverse.map(h => h.legajo)).size;
  return { emps, enPrueba, pruebaVence, hitos, habituales, porVolverse, personasHab, personasPorV, topesViejos,
           antProm: nAnt ? sumaAnt/nAnt : 0, meses: varData ? varData.meses : [] };
}

function liqBuscarEmpleado(txt){
  const t = String(txt||'').trim();
  if(!t) return null;
  const leg = t.split('—')[0].trim();
  let e = (employees||[]).find(x => String(x['Legajo']).trim() === leg);
  if(e) return e;
  const q = t.toLowerCase();
  const matches = (employees||[]).filter(x => String(x['Nombre']||'').toLowerCase().includes(q));
  return matches.length === 1 ? matches[0] : (matches.length ? { _varios: matches } : null);
}

    });

  const anioAct = new Date().getFullYear();
  const filas = (liqCfg.neg||[]).map(n => ({
    anio: parseInt(n['Año'])||0, sector: String(n['Sector']||'').trim().toLowerCase(), sede: String(n['Sede']||'').trim().toLowerCase(),
    monto: parseFloat(n['Monto Negociado'])||0, indem: parseFloat(n['Indem Ley'])||0,
  })).filter(n => n.monto > 0 && n.indem > 0 && n.anio >= anioAct - 2);
  const prom = (arr) => arr.length ? arr.reduce((s,n)=>s + n.monto/n.indem*100, 0) / arr.length : null;
  const sector = String(emp['Sector']||'').trim().toLowerCase();
  const sede = String(emp['Ubicación']||'').trim().toLowerCase();
  const sameSede = filas.filter(n => n.sede && (sede.includes(n.sede) || n.sede.includes(sede)));
  return [
    { lbl: 'Todos (' + (anioAct-2) + '-' + anioAct + ')', n: filas.length, p: prom(filas) },
    { lbl: 'Sector ' + (emp['Sector']||''), n: filas.filter(n=>n.sector===sector).length, p: prom(filas.filter(n=>n.sector===sector)) },
    { lbl: 'Sede ' + (emp['Ubicación']||''), n: sameSede.length, p: prom(sameSede) },
  ];
}

function liqRender(pctLibre){
  if(!liqUltimo) return;
  const { r, emp } = liqUltimo;
  const R = r.rubros, E = r.escenarios;
  const out = document.getElementById('liq-out');
  const ant = r.antig;
  const antTxt = `${ant.anios} años, ${ant.meses} meses y ${ant.dias} días`;
  const fila = (lbl, a, c, nota) => `<tr><td>${lbl}${nota?`<div style="font-size:10px;color:var(--dim)">${nota}</div>`:''}</td>
    <td style="text-align:right">${a===null?'—':liqMoney(a)}</td><td style="text-align:right">${c===null?'—':liqMoney(c)}</td></tr>`;

  const pcts = [50,60,70,80,100];
  const pLibre = pctLibre != null ? pctLibre : (Number(document.getElementById('liq-pct')?.value) || 65);
  const filaArr = (p) => {
    const monto = E.sinCausa * p / 100;
    const bajo = monto < E.conCausa;
    return `<tr><td><strong>${p} %</strong></td><td style="text-align:right">${liqMoney(monto)}</td>
      <td style="text-align:right;color:var(--c)">${liqMoney(E.sinCausa - monto)}</td>
      <td>${bajo?'<span class="pill" style="background:rgba(232,25,17,.15);color:var(--d)">Menos que la liquidación final</span>':''}</td></tr>`;
  };
  const hist = liqHistorico(emp);

  const varRows = r.variables.length ? r.variables.map(v => `<tr><td>${escHtml(v.concepto)}</td><td style="text-align:center">${v.mesesCobrados} de ${r.mesesConDatos.length}</td>
     <td style="text-align:right">${liqMoney(v.prom6)}</td><td style="text-align:right">${liqMoney(v.prom12)}</td>
     <td style="text-align:right;${v.habitual?'':'color:var(--dim)'}">${v.habitual?liqMoney(v.usado):'—'}</td><td style="font-size:11px;color:var(--dim)">${v.criterio}</td></tr>`).join('')
     : '<tr><td colspan="6" style="color:var(--dim)">Sin conceptos variables.</td></tr>';
  const conceptosMes = r.conceptosMejorMes.map(c => `<tr><td>${escHtml(c[0])}</td><td>${c[2]==='NOREM'?'No remunerativo':'Fijo'}</td><td style="text-align:right">${liqMoney(c[1])}</td></tr>`).filter((x,i)=>r.conceptosMejorMes[i][2]!=='VARIABLE').join('');

  out.innerHTML = `
    <div class="fcard">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px">
        <div><div style="font-family:'Poppins',sans-serif;font-size:18px;font-weight:800">${escHtml(emp['Nombre'])}</div>
          <div style="color:var(--mid);font-size:12px;margin-top:4px">Legajo ${escHtml(String(emp['Legajo']))} · ${escHtml(emp['Sector']||'')} · ${escHtml(emp['Ubicación']||'')} · ${escHtml(emp['Convenio']||'')} ${emp['Categoria']?'· '+escHtml(emp['Categoria']):''}</div></div>
        <div style="text-align:right;font-size:12px;color:var(--mid)">Ingreso ${r.ingreso} · Egreso ${r.egreso}<br>Antigüedad: <strong style="color:var(--text)">${antTxt}</strong> → ${r.antig.aniosIndemn} ${r.antig.aniosIndemn===1?'año':'años'} para indemnizar</div>
      </div>
    </div>

    ${r.notas.map(n => `<div class="alert" style="background:rgba(217,119,6,.08);color:var(--w)">${escHtml(n)}</div>`).join('')}

    <div class="kgrid">
      <div class="kcard"><div class="klbl">Despido sin causa (art. 245)</div><div class="kval" style="font-size:22px">${liqMoney(E.sinCausa)}</div></div>
      <div class="kcard"><div class="klbl">Con causa / renuncia</div><div class="kval" style="font-size:22px">${liqMoney(E.conCausa)}</div></div>
      <div class="kcard"><div class="klbl">Base indemnizatoria</div><div class="kval" style="font-size:22px">${liqMoney(r.baseTopeada)}</div>
        <div style="font-size:11px;color:var(--dim)">${r.topeAplicado?(r.pisoAplicado?'Tope con piso del 67 % (Vizzoti)':'Con tope del convenio'):'Sin tope (la base no supera el tope)'}</div></div>
    </div>

    <div class="tcard"><div class="thead"><div class="ct">Liquidación por escenario</div></div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Rubro</th><th style="text-align:right">Sin causa</th><th style="text-align:right">Con causa / renuncia</th></tr></thead>
        <tbody>
          ${fila('Indemnización por antigüedad', R.indem245, null, `${liqMoney(r.baseTopeada)} × ${r.antig.aniosIndemn}`)}
          ${fila('Preaviso', R.preaviso, null, r.rubros.preaviso? `${r.mesesPreaviso} ${r.mesesPreaviso===1?'mes':'meses'} × ${liqMoney(r.sueldoNormal)}` : 'No corresponde o ya se otorgó')}
          ${fila('SAC sobre preaviso', R.sacPreaviso, null)}
          ${fila('Integración del mes de despido', R.integracion, null)}
          ${fila('SAC sobre integración', R.sacIntegracion, null)}
          ${fila('Días trabajados del mes', R.diasTrab, R.diasTrab)}
          ${fila('SAC proporcional', R.sacProp, R.sacProp, `${liqMoney(r.mejorSem)} ÷ 2 × ${r.diasSem}/${r.totalSem} días (mejor mes del semestre: ${r.mesMejorSem})`)}
          ${fila('Vacaciones no gozadas', R.vacaciones, R.vacaciones, `${r.diasVacAnio} días por ${r.antigVac} años de antigüedad × ${r.diasTrabAnio}/365 días trabajados en el año = ${r.vacProp.toLocaleString('es-AR')}${r.vacGozadas?` − ${r.vacGozadas} ya gozados`:''} → ${r.vacDias.toLocaleString('es-AR')} días × ${liqMoney(r.valorDiaVac)} (sueldo ÷ 25)`)}
          ${fila('SAC sobre vacaciones', R.sacVacaciones, R.sacVacaciones)}
          <tr style="font-weight:700"><td>Total bruto</td><td style="text-align:right">${liqMoney(E.sinCausa)}</td><td style="text-align:right">${liqMoney(E.conCausa)}</td></tr>
        </tbody></table></div></div>

    <div class="cgrid">
      <div class="cc"><div class="ct">Simulador de arreglo</div><div class="cs">Porcentaje sobre el total del despido sin causa (${liqMoney(E.sinCausa)})</div>
        <table><thead><tr><th>%</th><th style="text-align:right">Se paga</th><th style="text-align:right">Diferencia vs. sin causa</th><th></th></tr></thead>
        <tbody>${pcts.map(filaArr).join('')}
          <tr class="liq-noprint"><td><input class="sinput" type="number" id="liq-pct" min="0" max="150" step="1" value="${pLibre}" style="width:70px" oninput="liqRender(Number(this.value))"> %</td>
          <td style="text-align:right"><strong>${liqMoney(E.sinCausa*pLibre/100)}</strong></td><td style="text-align:right;color:var(--c)">${liqMoney(E.sinCausa - E.sinCausa*pLibre/100)}</td><td>${E.sinCausa*pLibre/100 < E.conCausa?'<span class="pill" style="background:rgba(232,25,17,.15);color:var(--d)">Menos que la liquidación final</span>':''}</td></tr>
        </tbody></table>
        <div style="font-size:11px;color:var(--dim);margin-top:10px">La liquidación final (${liqMoney(E.conCausa)}) se debe en cualquier caso: un arreglo por debajo de ese monto no la cubre.</div>
      </div>
      <div class="cc"><div class="ct">Referencia: arreglos anteriores</div><div class="cs">Hoja Negociaciones · % pagado = Monto negociado ÷ Indemnización de ley · últimos 3 años</div>
        <table><thead><tr><th>Grupo</th><th style="text-align:center">Casos</th><th style="text-align:right">% promedio</th><th style="text-align:right">Aplicado a este caso</th></tr></thead>
        <tbody>${hist.map(h => `<tr><td>${escHtml(h.lbl)}</td><td style="text-align:center">${h.n}</td><td style="text-align:right">${h.p==null?'—':liqPct(h.p)}</td><td style="text-align:right">${h.p==null?'—':liqMoney(E.sinCausa*h.p/100)}</td></tr>`).join('')}</tbody></table>
        <div style="font-size:11px;color:var(--dim);margin-top:10px">Ojo: en Negociaciones el % está calculado sobre la "Indem Ley" que se registró en cada caso, que puede no incluir los mismos rubros que este total.</div>
      </div>
    </div>

    <div class="tcard"><div class="thead"><div><div class="ct">Cómo se calculó la base</div>
      <div class="cs" style="margin:0">Mejor mes: ${r.mejorMes} · fijos ${liqMoney(r.mesFijo)} + no remunerativos ${liqMoney(r.mesNorem)} + variables habituales ${liqMoney(r.promVariables)} = <strong>${liqMoney(r.base)}</strong>
      ${r.tope?` · Tope ${escHtml(emp['Convenio']||'')}: ${liqMoney(r.tope)}${r.topeDesde?' (desde '+r.topeDesde+(r.topeFuente?', '+escHtml(r.topeFuente):'')+')':''}`:' · Sin tope cargado'}</div></div></div>
      <div style="overflow-x:auto"><table><thead><tr><th>Concepto del mejor mes</th><th>Tipo</th><th style="text-align:right">Monto</th></tr></thead><tbody>${conceptosMes||'<tr><td colspan="3">—</td></tr>'}</tbody></table></div>
      <div style="overflow-x:auto;border-top:1px solid var(--border)"><table><thead><tr><th>Concepto variable</th><th style="text-align:center">Meses cobrado</th><th style="text-align:right">Prom. 6 meses</th><th style="text-align:right">Prom. 12 meses</th><th style="text-align:right">Se toma</th><th>Criterio</th></tr></thead><tbody>${varRows}</tbody></table></div>
      <div style="padding:14px 18px;font-size:12px;color:var(--mid);border-top:1px solid var(--border)">
        Sueldo normal (para preaviso, días y vacaciones): último mes con datos (${r.ultimoMes}) + variables habituales = <strong>${liqMoney(r.sueldoNormal)}</strong>.
        Vacaciones: ${r.diasVacAnio} días por antigüedad × ${r.diasTrabAnio}/365 días trabajados en el año = ${r.vacProp.toLocaleString('es-AR')} días proporcionales.
        ${r.sinClasificar.length?'<br>Conceptos sin clasificar: '+escHtml(r.sinClasificar.join(', '))+'.':''}
      </div>
    </div>

    <div style="font-size:11px;color:var(--dim);line-height:1.6;margin-bottom:30px">
      Estimación para negociar: no reemplaza la liquidación oficial ni el asesoramiento legal. Montos brutos, antes de aportes y Ganancias.
      Criterios: art. 245 LCT según Ley 27.802 (sin SAC, vacaciones ni premios no mensuales; variables con 6+ meses de cobro; tope del CCT con piso del 67 %),
      sumas no remunerativas incluidas, viáticos de Camioneros excluidos, período de prueba de 6 meses. No incluye multas ni rubros por reclamos.
    </div>`;
  const inp = document.getElementById('liq-pct');
  if(pctLibre != null && inp){ inp.focus(); const v = inp.value; inp.value=''; inp.value=v; }
}

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw-hrnini.js').catch(() => {});
  });
}

// Si quedó una sesión abierta, entrar sin pedir la contraseña de nuevo
restaurarSesion();
</script>
