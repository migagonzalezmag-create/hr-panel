<div class="container" style="max-width:1400px;margin:0 auto;padding:24px">
  <div style="margin-bottom:24px">
    <h2 style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:8px">Planificación Horaria</h2>
    <p style="color:var(--mid);font-size:13px">Carga de horarios semanales, quincenales o mensuales</p>
  </div>

  <div style="display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;align-items:center">
    <div style="display:flex;gap:10px;align-items:center">
      <label style="font-size:12px;font-weight:600;color:var(--mid);text-transform:uppercase">Período:</label>
      <select id="pl-periodo" style="padding:8px 12px;background:var(--surface2,#161c2d);border:1px solid var(--border,#1e2640);color:var(--text,#e8eaf2);border-radius:8px;font-size:13px">
        <option value="SEMANAL">Semana</option><option value="QUINCENAL">Quincena</option><option value="MENSUAL">Mes</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <label style="font-size:12px;font-weight:600;color:var(--mid);text-transform:uppercase">Desde:</label>
      <input type="date" id="pl-fecha" style="padding:8px 12px;background:var(--surface2,#161c2d);border:1px solid var(--border,#1e2640);color:var(--text,#e8eaf2);border-radius:8px;font-size:13px">
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <label style="font-size:12px;font-weight:600;color:var(--mid);text-transform:uppercase">Sector:</label>
      <select id="pl-sector" style="padding:8px 12px;background:var(--surface2,#161c2d);border:1px solid var(--border,#1e2640);color:var(--text,#e8eaf2);border-radius:8px;font-size:13px">
        <option value="">Cargando...</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <label style="font-size:12px;font-weight:600;color:var(--mid);text-transform:uppercase">Tarea:</label>
      <select id="pl-tarea" style="padding:8px 12px;background:var(--surface2,#161c2d);border:1px solid var(--border,#1e2640);color:var(--text,#e8eaf2);border-radius:8px;font-size:13px">
        <option value="">Seleccionar sector</option>
      </select>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px">
    <div style="background:var(--surface,#111520);border:1px solid var(--border,#1e2640);border-radius:12px;padding:16px">
      <div style="font-size:11px;color:var(--dim,#6b738f);text-transform:uppercase;margin-bottom:6px">Total</div>
      <div style="font-family:'Syne',sans-serif;font-size:24px;font-weight:800" id="pl-t1">0</div>
    </div>
    <div style="background:var(--surface,#111520);border:1px solid var(--border,#1e2640);border-radius:12px;padding:16px">
      <div style="font-size:11px;color:var(--dim,#6b738f);text-transform:uppercase;margin-bottom:6px">Fijos</div>
      <div style="font-family:'Syne',sans-serif;font-size:24px;font-weight:800" id="pl-t2">0</div>
    </div>
    <div style="background:var(--surface,#111520);border:1px solid var(--border,#1e2640);border-radius:12px;padding:16px">
      <div style="font-size:11px;color:var(--dim,#6b738f);text-transform:uppercase;margin-bottom:6px">Rotativos</div>
      <div style="font-family:'Syne',sans-serif;font-size:24px;font-weight:800" id="pl-t3">0</div>
    </div>
    <div style="background:var(--surface,#111520);border:1px solid var(--border,#1e2640);border-radius:12px;padding:16px">
      <div style="font-size:11px;color:var(--dim,#6b738f);text-transform:uppercase;margin-bottom:6px">Total Hs</div>
      <div style="font-family:'Syne',sans-serif;font-size:24px;font-weight:800" id="pl-t4">0</div>
    </div>
  </div>

  <div style="background:var(--surface,#111520);border:1px solid var(--border,#1e2640);border-radius:14px;overflow:hidden;margin-bottom:20px">
    <div style="padding:16px 18px;border-bottom:1px solid var(--border,#1e2640);display:flex;justify-content:space-between;align-items:center">
      <h3 style="font-family:'Syne',sans-serif;font-size:13px;font-weight:700">Empleados</h3>
      <span id="pl-count">0</span>
    </div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse">
        <thead>
          <tr>
            <th style="text-align:left;padding:9px 12px;font-size:10px;font-weight:600;color:var(--dim,#6b738f);text-transform:uppercase;background:var(--surface2,#161c2d);border-bottom:1px solid var(--border,#1e2640)">Legajo</th>
            <th style="text-align:left;padding:9px 12px;font-size:10px;font-weight:600;color:var(--dim,#6b738f);text-transform:uppercase;background:var(--surface2,#161c2d);border-bottom:1px solid var(--border,#1e2640)">Nombre</th>
            <th style="text-align:left;padding:9px 12px;font-size:10px;font-weight:600;color:var(--dim,#6b738f);text-transform:uppercase;background:var(--surface2,#161c2d);border-bottom:1px solid var(--border,#1e2640)">Tipo</th>
            <th style="text-align:left;padding:9px 12px;font-size:10px;font-weight:600;color:var(--dim,#6b738f);text-transform:uppercase;background:var(--surface2,#161c2d);border-bottom:1px solid var(--border,#1e2640)">Lun</th>
            <th style="text-align:left;padding:9px 12px;font-size:10px;font-weight:600;color:var(--dim,#6b738f);text-transform:uppercase;background:var(--surface2,#161c2d);border-bottom:1px solid var(--border,#1e2640)">Mar</th>
            <th style="text-align:left;padding:9px 12px;font-size:10px;font-weight:600;color:var(--dim,#6b738f);text-transform:uppercase;background:var(--surface2,#161c2d);border-bottom:1px solid var(--border,#1e2640)">Mié</th>
            <th style="text-align:left;padding:9px 12px;font-size:10px;font-weight:600;color:var(--dim,#6b738f);text-transform:uppercase;background:var(--surface2,#161c2d);border-bottom:1px solid var(--border,#1e2640)">Jue</th>
            <th style="text-align:left;padding:9px 12px;font-size:10px;font-weight:600;color:var(--dim,#6b738f);text-transform:uppercase;background:var(--surface2,#161c2d);border-bottom:1px solid var(--border,#1e2640)">Vie</th>
            <th style="text-align:left;padding:9px 12px;font-size:10px;font-weight:600;color:var(--dim,#6b738f);text-transform:uppercase;background:var(--surface2,#161c2d);border-bottom:1px solid var(--border,#1e2640)">Sab</th>
            <th style="text-align:left;padding:9px 12px;font-size:10px;font-weight:600;color:var(--dim,#6b738f);text-transform:uppercase;background:var(--surface2,#161c2d);border-bottom:1px solid var(--border,#1e2640)">Dom</th>
            <th style="text-align:left;padding:9px 12px;font-size:10px;font-weight:600;color:var(--dim,#6b738f);text-transform:uppercase;background:var(--surface2,#161c2d);border-bottom:1px solid var(--border,#1e2640)">Total</th>
          </tr>
        </thead>
        <tbody id="pl-body">
          <tr><td colspan="11" style="text-align:center;padding:20px">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div style="display:flex;gap:16px;margin-top:20px">
    <button onclick="plEnviar()" style="padding:9px 18px;border-radius:10px;border:none;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer;background:linear-gradient(135deg,var(--a,#4f8ef7),var(--b,#7c5cbf));color:#fff">✅ Enviar a RH</button>
    <button onclick="plGuardar()" style="padding:9px 18px;border-radius:10px;border:1px solid var(--border,#1e2640);font-family:inherit;font-weight:600;font-size:12px;cursor:pointer;background:var(--surface2,#161c2d);color:var(--text,#e8eaf2)">💾 Guardar</button>
  </div>
</div>

<script>
(function() {
  const PL_URL = "https://script.google.com/macros/s/AKfycby9nJR5GZ3_1ZVm6HOMJBTF6vA8FOn_ioaL1rE7kOJbpKm_rCd4xcGR4yIgKdOSrjwvKQ/exec";
  let plEmpleados = [];
  let plTurnos = [];

  // Setear fecha
  const h = new Date();
  document.getElementById('pl-fecha').value = h.getFullYear() + '-' + String(h.getMonth()+1).padStart(2,'0') + '-' + String(h.getDate()).padStart(2,'0');

  // Cargar datos
  async function plCargar() {
    try {
      console.log('🚀 PL: Cargando empleados...');
      const r1 = await fetch(PL_URL + '?sheet=mod35071');
      const d1 = await r1.json();
      console.log('✅ PL: Empleados recibidos:', d1.length);
      
      plEmpleados = d1.map(e => ({
        legajo: String(e.Legajo || '').trim(),
        nombre: e.Nombre || '',
        sector: String(e.Sector || '').trim(),
        tarea: String(e.Tarea || '').trim(),
        tipo: String(e.HORARIO || '').toLowerCase() === 'rotativo' ? 'ROTATIVO' : 'FIJO'
      })).filter(e => e.legajo && e.nombre && e.sector && e.tarea);
      
      console.log('✅ PL: Empleados procesados:', plEmpleados.length);
      
      console.log('🚀 PL: Cargando turnos...');
      const r2 = await fetch(PL_URL + '?sheet=Turnos');
      const d2 = await r2.json();
      console.log('✅ PL: Turnos recibidos:', d2.length);
      
      plTurnos = d2.map(t => String(t.Codigo || '').trim()).filter(c => c);
      console.log('✅ PL: Turnos procesados:', plTurnos.length);
      
      plPoblar();
    } catch(e) {
      console.error('❌ PL ERROR:', e);
      document.getElementById('pl-body').innerHTML = '<tr><td colspan="11" style="color:#f75f5f;padding:20px;text-align:center">ERROR: ' + e.message + '</td></tr>';
    }
  }

  function plPoblar() {
    const secs = [...new Set(plEmpleados.map(e => e.sector))].sort();
    console.log('📊 PL: Sectores:', secs.length, secs);
    
    const sel = document.getElementById('pl-sector');
    sel.innerHTML = '<option value="">Seleccionar...</option>';
    secs.forEach(s => {
      const o = document.createElement('option');
      o.value = s; o.textContent = s;
      sel.appendChild(o);
    });
    
    document.getElementById('pl-body').innerHTML = '<tr><td colspan="11" style="text-align:center;padding:20px">Selecciona sector y tarea</td></tr>';
    
    sel.onchange = function() {
      const sector = this.value;
      if (!sector) {
        document.getElementById('pl-tarea').innerHTML = '<option value="">Seleccionar sector</option>';
        return;
      }
      const tareas = [...new Set(plEmpleados.filter(e => e.sector === sector).map(e => e.tarea))].sort();
      console.log('📊 PL: Tareas para', sector, ':', tareas);
      
      const st = document.getElementById('pl-tarea');
      st.innerHTML = '<option value="">Seleccionar...</option>';
      tareas.forEach(t => {
        const o = document.createElement('option');
        o.value = t; o.textContent = t;
        st.appendChild(o);
      });
    };
  }

  document.getElementById('pl-tarea').onchange = function() {
    const sector = document.getElementById('pl-sector').value;
    const tarea = this.value;
    if (!sector || !tarea) return;
    
    const emps = plEmpleados.filter(e => e.sector === sector && e.tarea === tarea);
    console.log('📋 PL: Empleados:', emps.length);
    
    let fijos = 0, rotativos = 0;
    emps.forEach(e => e.tipo === 'FIJO' ? fijos++ : rotativos++);
    
    document.getElementById('pl-t1').textContent = emps.length;
    document.getElementById('pl-t2').textContent = fijos;
    document.getElementById('pl-t3').textContent = rotativos;
    document.getElementById('pl-count').textContent = emps.length;
    
    const opts = '<option>--</option>' + plTurnos.map(t => '<option>' + t + '</option>').join('');
    const selStyle = 'padding:3px;background:#161c2d;border:1px solid #1e2640;color:#e8eaf2;border-radius:3px;font-size:10px';
    
    const body = document.getElementById('pl-body');
    body.innerHTML = '';
    emps.forEach(e => {
      const tr = document.createElement('tr');
      tr.innerHTML = 
        '<td style="padding:9px 12px;font-size:12px;border-bottom:1px solid rgba(30,38,64,.5)">' + e.legajo + '</td>' +
        '<td style="padding:9px 12px;font-size:12px;border-bottom:1px solid rgba(30,38,64,.5)">' + e.nombre + '</td>' +
        '<td style="padding:9px 12px;border-bottom:1px solid rgba(30,38,64,.5)"><span style="font-size:10px;padding:2px 6px;border-radius:4px;background:' + (e.tipo === 'FIJO' ? 'rgba(46,207,168,.15)' : 'rgba(247,163,79,.15)') + ';color:' + (e.tipo === 'FIJO' ? '#2ecfa8' : '#f7a34f') + '">' + e.tipo + '</span></td>' +
        '<td style="padding:9px 12px;border-bottom:1px solid rgba(30,38,64,.5)"><select style="' + selStyle + '">' + opts + '</select></td>' +
        '<td style="padding:9px 12px;border-bottom:1px solid rgba(30,38,64,.5)"><select style="' + selStyle + '">' + opts + '</select></td>' +
        '<td style="padding:9px 12px;border-bottom:1px solid rgba(30,38,64,.5)"><select style="' + selStyle + '">' + opts + '</select></td>' +
        '<td style="padding:9px 12px;border-bottom:1px solid rgba(30,38,64,.5)"><select style="' + selStyle + '">' + opts + '</select></td>' +
        '<td style="padding:9px 12px;border-bottom:1px solid rgba(30,38,64,.5)"><select style="' + selStyle + '">' + opts + '</select></td>' +
        '<td style="padding:9px 12px;border-bottom:1px solid rgba(30,38,64,.5)"><select style="' + selStyle + '">' + opts + '</select></td>' +
        '<td style="padding:9px 12px;border-bottom:1px solid rgba(30,38,64,.5)"><select style="' + selStyle + '">' + opts + '</select></td>' +
        '<td style="padding:9px 12px;text-align:center;font-weight:700;border-bottom:1px solid rgba(30,38,64,.5)">0</td>';
      body.appendChild(tr);
    });
  };

  // Funciones globales para botones
  window.plEnviar = function() { alert('✅ En desarrollo'); };
  window.plGuardar = function() { alert('💾 En desarrollo'); };

  // INICIAR CARGA
  plCargar();
  console.log('🎯 PL: Script ejecutado');
})();
</script>
